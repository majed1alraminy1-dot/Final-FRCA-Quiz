,"e":"In a hypotensive patient with decompensated liver disease, occult gastrointestinal bleeding is immediately life-threatening. Rectal examination may rapidly reveal melaena or blood and explain shock and confusion.","w":["CT may be needed later if head injury is suspected, but shock must be addressed first.","CORRECT","ABG is useful but early haemoglobin may not reveal acute blood loss.","Renal tests assess organ dysfunction but not the urgent cause.","Amylase does not address the most dangerous diagnosis."],"p":["Use an ABCDE approach.","Always consider variceal or other GI bleeding.","A normal early haemoglobin does not exclude haemorrhage.","Occult blood on rectal examination can rapidly focus management."],"m":"Confused, hypotensive cirrhotic patient: urgently exclude occult GI bleeding."},{"q":"The cardiologists have inserted a temporary transvenous pacing wire in an 83-year-old man in the intensive care unit.<br><br><strong>In which of the following scenarios is the urgent placement of a temporary cardiac pacing system the best treatment option?</strong>","o":["Verapamil overdose with shock","Incidental finding of a heart rate of 38 beats per minute, sinus rhythm with a PR interval of 260 ms and very frequent, multifocal, supraventricular and ventricular ectopic beats without shock","Hyperkalaemia with shock","A patient with a PR interval of 220 ms and left bundle branch block who requires emergency surgery under general anaesthesia","Second degree heart block with frequent pauses >2 seconds associated with syncope"],"a":4,"e":"Symptomatic second-degree block with recurrent pauses and syncope is the clearest indication for urgent temporary pacing.","w":["Treat calcium-channel blocker toxicity first with calcium and high-dose insulin therapy.","Asymptomatic bradycardia requires assessment, not urgent temporary pacing.","Hyperkalaemia requires immediate calcium, insulin/dextrose and potassium removal.","This conduction pattern warrants planning but not automatic temporary pacing.","CORRECT"],"p":["Treat reversible causes first.","Use transcutaneous pacing as a bridge when necessary.","Temporary transvenous pacing is for unstable or symptomatic high-grade block.","Syncope plus pauses >2 seconds is a strong pacing indication."],"m":"Second-degree block with syncope and pauses >2 seconds requires urgent pacing."},{"q":"A 24-year-old primagravid woman presents in the anaesthetic antenatal clinic for pre-assessment for a high body mass index (BMI). She is currently 26/40 pregnant and already has a BMI of 49.<br><br><strong>What is the best line of advice to give to her at this stage?</strong>","o":["Lose weight before the due date","Early intravenous access, early epidural for labour and risk of difficult neuraxial blockade or intubation in an emergency Caesarean section","Early intravenous access, remifentanil PCA for labour and risk of difficult intubation in an emergency Caesarean section","Aim for normal delivery without any anaesthetic intervention","Aim for normal delivery but be prepared for difficult epidural or spinal anaesthesia if needed"],"a":1,"e":"Severe obesity increases difficult IV access, difficult neuraxial placement, difficult mask ventilation and intubation. Early IV access and early labour epidural allow these problems to be managed before an emergency.","w":["Weight loss during pregnancy is not the main immediate anaesthetic advice.","CORRECT","Remifentanil PCA is not preferred over early epidural in severe obesity.","Normal delivery is desirable but planning must include likely anaesthetic difficulty.","Waiting until anaesthesia is urgently needed increases risk."],"p":["BMI ≥40 warrants antenatal anaesthetic review.","Plan early IV access.","Offer early epidural labour analgesia.","Explain difficult airway and neuraxial risks."],"m":"Severe maternal obesity: early IV access and early epidural."},{"q":"A 5-year-old 20 kg girl is scheduled for an elective adenotonsillectomy for obstructive sleep apnoea (OSA) as a day case. She has Trisomy 21. Her parents inform you that she snores when she sleeps. A recent sleep study showed significant periods of apnoea and desaturation, with an apnoea/hypopnoea index of 12 (severe OSA). An echocardiogram done in her first year of life showed normal intra-cardiac anatomy. Her thyroid function is also normal.<br><br><strong>The most important preoperative preparation for this case is:</strong>","o":["Check the full blood count for polycythaemia secondary to recurrent desaturations","Request a repeat echocardiogram","Arrange an inpatient bed so that the patient can be admitted overnight for respiratory monitoring postoperatively","Prescribe a sedative premedication","Apply local anaesthetic cream to potential sites for intravenous access"],"a":2,"e":"Severe OSA, Down syndrome and adenotonsillectomy create a high risk of postoperative airway obstruction. She requires overnight admission with respiratory monitoring.","w":["Polycythaemia testing is not the key preparation.","A repeat echo is unlikely to change management after a normal study without new symptoms.","CORRECT","Sedative premedication increases airway obstruction risk.","Topical local anaesthetic is useful but not the priority."],"p":["AHI >10 in children = severe OSA.","Down syndrome increases postoperative respiratory risk.","Use opioid-sparing analgesia.","Severe OSA requires overnight monitoring."],"m":"Severe paediatric OSA undergoing adenotonsillectomy is not a day-case."},{"q":"A 38 kg 14-year-old girl is in recovery after scoliosis correction surgery. Apart from idiopathic scoliosis, there is no other past medical history of note and no known drug allergies. She was given 7 mg of morphine near the end of surgery, and was started on a morphine patient controlled analgesia (PCA) with 1 mg bolus doses, 5 minute lock-out time, and 1 mg/hour background infusion.<br><br>After 4 hours of observation in recovery, she appears drowsy, but responds to voice. Her respiratory rate is 10 breaths per minute. On 2 L/min of oxygen via nasal cannulae her oxygen saturation is 96%. Her pupils measure 2 mm bilaterally, and are equally reactive to light. The PCA pump shows a total of 18 mg of morphine had been delivered with the most recent patient requested bolus an hour ago.<br><br><strong>The most appropriate immediate action is:</strong>","o":["Inform the ward to keep her on oxygen to maintain SpO₂ over 94%","Give a 2 μg/kg bolus dose of naloxone and repeat if necessary and reduce PCA bolus and background doses","Keep her in recovery for further observation","Request an arterial blood gas analysis from the arterial line","Ask the patient not to use the PCA for the next hour"],"a":1,"e":"She has opioid-induced drowsiness and respiratory depression. Titrate a small naloxone dose to improve ventilation while preserving analgesia, then reduce or remove the background infusion.","w":["Oxygen can mask hypoventilation and does not reverse opioid toxicity.","CORRECT","Observation alone risks further deterioration.","An ABG may quantify hypercapnia but should not delay treatment.","She has not activated the PCA for an hour; the background infusion is still delivering morphine."],"p":["Background PCA infusions increase respiratory-depression risk.","Naloxone has a shorter half-life than morphine.","Repeat naloxone may be required.","Titrate reversal to ventilation, not complete analgesia loss."],"m":"Drowsy child with slow breathing on morphine PCA: small naloxone dose and reduce PCA settings."},{"q":"A 4-year-old 18 kg boy fractured his left forearm and was put on the emergency theatre list for a manipulation under anaesthesia (MUA) and K-wire insertion. After induction of anaesthesia with fentanyl, propofol and atracurium, a laryngeal mask airway was inserted and the patient ventilated on oxygen, air and sevoflurane. You gave him 540 mg of co-amoxiclav intravenously. A few minutes later, his heart rate increased from 100 to 160 beats per minute, his oxygen saturation drops from 100% to 97% on 50% oxygen, and you cannot get an automated blood pressure reading. You noticed on auscultation that he has bilateral wheeze and a rash appears around the patient’s neck, arms and torso.<br><br><strong>Your first immediate action is:</strong>","o":["Increase the inspired oxygen concentration to 100%","Give chlorpheniramine 2.5 mg intravenously","Give an intravenous fluid bolus of 20 mL/kg 0.9% saline","Give adrenaline 10 μg/kg intramuscularly","Give epinephrine 1:10,000, 1 μg/kg intravenously"],"a":0,"e":"This is perioperative anaphylaxis. The first immediate action is to stop likely triggers, call for help, maintain the airway and increase inspired oxygen to 100%.","w":["CORRECT","Antihistamine is a secondary treatment.","Fluid resuscitation is essential but follows immediate oxygenation and airway measures.","IM adrenaline is used when IV access/monitoring is unavailable; this child already has IV access under anaesthesia.","IV adrenaline is required for cardiovascular collapse, but the first action listed is 100% oxygen."],"p":["Stop the suspected trigger.","Give 100% oxygen and call for help.","Use IV adrenaline 1 μg/kg in anaesthetised children with severe hypotension.","Give 20 mL/kg crystalloid and take tryptase samples later."],"m":"Perioperative anaphylaxis: first give 100% oxygen and stop the trigger."},{"q":"An 86-year-old woman is on the trauma list for a hemiarthroplasty following a mechanical fall. She weighs 45 kg and can manage two flights of stairs. Her ECG is unremarkable and a recent echocardiogram showed preserved left ventricular function with no significant valvular defects. Bloods show a haemoglobin of 101 g/L, platelets of 200 ×10⁹/L, normal coagulation studies and her creatinine is 87 μmol/L. She has a past medical history of hypertension, hypercholesterolaemia and ischaemic heart disease. She takes aspirin, clopidogrel, bisoprolol, ramipril and atorvastatin.<br><br><strong>What would be the most appropriate way to manage her postoperative pain relief?</strong>","o":["Combined spinal and epidural anaesthesia with intrathecal diamorphine and postoperative patient controlled epidural analgesia","Spinal anaesthesia with heavy bupivacaine; regular intravenous paracetamol and tramadol as required","General anaesthesia with a lumbar plexus block; regular oral paracetamol and ibuprofen","General anaesthesia with a fascia iliaca block; regular oral paracetamol and immediate release morphine as required","General anaesthesia with no regional component; regular paracetamol, ibuprofen and a morphine PCA"],"a":3,"e":"Dual antiplatelet therapy makes neuraxial and deep plexus techniques undesirable. A fascia iliaca block is superficial and opioid-sparing; combine it with paracetamol and cautious immediate-release morphine.","w":["Neuraxial catheter placement is unsafe with clopidogrel.","Tramadol is poorly tolerated in frail elderly patients and neuraxial anaesthesia is problematic.","Lumbar plexus block is deep and NSAIDs are undesirable in likely renal impairment.","CORRECT","No regional block increases opioid need; NSAIDs and PCA are poor choices in this frail patient."],"p":["Use multimodal analgesia for hip fracture.","Fascia iliaca block is opioid-sparing and relatively superficial.","Avoid neuraxial/deep blocks with clopidogrel.","Reduce paracetamol/opioid doses in low body weight and frailty."],"m":"Frail hip-fracture patient on clopidogrel: fascia iliaca block + paracetamol + cautious oral morphine."},{"q":"A 75-year-old man with severe debilitating osteoarthritis in both knees presents with worsening pain despite treatment with multiple analgesic medication including paracetamol, ibuprofen, oral morphine sulphate and buprenorphine patch. He is unfit for surgery, but is keen to try acupuncture for symptomatic relief.<br><br><strong>Which of the following would preclude his use of acupuncture?</strong>","o":["Insufficient Qi","Cellulitis over needle insertion site","Local anaesthetic hypersensitivity","Abnormal anatomy","Use of buprenorphine patch"],"a":1,"e":"Local cellulitis is a contraindication to acupuncture because needling may spread infection.","w":["‘Qi’ is a traditional concept and is not a contraindication.","CORRECT","Acupuncture does not require local anaesthetic.","Anatomical variation may alter technique but does not automatically preclude treatment.","Opioid use is not a contraindication."],"p":["Contraindications include refusal, poor cooperation and local infection.","Avoid needling through burns or cellulitis.","Severe coagulopathy is also a contraindication.","Complications include bleeding, infection and pneumothorax."],"m":"Never insert acupuncture needles through cellulitis."},{"q":"A 62-year-old woman presents with severe episodes of pain in the distribution of the right mandibular branch of the trigeminal nerve. The attacks are usually precipitated by cold wind and are short lived. She has no relief from paracetamol or tramadol, and is on no other medication.<br><br><strong>What would be the most appropriate first line treatment?</strong>","o":["Carbamazepine","Microvascular decompression","Percutaneous trigeminal continuous radiofrequency neurotomy","Gabapentin","Glycerol gangliolysis of the Gasserian ganglion"],"a":0,"e":"This is classical trigeminal neuralgia. Carbamazepine is the most effective first-line medical treatment.","w":["CORRECT","Microvascular decompression is reserved for refractory or intolerant cases.","Radiofrequency procedures are invasive second-line options.","Gabapentin is an alternative but is generally less effective than carbamazepine.","Glycerol gangliolysis is an invasive treatment for refractory disease."],"p":["Trigeminal neuralgia is brief, unilateral and electric-shock-like.","Common triggers include touch, shaving and cold wind.","Carbamazepine is first-line.","Investigate atypical features or young patients."],"m":"Classical trigeminal neuralgia: start carbamazepine."},{"q":"A 70-year-old patient develops pain after a stroke. He has weakness and sensory loss of his right arm and leg.<br><br><strong>Which feature of his pain is most accurate:</strong>","o":["Morphine is a good choice of analgesia for the acute phase","Pain as a result of the stroke is rare","He is unlikely to develop allodynia","Pain usually occurs in an area of altered sensation","A thalamic lesion has led to his post-stroke pain"],"a":3,"e":"Central post-stroke pain typically develops in a region with altered sensation and may include allodynia.","w":["Opioids usually have poor efficacy.","It occurs in a meaningful minority of stroke patients.","Allodynia is common.","CORRECT","Lesions anywhere along the spinothalamic pathway can cause it; it is not limited to the thalamus."],"p":["Central post-stroke pain is neuropathic.","Pain occurs in an area of sensory abnormality.","Allodynia is common.","Consider anticonvulsants such as lamotrigine."],"m":"Post-stroke pain usually occurs in an area of altered sensation."},{"q":"A 73-year-old man with advanced pancreatic cancer presents with worsening upper abdominal pain. Despite treatment with opioids and adjuvant medication, he has no pain relief and is being considered for a procedural intervention.<br><br><strong>Which of the following procedures is the most appropriate option for this patient?</strong>","o":["Thoracic epidural injection","Coeliac plexus block","Lumbar sympathetic plexus block","Superior hypogastric plexus block","Sphenopalatine ganglion block"],"a":1,"e":"Pancreatic and other upper abdominal visceral cancer pain is transmitted through the coeliac plexus, making coeliac plexus block the appropriate intervention.","w":["A thoracic epidural is not a durable targeted treatment for chronic pancreatic pain.","CORRECT","Lumbar sympathetic block is mainly for lower-limb vascular or neuropathic pain.","Superior hypogastric block targets pelvic pain.","Sphenopalatine block treats facial pain and headache."],"p":["Coeliac plexus block treats upper abdominal visceral pain.","It is commonly used for pancreatic cancer.","Continue background analgesics after the block.","Image guidance is required."],"m":"Pancreatic cancer pain refractory to opioids: coeliac plexus block."},{"q":"A 40-year-old man is fast-tracked through the emergency department with a penetrating eye injury. He is haemodynamically stable, has no other injuries, no past medical history and has not been fasted. He needs to undergo an urgent operation and you are due to perform the anaesthetic.<br><br><strong>Which of the following drugs should be avoided in this patient?</strong>","o":["Suxamethonium","Thiopentone","Rocuronium","Propofol","Ketamine"],"a":4,"e":"Ketamine raises arterial pressure and may increase intraocular pressure, so the book recommends avoiding it in an open-globe injury.","w":["Suxamethonium raises IOP transiently, but it may still be used for RSI when benefits outweigh risks.","Thiopentone reduces IOP.","Rocuronium does not raise IOP.","Propofol reduces IOP.","CORRECT"],"p":["Avoid coughing, straining and hypertension.","Propofol and thiopentone reduce IOP.","Rocuronium is a suitable RSI alternative.","Ketamine should be avoided in the book’s open-globe scenario."],"m":"Penetrating eye injury: avoid ketamine."},{"q":"You are called to review an 82-year-old man with type 2 diabetes in recovery. He underwent an uneventful right common femoral and popliteal angioplasty and stenting in the endovascular radiology suite. The procedure took approximately 8 hours. The nurse is concerned because he continues to ooze from the right groin despite continuous application of pressure on the wound site.<br><br><strong>What would be the next step in diagnosing the potential cause of his ongoing bleeding?</strong>","o":["Check his haemoglobin","Perform an arterial blood gas","Check his blood sugar","Check activated clotting time (ACT)","Check his core temperature"],"a":4,"e":"An 8-hour radiology procedure creates a major risk of hypothermia, which impairs coagulation enzyme function and causes diffuse oozing. Check core temperature first.","w":["Haemoglobin quantifies blood loss but does not identify the cause.","ABG may show acidosis but does not directly diagnose hypothermic coagulopathy.","Glucose is unrelated to the bleeding.","ACT is not validated for the low heparin doses used in this setting.","CORRECT"],"p":["Hypothermia impairs platelet and coagulation function.","Long procedures outside theatre are high risk for heat loss.","Measured clotting tests may appear normal if the sample is warmed in the laboratory.","Actively warm the patient and fluids."],"m":"Persistent oozing after a prolonged procedure: check core temperature."},{"q":"A 23-year-old man for elective foot surgery is to have a popliteal nerve block for postoperative analgesia. You use an ultrasound-guided technique and infiltrate 20 mL of 0.5% bupivacaine.<br><br><strong>Which of the following nerve fibre modalities is most likely to be blocked first once the local anaesthetic has been infiltrated?</strong>","o":["Touch and pressure","Motor","Pain and temperature","Preganglionic autonomic","Proprioception and muscle tone"],"a":3,"e":"Small myelinated B fibres are the most sensitive to local anaesthetic, so preganglionic autonomic fibres are blocked first.","w":["Touch and pressure are carried by larger Aβ fibres.","Motor fibres are large Aα fibres and are blocked later.","Pain fibres are blocked early but after B fibres.","CORRECT","Proprioception is carried by Aγ fibres and is blocked later."],"p":["Block order: B fibres, then C fibres, then A fibres.","Small diameter increases sensitivity.","Myelination also increases sensitivity.","Sympathetic block precedes sensory and motor block."],"m":"Local anaesthetic block order starts with preganglionic autonomic B fibres."},{"q":"A 78-year-old patient is admitted to the intensive care unit following an exacerbation of chronic obstructive pulmonary disease (COPD). He has known prolonged QTc syndrome. His list of medications includes salbutamol, nifedipine for hypertension, glyceryl trinitrate for ischaemic heart disease and digoxin and warfarin for atrial fibrillation. Whilst on the intensive care unit he requires an amiodarone infusion for fast atrial fibrillation and intravenous cefuroxime for a suspected chest infection. He has now developed ‘torsades de pointes’ syndrome.<br><br><strong>Which one of his medications would most likely have been responsible for the dysrhythmia?</strong>","o":["Salbutamol","Nifedipine","Digoxin","Amiodarone","Cefuroxime"],"a":3,"e":"Amiodarone prolongs the QT interval and can precipitate torsades de pointes in a patient with pre-existing long-QT syndrome.","w":["Salbutamol may lower potassium but is not the most direct culprit.","Nifedipine does not usually prolong QT.","Digoxin causes other dysrhythmias but not classic torsades through QT prolongation.","CORRECT","Cefuroxime does not typically prolong QT."],"p":["Torsades is polymorphic VT with prolonged QT.","Correct potassium and magnesium.","Stop QT-prolonging drugs.","Treat unstable torsades with defibrillation."],"m":"Long-QT patient who develops torsades after amiodarone: stop amiodarone."},{"q":"Two days following a right hemicolectomy for bowel carcinoma, a 64-year-old man develops breathlessness and pleuritic chest pain. His observations reveal:<br><br>• Pulse rate 88 beats per minute<br>• Blood pressure 120/74 mmHg<br>• Oxygen saturation 94% on 2 L/minute of oxygen<br><br>His heart sounds are normal and chest sounds are clear.<br><br><strong>Which one of the following investigations would be the most appropriate to confirm a diagnosis in this scenario:</strong>","o":["12-lead ECG","CT angiography","Transoesophageal echocardiography","Serum D-dimer","Arterial blood gas"],"a":1,"e":"He is haemodynamically stable with a high clinical probability of postoperative pulmonary embolism. CT pulmonary angiography is the best confirmatory test.","w":["ECG may show right-heart strain but lacks sensitivity and specificity.","CORRECT","TOE is reserved for patients too unstable for CT and is not the standard diagnostic test.","D-dimer is frequently elevated after surgery and cancer, so it is unhelpful.","ABG may show hypoxaemia but cannot confirm PE."],"p":["Use CTPA in stable suspected PE.","D-dimer is unreliable postoperatively.","Use bedside echocardiography when the patient is unstable.","Do not delay treatment in shocked patients with high clinical suspicion."],"m":"Stable postoperative patient with suspected PE: confirm with CT pulmonary angiography."}],"5":[{"q":"An asthmatic 40-year-old woman with myasthenia gravis (MG) presents for a multi-level lumbar decompression. She was diagnosed with MG 8 years ago, has difficulty with swallowing solids, and her current medication includes pyridostigmine 720 mg/day and her forced vital capacity (FVC) is 2.9 litres.<br><br><strong>Which of the following is most likely to predict her requirement for a period of postoperative ventilation?</strong>","o":["Bulbar symptoms","Pyridostigmine use of 720 mg/day","FVC of 2.9 litres","Duration of disease >6 years","Concurrent history of asthma"],"a":3,"e":"Among the recognised predictors, disease duration over 6 years has the greatest predictive value for postoperative ventilation.","w":["Bulbar symptoms are clinically important but are not the strongest predictor listed.","The risk threshold is pyridostigmine >750 mg/day; she takes 720 mg/day.","The risk threshold is FVC <2.9 L; her value is exactly 2.9 L.","CORRECT","Chronic respiratory disease increases risk, but duration >6 years is the strongest predictor."],"p":["Risk factors: MG >6 years, chronic lung disease, pyridostigmine >750 mg/day and FVC <2.9 L.","Continue usual anticholinesterase therapy where appropriate.","Avoid drugs that worsen neuromuscular transmission.","Plan postoperative respiratory support early."],"m":"MG duration >6 years is the strongest listed predictor of postoperative ventilation."},{"q":"You are anaesthetising a 68-year-old patient for bowel resection for sub-acute obstruction. He had been vomiting intermittently for 3 days. After induction of anaesthesia he became hypotensive so you commenced a noradrenaline infusion which is currently running at 0.2 μg/kg/min. A thoracic epidural has been sited but only a test dose has been given so far. Blood pressure is 110/70 and capillary refill time is 4 seconds. An oesophageal Doppler is in situ.<br><br>Stroke volume (SV) = 30 mL (60–100 mL)<br>Flow time corrected (FTc) = 250 ms (330–360 ms)<br>Cardiac output (CO) = 3.3 L/min (4–8 L/min)<br>Peak velocity (PV) = 22 cm/s (50–80 cm/s)<br>Heart rate = 115 bpm<br><br><strong>Based on the waveform and data shown in Figure 5.1, what is the appropriate first course of action?</strong>","o":["Increase the noradrenaline infusion","Commence a dobutamine infusion","Commence the epidural infusion and leave the noradrenaline","Commence a GTN infusion and leave the noradrenaline","Administer 250 mL of Hartmann’s solution and decrease the noradrenaline"],"a":4,"e":"Low stroke volume, FTc and cardiac output after vomiting suggest hypovolaemia masked by vasoconstriction. Give a small fluid challenge and reduce excessive afterload.","w":["More noradrenaline may worsen afterload and low output.","Dobutamine may worsen tachycardia before preload is corrected.","Starting the epidural before correcting volume may cause severe hypotension.","GTN would further reduce vascular tone before preload correction.","CORRECT"],"p":["Low FTc suggests low preload.","Low PV may reflect poor contractility or high afterload.","Use a 250 mL fluid challenge and reassess stroke volume.","Treat hypovolaemia before activating an epidural."],"m":"Low FTc + low SV in a vomiting patient: give a fluid challenge before more vasopressor."},{"q":"A patient in the cardiac intensive care unit suffers a cardiac arrest following three vessel coronary artery bypass grafting. He has epicardial pacing wires with the box set to DDD. The monitor shows pulseless electrical activity with pacing spikes. Cardiopulmonary resuscitation (CPR) is commenced.<br><br><strong>What is the most appropriate next step?</strong>","o":["1 mg adrenaline IV","300 mg bolus of amiodarone","Institution of external pacing","Exclusion of a tension pneumothorax","Turn off the pacemaker"],"a":4,"e":"Pacing spikes can hide an underlying shockable rhythm. Turn off pacing immediately to reveal the native rhythm and defibrillate if VF is present.","w":["Large adrenaline doses are not the first step after cardiac surgery and may cause rebound hypertension.","Amiodarone follows failed shocks for VF, not before rhythm identification.","External pacing is unnecessary while epicardial wires are already present.","Reversible causes are assessed after revealing the underlying rhythm.","CORRECT"],"p":["Post-cardiac-surgery arrest often has a reversible cause.","Turn off pacing to identify hidden VF.","Use rapid sequential shocks for VF according to cardiac surgical arrest protocols.","Consider tamponade, bleeding and tension pneumothorax."],"m":"Post-CABG arrest with paced PEA: switch off pacing and inspect the underlying rhythm."},{"q":"A 70-year-old smoker with limited mouth opening having previously undergone a neck dissection with adjuvant radiotherapy is scheduled for surgery to treat his right middle lobe tumour. A difficult airway is anticipated and it is likely that postoperative ventilatory support will be required.<br><br><strong>Which of the following is the most appropriate airway management strategy?</strong>","o":["Fibreoptic intubation with a single-lumen tube and a right sided bronchial blocker","Fibreoptic intubation with a single lumen tube and a left sided bronchial blocker","Videolaryngoscopy and insertion of a left sided double-lumen tube","Fibreoptic left sided endobronchial intubation with a single-lumen tube","Awake tracheostomy and insertion of right sided double-lumen endobronchial tracheostomy tube"],"a":0,"e":"An awake fibreoptic single-lumen intubation is safest for the difficult airway. A right-sided bronchial blocker isolates the operative right lung and avoids a risky tube exchange postoperatively.","w":["CORRECT","A left-sided blocker would isolate the non-operative lung.","A large DLT is difficult to insert with limited mouth opening.","Left endobronchial intubation does not offer controlled lobar isolation and suction access.","Previous surgery and radiotherapy make tracheostomy difficult and unnecessary."],"p":["Bronchial blockers are useful in difficult airways.","They avoid postoperative exchange from a DLT to a single-lumen tube.","Place the blocker in the operative-side bronchus.","Confirm position with bronchoscopy."],"m":"Difficult airway + planned postoperative ventilation: single-lumen tube plus bronchial blocker."},{"q":"A 75-year-old man is to have a cystoscopy and bladder biopsy as a day surgery case. He has a 40 pack year history of smoking. Recent spirometry has shown his FEV₁/FVC is 0.6, and echocardiography has shown an ejection fraction of 40%. He has been consented for a spinal anaesthetic.<br><br><strong>What is the most appropriate solution for the spinal injection?</strong>","o":["Hyperbaric bupivacaine 0.5% 2 mL","Hyperbaric bupivacaine 0.5% 2 mL with 300 μg diamorphine","Plain bupivacaine 0.5% 2 mL with 10 μg fentanyl","Hyperbaric prilocaine 2% 2 mL with 10 μg fentanyl","Hyperbaric lignocaine 2% 2 mL with 10 μg fentanyl"],"a":3,"e":"Hyperbaric prilocaine provides a rapid, predictable, short-duration spinal suitable for day surgery. A small fentanyl dose improves analgesia without prolonged motor block.","w":["Bupivacaine may delay mobilisation and urination.","Diamorphine increases pruritus, nausea and delayed respiratory depression.","Plain bupivacaine has less predictable spread and longer duration.","CORRECT","Lignocaine is associated with transient neurological symptoms, especially in lithotomy."],"p":["Prilocaine is useful for ambulatory spinal anaesthesia.","Keep the block selective and short acting.","Low-dose fentanyl enhances spinal analgesia.","Ensure return of motor function, proprioception and voiding before discharge."],"m":"Day-case urology spinal: hyperbaric prilocaine with a small fentanyl dose."},{"q":"You are asked to review a confused 72-year-old man in recovery. He has had a transurethral resection of his prostate for benign prostatic hyperplasia (BPH). A brief assessment reveals him to be disorientated in time and place, and restless. Whilst you review his anaesthetic chart he has a short seizure, which resolves spontaneously.<br><br><strong>After assessing his airway breathing and circulation, which of the following would be the best immediate management:</strong>","o":["Administration 2 mg of intravenous midazolam","Starting an infusion of magnesium sulphate","Sending an urgent U&Es, FBC and osmolality, and prepare intravenous lorazepam in case of further seizure","Administering 20–40 mg of intravenous frusemide","Infusing 1–2 mL/kg 3% NaCl"],"a":2,"e":"This suggests TURP syndrome. The seizure has stopped, so urgently define sodium, osmolality and volume status while preparing lorazepam if seizures recur.","w":["A self-limiting seizure does not automatically need midazolam.","Magnesium is a second-line treatment for persistent glycine-related seizures.","CORRECT","Furosemide is reserved for pulmonary oedema from fluid overload.","Hypertonic saline should not be given blindly before confirming severe symptomatic hyponatraemia."],"p":["TURP syndrome results from irrigation-fluid absorption.","Symptoms depend more on osmolality change than sodium alone.","Correct sodium slowly—generally ≤1 mmol/L/hour.","Use hypertonic saline only for severe symptomatic hyponatraemia."],"m":"After a self-terminating TURP seizure: check sodium and osmolality urgently before empirical correction."},{"q":"An obese 45-year-old woman with progressive conductive hearing loss secondary to chronic suppurative otitis media is due to undergo tympanoplasty. During the preoperative safety check list, the team is informed by the surgeon that intubation and facial nerve monitoring is required.<br><br><strong>Which of the following would be the most appropriate to use as part of your anaesthetic technique?</strong>","o":["Remifentanil infusion","Ketamine bolus","Nitrous oxide","Clonidine infusion","Magnesium sulphate infusion"],"a":0,"e":"Remifentanil permits controlled ventilation without neuromuscular blockade, facilitates facial nerve monitoring, provides hypotensive anaesthesia and allows a smooth emergence.","w":["CORRECT","Ketamine increases sympathetic tone, bleeding and secretions.","Nitrous oxide expands middle-ear gas and may displace the graft.","Clonidine reduces sympathetic tone but does not reliably replace muscle relaxation.","Magnesium impairs neuromuscular transmission and may interfere with monitoring."],"p":["Avoid nitrous oxide in middle-ear surgery.","Use TIVA to reduce PONV and improve the surgical field.","Facial nerve monitoring requires avoiding neuromuscular blockade.","Remifentanil helps provide a cough-free emergence."],"m":"Facial nerve monitoring during tympanoplasty: remifentanil is the most useful adjunct."},{"q":"A 63-year-old man with a confirmed inherited pseudocholinesterase deficiency (EuEa) is attending for his first course of electroconvulsive therapy.<br><br><strong>Which of the following drug combinations is most appropriate for his induction of anaesthesia?</strong>","o":["Propofol and mivacurium","Propofol and rocuronium","Propofol and alfentanil","Thiopentone and rocuronium","Thiopentone and alfentanil"],"a":1,"e":"Propofol provides rapid induction and recovery. Rocuronium avoids prolonged paralysis from pseudocholinesterase deficiency and can be reversed with sugammadex.","w":["Mivacurium is metabolised by pseudocholinesterase and may cause prolonged paralysis.","CORRECT","An opioid does not provide the required muscle relaxation.","Thiopentone may reduce seizure duration and has slower recovery.","Alfentanil does not replace neuromuscular blockade."],"p":["Avoid suxamethonium and mivacurium in pseudocholinesterase deficiency.","Use a short-acting non-depolarising relaxant.","Sugammadex allows rapid reversal of rocuronium.","Use a low propofol dose to minimise seizure shortening."],"m":"Pseudocholinesterase deficiency: avoid suxamethonium/mivacurium; use propofol + rocuronium."},{"q":"A 70-year-old man is scheduled for foot surgery under general anaesthesia and a sciatic nerve block. There are no ultrasound machines available and you decide on a landmark technique to perform the block.<br><br><strong>Which one of the following described techniques results in the most proximal approach to performing a sciatic nerve block?</strong>","o":["Mansour’s approach","Raj’s approach","Labat’s approach","Beck’s approach","Guardini’s approach"],"a":0,"e":"Mansour’s parasacral approach targets the sciatic nerve and sacral plexus at the most proximal level.","w":["CORRECT","Raj’s approach is a more distal subgluteal technique.","Labat’s is a transgluteal approach.","Beck’s is an anterior thigh approach.","Guardini’s is subtrochanteric and more distal."],"p":["Mansour = parasacral and most proximal.","It may also block the posterior femoral cutaneous nerve.","Use a long insulated needle because the target is deep.","Popliteal approaches are the most distal."],"m":"The most proximal sciatic block is Mansour’s parasacral approach."},{"q":"A 68-year-old man with emphysema is listed for elbow surgery under regional anaesthesia.<br><br><strong>Which of the following would be the most appropriate nerve block for this patient?</strong>","o":["Interscalene brachial plexus block","Supraclavicular brachial plexus block","Medial infraclavicular brachial plexus block","Axillary brachial plexus block","Mid-arm peripheral nerve block"],"a":3,"e":"The axillary block avoids phrenic nerve palsy and pneumothorax, making it the safest brachial plexus approach in significant lung disease.","w":["Interscalene block almost always causes hemidiaphragmatic paralysis.","Supraclavicular block carries a pneumothorax risk.","Medial infraclavicular block also carries a pneumothorax risk.","CORRECT","Multiple mid-arm blocks are less practical and may not cover the tourniquet."],"p":["Axillary block targets terminal branches.","Supplement the musculocutaneous nerve if needed.","It avoids phrenic nerve palsy.","It is appropriate for elbow, forearm and hand surgery."],"m":"Respiratory compromise: choose an axillary block to avoid phrenic palsy and pneumothorax."},{"q":"You have been called to assist in the care of a 17-year-old girl who has become increasingly agitated in the emergency department. She has a history of mental illness and has recently been behaving strangely. Now her actions are violent and compromising her safety and that of those around her. You are unable to assess her formally, and she has not had any blood tests, intravenous access or observations. Security officers are present, and the emergency department registrar tells you he would like to perform bloods, a CT head and a lumbar puncture. The plan has been approved by the girl’s mother and the paediatric consultant.<br><br><strong>How will you proceed?</strong>","o":["Use security staff to hold the patient, insert intravenous access, and give 2 mg midazolam and 2 μg/kg fentanyl in the room","Use security staff to hold the patient, and give intramuscular 4 mg/kg ketamine, then transfer to the resuscitation bay","Do nothing, and refuse to get involved with this case","Encourage her to take 20 mg oral temazepam and review","Using security staff to hold the patient, transfer to theatre, and perform an inhalational induction with sevoflurane"],"a":1,"e":"IM ketamine minimises the duration of restraint, uses one reliable agent and allows safe transfer to a monitored resuscitation area for IV access and investigations.","w":["Restraint for IV access plus midazolam and fentanyl is prolonged and increases respiratory risk.","CORRECT","She lacks capacity and urgent treatment may proceed in her best interests.","Oral medication is unlikely to be accepted or reliable.","Moving an uncontrolled violent patient to theatre for inhalational induction is impractical and unsafe."],"p":["Use restraint only as a last resort and with trained staff.","Use the minimum force and duration required.","IM ketamine is useful when IV access is impossible.","Move promptly to full monitoring and airway equipment."],"m":"Violent uncooperative adolescent needing urgent investigation: IM ketamine, then monitored resuscitation care."},{"q":"A 34-year-old man sustained a traumatic brain injury 3 days ago and is currently intubated and ventilated on the intensive care unit. The nurse informs you during your daily review that the plasma sodium concentration is 121 mmol/L.<br><br><strong>What other piece information would be most useful in establishing the cause?</strong>","o":["Urine output volume measurement","Central venous pressure measurement","Degree of peripheral oedema","Urinary osmolarity measurement","Plasma osmolarity measurement"],"a":0,"e":"Urine output is the most useful bedside discriminator: cerebral salt wasting usually causes high urine output and hypovolaemia, whereas SIADH causes low urine output.","w":["CORRECT","A single CVP value is unreliable for volume assessment.","Peripheral oedema does not reliably indicate intravascular volume.","Urine osmolality may be high in both conditions.","Plasma osmolality may be low or normal in both."],"p":["CSWS: high urine output and hypovolaemia.","SIADH: low urine output and eu-/hypervolaemia.","Do not correct sodium too rapidly.","Use fluid balance plus urine sodium/osmolality for confirmation."],"m":"Hyponatraemia after brain injury: urine volume best separates CSWS from SIADH."},{"q":"A 13-year-old boy presented to the emergency department with acute severe asthma 1 hour ago. His usual peak expiratory flow (PEF) is 68%, and takes long acting β₂ agonist and high dose corticosteroid inhalers with montelukast tablets. You are called for advice as despite 4 × 2.5 mg nebulised salbutamol, 500 μg nebulised ipratropium and 40 mg of soluble prednisolone the patient’s PEF remains 35% predicted, respiratory rate 32 per minute, speaking words, SpO₂ 93% on 10 L/min of warm humidified supplemental oxygen and transcutaneous carbon dioxide level of 5.1 kPa.<br><br><strong>Which of the following should be the next intervention?</strong>","o":["Rapid sequence induction using thiopentone and suxamethonium followed by positive pressure ventilation using isoflurane","Commence an intravenous salbutamol infusion at 10 μg/minute","Give 20 mmol of intravenous magnesium sulphate over 10–20 minutes","Give a further 5 mg nebulised salbutamol","Give a loading dose of 5 mg/kg aminophylline followed by an infusion at 500 μg/kg/hour"],"a":2,"e":"He has acute severe asthma inadequately responsive to optimal inhaled first-line treatment. IV magnesium is the appropriate next escalation before invasive ventilation or IV bronchodilators.","w":["Intubation is hazardous and not yet indicated.","IV salbutamol has more adverse effects and limited evidence at this stage.","CORRECT","Further nebulised salbutamol is unlikely to add benefit after repeated doses.","Aminophylline is not preferred before IV magnesium."],"p":["IV magnesium is used for severe asthma failing initial therapy.","A normal or rising PaCO₂ is concerning.","Intubate only for exhaustion, reduced consciousness or arrest.","Continue oxygen, bronchodilators and steroids."],"m":"Severe asthma not responding to nebulisers: give IV magnesium before IV bronchodilators."},{"q":"During the high dependency unit ward round you are called to the bedside of a 64-year-old gentleman with a background of hypertension who is awaiting primary angioplasty planned for the following day after being admitted with a non-ST segment elevation myocardial infarction. He is feeling anxious and has central chest pain. The heart rate has recently increased to 150 beats per minute and the blood pressure is 90/60 mmHg. The ECG shows atrial fibrillation and widespread ST segment depression.<br><br><strong>What is your immediate course of action?</strong>","o":["Ring the anaesthetist on call and arrange for direct current cardioversion in theatre","Ring the anaesthetist on call and arrange for direct current cardioversion on the HDU","Administer amiodarone 300 mg intravenously over 30 minutes","Administer 2 g intravenous magnesium and optimise the serum potassium concentration","Ring the cardiologist on call and organise an urgent angiography"],"a":3,"e":"In critically ill patients with new AF, magnesium is safe, causes less hypotension than amiodarone and is effective for rate/rhythm control while potassium is corrected.","w":["Transfer to theatre delays treatment and cardioversion has a high recurrence rate in this setting.","Cardioversion may be considered if peri-arrest, but reversible precipitants should be corrected first.","Amiodarone may worsen hypotension.","CORRECT","Angiography may be needed, but the arrhythmia and electrolytes should first be stabilised."],"p":["Correct magnesium and potassium in new-onset AF.","Magnesium is often safer than amiodarone in hypotension.","Treat hypoxia, ischaemia, sepsis and volume disturbance.","Use synchronised cardioversion for peri-arrest instability."],"m":"Acute AF in critical illness: correct Mg²⁺ and K⁺ first unless peri-arrest."},{"q":"A 72-year-old man on the intensive care unit has an APACHE II score of 48.<br><br><strong>Which of the following variables is the most heavily weighted in intensive care severity of illness scoring systems?</strong>","o":["Age","Glasgow coma scale","Systolic blood pressure / dose of vasopressor","PaO₂:FiO₂ ratio","Arterial lactate concentration"],"a":1,"e":"Neurological status is highly predictive of mortality. GCS forms about one quarter of the APACHE II acute physiology score.","w":["Age contributes but is less heavily weighted.","CORRECT","Blood pressure and vasopressor use matter but carry less weight than GCS across common systems.","The PF ratio contributes to respiratory scoring but is not the most heavily weighted.","Lactate is important clinically but is not the dominant component in APACHE II."],"p":["GCS is a major component of APACHE and SAPS scores.","APACHE II uses 15 minus actual GCS.","Severity scores estimate group risk, not individual prognosis.","Do not use scoring systems alone for treatment limitation."],"m":"GCS is the most heavily weighted variable in many ICU severity scores."},{"q":"A 34-year-old woman with end-stage liver disease due to autoimmune hepatitis presents with a 2-day history of productive cough and breathlessness and has been commenced on antibiotics for a chest infection. She has stigmata of decompensated liver disease with peripheral oedema and ascites. Her blood pressure is 70/40 mmHg, her heart rate is 130 beats per minute and her temperature 38.9°C. An arterial blood gas analysis returned a lactate concentration of 6.8 mmol/L.<br><br><strong>Which of the following treatment options do you administer first?</strong>","o":["20 mL/kg Hartmann’s solution","20 mL/kg 0.9% sodium chloride","10 mL/kg gelofusine","10 mL/kg human albumin solution 20%","Commence vasopressor support as soon as possible"],"a":1,"e":"Despite oedema and ascites, cirrhotic patients may be profoundly intravascularly depleted. The book’s first intervention is a rapid crystalloid bolus with 0.9% saline.","w":["Hartmann’s contains lactate, which may be poorly metabolised in severe liver failure.","CORRECT","Gelatin has no clear advantage and may worsen renal injury or cause allergy.","20% albumin is hyperoncotic and not the initial resuscitation choice.","Vasopressors should follow assessment of response to adequate fluid resuscitation."],"p":["Total-body fluid excess can coexist with intravascular depletion.","Treat septic shock promptly.","Use careful boluses with repeated reassessment.","Start vasopressors if hypotension persists after fluid."],"m":"Decompensated cirrhosis with septic shock still requires prompt intravascular volume resuscitation."},{"q":"A 29-year-old woman, with a history of rheumatic fever is undergoing a category 1 Caesarean section under general anaesthesia for cord prolapse. After delivery of the baby and placenta, the estimated blood loss is 1100 mL. The patient receives a total of 10 IU of syntocinon intravenously plus 10 IU/hour intravenous syntocinon infusion, intravenous ergometrine 500 μg, 250 μg intramuscular carboprost, misoprostol 1 mg rectally, four units of packed red blood cells and two units of fresh frozen plasma. As the obstetricians are closing, the patient begins to produce frothy pink sputum up the endotracheal tube.<br><br><strong>Which of the following is the least likely cause of the pink frothy sputum?</strong>","o":["Syntocinon","Ergometrine","Carboprost","Blood products","Misoprostol"],"a":4,"e":"Rectal misoprostol has slow absorption and is the least likely to cause this immediate pulmonary oedema. Oxytocin, ergometrine, carboprost and transfusion can all contribute.","w":["Oxytocin may cause vasodilatation, tachycardia and pulmonary oedema.","Ergometrine causes hypertension and can precipitate pulmonary oedema.","Carboprost may increase pulmonary vascular resistance and cause pulmonary oedema.","Blood products may cause TRALI or circulatory overload.","CORRECT"],"p":["Consider TRALI and TACO after transfusion.","Ergometrine is hazardous in cardiac disease.","Carboprost can cause bronchospasm and pulmonary effects.","Rectal misoprostol has relatively slow onset."],"m":"Immediate pink frothy sputum after PPH treatment is least likely from rectal misoprostol."},{"q":"You have been fast bleeped to one of the delivery rooms on labour ward where a 38-year-old multiparous woman who is in the first stage of labour has suddenly become short of breath. Initial observations show oxygen saturations of 87%, a respiratory rate of 35, heart rate of 110 beats per minute and a blood pressure of 85/40 mmHg.<br><br><strong>What is the least likely cause of her presentation?</strong>","o":["Amniotic fluid embolism","Pulmonary embolism","Antepartum haemorrhage","Anaphylaxis","Tension pneumothorax"],"a":2,"e":"Antepartum haemorrhage causes shock and tachypnoea but is less likely to produce abrupt severe hypoxaemia and breathlessness without visible bleeding.","w":["AFE can cause sudden hypoxia and cardiovascular collapse during labour.","PE can cause sudden hypoxia, dyspnoea and hypotension.","CORRECT","Anaphylaxis can cause hypoxia and shock.","Tension pneumothorax can cause sudden hypoxia and hypotension."],"p":["AFE and PE can look very similar.","Examine for wheeze, unilateral breath sounds and bleeding.","Resuscitate with ABC priorities while diagnosing.","AFE management is supportive and may require urgent delivery."],"m":"Sudden hypoxic collapse in labour is less typical of isolated antepartum haemorrhage."},{"q":"A 6-week-old boy presents with a 3-day history of progressive non-bilious vomiting and poor feeding. An ultrasound scan confirms the diagnosis of pyloric stenosis. The capillary blood gas shows: pH 7.46, pCO₂ 5.1 kPa, pO₂ 6.8 kPa, HCO₃⁻ 31 mmol/L, base excess +6, Cl⁻ 100 mmol/L, Na⁺ 133 mmol/L and K⁺ 3.1 mmol/L. The paediatric surgical team wants to perform an urgent pyloromyotomy. The infant last fed 12 hours previously.<br><br><strong>The immediate anaesthetic management of this infant should be:</strong>","o":["Perform a rapid sequence induction because of delayed gastric emptying","Insert a nasogastric tube to aspirate any residual gastric content before induction of anaesthesia","Postpone anaesthesia and surgery until the infant is adequately fluid resuscitated and the acid-base balance corrected","Perform a caudal block after induction of anaesthesia to minimise analgesic opioid requirement","Arrange for postoperative intensive care monitoring because of increased risk of apnoea"],"a":2,"e":"Pyloric stenosis is a medical rather than surgical emergency. Correct dehydration, hypokalaemia, hypochloraemia and alkalosis before anaesthesia.","w":["RSI is performed only after metabolic correction and gastric emptying.","NG aspiration is important but is not the first overall priority.","CORRECT","A caudal may reduce opioids but follows stabilisation.","Postoperative monitoring may be needed but does not replace preoperative correction."],"p":["Typical disorder: hypochloraemic, hypokalaemic metabolic alkalosis.","Correct fluids and electrolytes before surgery.","Empty the stomach before induction.","Alkalosis increases postoperative apnoea risk."],"m":"Pyloric stenosis: resuscitate and correct alkalosis before pyloromyotomy."},{"q":"A healthy 15 kg 3-year-old boy is scheduled for an elective right orchidopexy for cryptorchidism. Intravenous induction was performed with fentanyl, propofol and rocuronium, and facemask ventilation was satisfactory. Direct laryngoscopy showed a grade 3 view. You had two unsuccessful attempts at intubation.<br><br>The surgeon wants to proceed with surgery because this patient was previously cancelled for an upper respiratory tract infection.<br><br><strong>The best course of action now is:</strong>","o":["Insert a supraglottic airway device and proceed with positive pressure ventilation","Reverse rocuronium with sugammadex, wake the patient and postpone surgery","Insert a supraglottic airway device, perform a fibreoptic intubation through it and proceed","Maintain facemask ventilation, perform a fibreoptic intubation and proceed","Have two further attempts at laryngoscopy; optimise head and neck position, technique, external laryngeal manipulation, paralysis and consider different equipment"],"a":4,"e":"With satisfactory mask ventilation, paediatric guidance permits up to four optimised direct-laryngoscopy attempts before moving to the secondary airway plan.","w":["A supraglottic airway may be the secondary plan, but two optimised attempts remain.","Waking is not required yet while oxygenation is satisfactory.","Fibreoptic through an SAD follows failure of the optimised primary plan.","Fibreoptic intubation by facemask is technically difficult and not the next step.","CORRECT"],"p":["Limit direct laryngoscopy to four attempts.","Optimise position, external manipulation and paralysis.","Change blade, tube, stylet or bougie.","Prioritise oxygenation throughout."],"m":"After two failed paediatric laryngoscopies with good mask ventilation: optimise and allow two final attempts."},{"q":"A 30-year-old man with Crohn’s disease has had a right hemicolectomy. You are asked to see him in recovery for uncontrolled abdominal pain. He declined an epidural preoperatively. Intraoperatively he had paracetamol and 20 mg morphine. So far in recovery he has had a total of 25 mg morphine with little effect. He is alert but very distressed with a normal respiratory rate. He does not normally take any strong opiates and has no allergies.<br><br><strong>What would be the most appropriate next step in the management of his acute pain?</strong>","o":["Further titrate morphine up to a maximum of 20 mg provided there are no overt signs of overdose","Give 2 mg midazolam","Give 10 mg ketamine intravenously","Give 100 mg tramadol intravenously","Give 50 μg clonidine intravenously"],"a":2,"e":"After large ineffective morphine doses, a low-dose ketamine bolus provides NMDA antagonism, reduces hyperalgesia and can markedly reduce opioid requirements.","w":["More morphine is unlikely to work and increases toxicity risk.","Midazolam sedates but does not treat pain.","CORRECT","Tramadol adds opioid adverse effects and is less effective in this severe pain.","Clonidine may help but risks hypotension and bradycardia and is less effective."],"p":["Consider opioid-resistant hyperalgesia after large opioid doses.","Low-dose ketamine is opioid-sparing.","Use ketamine with monitoring.","Reassess for surgical causes of unexpectedly severe pain."],"m":"Severe pain despite large morphine doses: use low-dose IV ketamine."},{"q":"A 23-year-old woman had an above knee amputation for a localised osteosarcoma. She has developed unusual sensations at the amputated limb, pain at the stump, and a feeling that the limb is still there.<br><br><strong>Which of the following features are most likely to suggest true phantom limb pain in this patient?</strong>","o":["Painful sensations at the stump","Good response to opioid analgesia","Intermittent pain","Inadequately working preoperative epidural analgesia","Sensations that the amputated limb is still present"],"a":2,"e":"True phantom limb pain arises in the perceived missing limb and is most commonly intermittent rather than constant.","w":["Pain at the surgical site is stump pain.","Phantom pain often responds poorly to opioids.","CORRECT","Preoperative epidural efficacy does not define phantom pain.","Feeling the limb is present without pain is a phantom sensation."],"p":["Stump pain is localised to the residual limb.","Phantom sensation is non-painful awareness of the missing limb.","Phantom pain is painful and usually intermittent.","Gabapentin, amitriptyline and mirror therapy may help."],"m":"Intermittent pain felt in the missing limb suggests true phantom limb pain."},{"q":"A 62-year-old woman presents for a left lobectomy. She is generally fit and well, and not on any regular medications.<br><br><strong>Which of the following is the best option for analgesic management:</strong>","o":["Lumbar epidural","Intrathecal diamorphine","PCA morphine","Interpleural block","Thoracic epidural"],"a":4,"e":"Thoracic epidural analgesia is the traditional gold standard for thoracotomy because it provides excellent dynamic pain relief and improves coughing and ventilation.","w":["A lumbar epidural is too distant from the thoracic dermatomes.","Intrathecal opioid is effective but cannot be topped up and risks delayed respiratory depression.","PCA alone often gives inferior dynamic analgesia.","Interpleural block is unreliable due to pooling and chest drains.","CORRECT"],"p":["Thoracotomy is among the most painful operations.","Place the epidural near the midpoint of the incision.","Good analgesia reduces pulmonary complications.","Paravertebral block is an important unilateral alternative."],"m":"Open thoracic surgery: thoracic epidural is the gold-standard analgesic option."},{"q":"A 48-year-old man is referred to the pain clinic with poorly controlled upper abdominal pain. He is known to have pancreatic cancer, which is now palliative. As a result of his medication he is now feeling increasingly tired and is having difficulty concentrating.<br><br>He is on paracetamol 1 g four times daily, gabapentin 900 mg three times daily, modified release oxycodone 30 mg twice daily and immediate release oxycodone 10 mg for breakthrough pain.<br><br><strong>What would be the most appropriate treatment option?</strong>","o":["Increase modified release oxycodone to 40 mg twice daily and immediate release oxycodone to 15 mg","Add amitriptyline","Perform a coeliac plexus block","Perform a lumbar sympathetic block","Perform a thoracic paravertebral block T10–T12"],"a":2,"e":"He has refractory pancreatic cancer pain with opioid adverse effects. A coeliac plexus block targets upper abdominal visceral afferents and can reduce opioid requirements.","w":["Increasing opioids will worsen sedation and cognitive effects.","Amitriptyline adds sedation and anticholinergic adverse effects.","CORRECT","Lumbar sympathetic block treats lower-limb or pelvic sympathetic pain.","A T10–T12 paravertebral block does not adequately target the pancreatic visceral plexus."],"p":["Coeliac plexus supplies upper abdominal viscera.","Use a diagnostic local-anaesthetic block before neurolysis.","Neurolytic coeliac block can reduce opioid use.","Risks include hypotension, bleeding and rare neurological injury."],"m":"Pancreatic cancer pain with opioid toxicity: perform a coeliac plexus block."},{"q":"A 4.2 kg, 26-day-old neonate is admitted for repair of an inguinal hernia. He was born at term by normal vaginal delivery. There are no other known medical problems and no allergies.<br><br><strong>What would be the most appropriate analgesic plan for postoperative pain relief?</strong>","o":["Single shot caudal combined with 15 mg/kg paracetamol intravenously 6-hourly and codeine phosphate 1 mg/kg orally 6-hourly as required","Single shot caudal combined with 10 mg/kg paracetamol orally 6-hourly and ibuprofen 5 mg/kg orally 8-hourly as required","Single shot caudal combined with 10 mg/kg paracetamol orally 6-hourly and codeine phosphate 1 mg/kg orally 6-hourly as required","Local anaesthetic infiltration by surgeon combined with paracetamol 7.5 mg/kg intravenously 6-hourly and codeine phosphate 1 mg/kg orally 6-hourly as required","Local anaesthetic infiltration by surgeon combined with paracetamol 15 mg/kg orally 6-hourly and morphine sulphate 100 μg/kg orally 4–6-hourly as required"],"a":2,"e":"A single-shot caudal gives effective regional analgesia. For this neonate, oral paracetamol 10 mg/kg 6-hourly with cautious codeine as required matches the book regimen.","w":["The IV paracetamol dose is excessive for a neonate.","Ibuprofen is not recommended in neonates or infants under 5 kg.","CORRECT","IV paracetamol 7.5 mg/kg every 6 hours exceeds the stated neonatal daily maximum.","Paracetamol and morphine doses are too high for this neonate."],"p":["Neonates require reduced analgesic doses.","Use regional/local anaesthesia whenever possible.","Avoid NSAIDs in neonates under 5 kg.","Monitor carefully for opioid-related apnoea."],"m":"Neonatal hernia analgesia: caudal + reduced-dose paracetamol, with cautious rescue opioid."},{"q":"A 26-year-old woman was pulled unconscious from a campervan fire and was intubated at the scene. She has 40% burns with moderate inhalational injury, and has been fluid resuscitated according to the Parkland formula.<br><br>Her heart rate is 96 beats per minute, blood pressure 110/77 mmHg, capillary refill time <2 seconds, temperature 38°C, and urine output is 70 mL/hour. Arterial blood gas analysis on FiO₂ 0.5 shows: pH 7.12, PaO₂ 40 kPa, PaCO₂ 3.3 kPa, HCO₃⁻ 16 mmol/L, base excess −4.0 and lactate 12.3 mmol/L.<br><br><strong>What is most likely to account for the lactic acidosis:</strong>","o":["Sepsis","Volume depletion","Acute kidney injury from rhabdomyolysis","Cyanide poisoning","Ethanol poisoning"],"a":3,"e":"Severe persistent lactataemia despite adequate perfusion after an enclosed-space fire strongly suggests cyanide toxicity from smoke inhalation.","w":["Sepsis is unlikely this early after the burn.","Normal perfusion and urine output argue against hypovolaemia.","AKI does not explain this immediate severe lactate.","CORRECT","Ethanol may raise lactate but usually not to this degree."],"p":["Cyanide inhibits cytochrome oxidase and oxidative phosphorylation.","Suspect it after enclosed-space fires with lactate >10 mmol/L.","Treat on clinical suspicion—do not wait for a level.","Hydroxocobalamin is the preferred antidote."],"m":"Enclosed-space fire + lactate 12.3 despite good perfusion = cyanide poisoning."},{"q":"You are anaesthetising a 72-year-old man for an elective open abdominal aneurysm. He is a known hypertensive and type II diabetic and his medication includes amlodipine 5 mg, ramipril 10 mg and metformin 1 g b.d.<br><br><strong>What is the single most important intervention that would limit potential postoperative renal impairment?</strong>","o":["Start dopamine at 2.5 μg/kg/min","Administer mannitol 20% 0.5 g/kg","Optimise his circulatory blood volume","Keep his circulating haemoglobin >90 g/L","Administer furosemide 40 mg"],"a":2,"e":"Maintaining adequate intravascular volume and renal perfusion is the only intervention listed consistently associated with reduced perioperative renal injury.","w":["Low-dose dopamine does not prevent AKI.","Mannitol has not shown reliable renal protection.","CORRECT","A specific haemoglobin threshold does not prevent AKI by itself.","Furosemide increases urine output but does not protect renal function."],"p":["Prevent hypotension and hypovolaemia.","Avoid nephrotoxins.","Monitor urine output and creatinine.","No drug reliably prevents AKI during aortic surgery."],"m":"The best renal protection in aortic surgery is optimising circulating volume and perfusion."},{"q":"A 6-year-old boy is admitted with fulminant hepatic failure, bleeding oesophageal varices, ascites and marked splenomegaly.<br><br>His liver function tests show an elevated bilirubin, alanine transaminases and aspartate transaminases. He has low albumin, prolonged prothrombin time and examination of his cornea on slit lamp examination demonstrates a brown, dark ring encircling his iris.<br><br><strong>Which of the following is the most likely diagnosis for this clinical picture?</strong>","o":["Alpha-1 antitrypsin deficiency","Wilson’s disease","Primary biliary cirrhosis","Haemochromatosis","Sclerosing cholangitis"],"a":1,"e":"The brown Kayser–Fleischer ring represents corneal copper deposition and is strongly characteristic of Wilson’s disease.","w":["Alpha-1 antitrypsin deficiency causes liver disease and emphysema but not Kayser–Fleischer rings.","CORRECT","Primary biliary cholangitis is an adult autoimmune cholestatic disease.","Haemochromatosis causes iron deposition, not corneal copper rings.","Sclerosing cholangitis causes bile-duct inflammation and strictures."],"p":["Wilson’s disease is autosomal recessive due to ATP7B dysfunction.","Copper accumulates in liver, brain and cornea.","Children commonly present with hepatic disease.","Treat with chelation or liver transplantation in fulminant failure."],"m":"Kayser–Fleischer rings + liver failure = Wilson’s disease."},{"q":"A 92-year-old man is brought to emergency department with a fractured neck of femur following a fall.<br><br><strong>To be categorised using the frailty phenotype, which of the following characteristics would not be assessed?</strong>","o":["Self-reported exhaustion","Mental state","Weight loss","Grip strength","Low activity"],"a":1,"e":"The Fried frailty phenotype assesses weight loss, exhaustion, weakness/grip strength, slow walking and low activity. Mental state is not included.","w":["Exhaustion is one of the five criteria.","CORRECT","Unintentional weight loss is included.","Low grip strength measures weakness.","Low physical activity is included."],"p":["Fried criteria: weight loss, exhaustion, weakness, slowness and low activity.","Three or more criteria indicate frailty.","One or two indicate pre-frailty.","Frailty is distinct from cognition, although they may coexist."],"m":"Mental state is not part of the Fried frailty phenotype."},{"q":"A new antiemetic drug is being evaluated. The percentage of patients who suffered postoperative nausea and vomiting (PONV) after administration of either the drug or placebo is reported:<br><br>• Percentage of patients with PONV after drug A = 20%<br>• Percentage of patients with PONV after placebo = 25%<br><br><strong>Which of the following is the number needed to treat (NNT)?</strong>","o":["20","25","5","75","1"],"a":0,"e":"Absolute risk reduction = 25% − 20% = 5%. NNT = 100/5 = 20.","w":["CORRECT","This is the control event rate, not the NNT.","This is the absolute risk reduction in percentage points.","This does not follow the NNT formula.","An NNT of 1 would require every treated patient to benefit."],"p":["ARR = control event rate − treatment event rate.","NNT = 1/ARR as a proportion.","Round NNT up to the next whole number.","NNT depends on baseline event rate."],"m":"25% − 20% = 5% ARR; NNT = 100/5 = 20."}],"6":[{"q":"A 44-year-old woman is on the intensive care unit having had a grade 3 subarachnoid haemorrhage secondary to an anterior communicating artery aneurysm one day ago. She is currently stable neurologically. Her past medical history comprises of hypercholesterolaemia, hypertension and smoking. She has a drug history of simvastatin and lisinopril.<br><br><strong>Which of the following would most likely prevent the development of delayed cerebral ischaemia in this patient?</strong>","o":["‘Triple H therapy’","Magnesium administration","Statin administration","Nimodipine administration","Antiplatelet therapy"],"a":3,"e":"Nimodipine is the only treatment listed with consistent evidence that it improves outcome and reduces delayed cerebral ischaemia after subarachnoid haemorrhage.","w":["Triple-H therapy is controversial and not recommended prophylactically.","Magnesium has not shown consistent outcome benefit.","Statins have not shown short- or long-term benefit after SAH.","CORRECT","Antiplatelets increase bleeding risk and are mainly reserved for endovascular stents."],"p":["Start nimodipine in all aneurysmal SAH patients unless hypotension prevents it.","Typical course: 60 mg every 4 hours for 21 days.","Highest DCI risk is approximately days 3–10.","Avoid hypotension and hypovolaemia."],"m":"After aneurysmal SAH, nimodipine is the proven drug for preventing delayed cerebral ischaemia."},{"q":"A 29-year-old woman who suffered a blow to the left side of her skull vault with a resulting depressed fracture is awaiting transfer to a tertiary centre. She lost consciousness for approximately 1 minute after the incident. Her GCS is currently 14/15 (E4 V4 M6).<br><br><strong>Which of the following, in isolation, indicates that intubation is essential before transfer?</strong>","o":["PaO₂ of 13 kPa on FiO₂ of 0.6","A discrete and short-lived seizure en route to your hospital","Drop in GCS from E4 V4 M6 to E3 V4 M5 in the emergency department","An increase in respiratory rate leading to a PaCO₂ of 4.0 kPa","Blood in the oropharynx"],"a":1,"e":"Post-traumatic seizure activity makes intubation essential before transfer because recurrence may threaten the airway, ventilation and intracranial pressure control.","w":["PaO₂ 13 kPa is at the acceptable transfer target despite the high FiO₂.","CORRECT","This is a two-point total fall but only one point in the motor score; clinical judgement is required.","PaCO₂ 4.0 kPa is borderline and may improve after analgesia.","Blood in the mouth may or may not threaten the airway depending on severity."],"p":["Transfer targets include PaO₂ >13 kPa and PaCO₂ about 4.5–5.0 kPa.","Intubate for GCS <8 or a two-point fall in motor score.","Seizure after head injury is an indication for airway control before transfer.","Prevent hypoxia, hypotension and fever."],"m":"Any seizure after significant head injury makes intubation essential before transfer."},{"q":"A 65-year-old man presents to the emergency department with acute central chest pain radiating to the back. He has a history of hypertension and smoking. The ECG shows evidence of left ventricular hypertrophy and his blood pressure is 190/100 mmHg, heart rate 105 beats per minute. There is a collapsing pulse and an early diastolic murmur.<br><br><strong>What is the next most appropriate management step?</strong>","o":["Commencement of sodium nitroprusside infusion","Site an arterial line","Arrange urgent aortography","Titrate intravenous morphine","Arrange transfer to a cardiothoracic centre"],"a":3,"e":"This is likely acute aortic dissection with aortic regurgitation. The first step is titrated analgesia because pain drives sympathetic activation, hypertension and aortic wall stress.","w":["A pure vasodilator should not be started before adequate analgesia and beta-blockade.","Invasive monitoring is important but follows immediate symptom control.","CT or echocardiography has replaced traditional aortography.","CORRECT","Transfer planning is needed, but stabilisation begins first."],"p":["Suspect dissection with tearing pain, hypertension and new AR.","Give analgesia first.","Control heart rate/contractility before adding vasodilators.","Type A dissection requires urgent surgery."],"m":"Acute aortic dissection: first relieve pain, then control impulse and blood pressure."},{"q":"A 65-year-old woman is recovering from an uneventful total thyroidectomy as treatment for a large substernal goitre. On the third postoperative day, she becomes progressively more stridulous and wheezy. She is tachypnoeic, confused and complaining of circumoral paraesthesia. There is no obvious neck swelling or pain.<br><br><strong>What is the most likely cause of her symptoms?</strong>","o":["Bilateral vocal cord paralysis","Tracheomalacia","Haematoma","Tracheal necrosis","Hypocalcaemia"],"a":4,"e":"Delayed stridor with wheeze, confusion and circumoral paraesthesia after thyroidectomy is typical of hypocalcaemia causing neuromuscular irritability and laryngospasm.","w":["Bilateral vocal cord palsy usually presents immediately after extubation.","Tracheomalacia does not explain paraesthesia or confusion.","A neck haematoma usually causes swelling and pain, often within 24 hours.","Tracheal necrosis would more likely cause surgical emphysema or air leak.","CORRECT"],"p":["Hypocalcaemia often appears 24–48 hours after thyroid surgery.","Symptoms include circumoral tingling, tetany, bronchospasm and laryngospasm.","Check ionised calcium urgently.","Treat symptomatic hypocalcaemia with IV calcium."],"m":"Day-3 stridor plus circumoral paraesthesia after thyroidectomy = hypocalcaemia."},{"q":"A 36-year-old woman with an impacted food bolus needs to go to theatre imminently. She has been unable to swallow her saliva for 24 hours. On inquiring about her anaesthetic history she reports collapsing due to a severe allergic reaction under anaesthesia, but she is unsure which agent was responsible. There are no notes available, nor relatives to elaborate on the history.<br><br><strong>Which of the following should you avoid as the most likely causative agent?</strong>","o":["Rocuronium","Latex","Morphine","Chlorhexidine","Gelofusine"],"a":0,"e":"Neuromuscular blocking agents are the commonest cause of perioperative anaphylaxis. Rocuronium is therefore the most important drug to avoid when the previous trigger is unknown.","w":["CORRECT","Latex is a recognised cause but less common than neuromuscular blockers.","Morphine usually causes non-IgE histamine release rather than true anaphylaxis.","Chlorhexidine reactions occur but are less common.","Gelatin colloids are recognised triggers but less frequent."],"p":["Neuromuscular blockers account for most perioperative anaphylaxis.","Avoid the suspected drug class when records are unavailable.","Use a different structural class if paralysis is essential.","Arrange formal allergy investigation after recovery."],"m":"Unknown previous perioperative anaphylaxis: avoid rocuronium first."},{"q":"A 34-year-old man presents for laparoscopic excision of his left adrenal gland for phaeochromocytoma. During your preoperative assessment, he tells you that he has been taking medication for blood pressure for about a month.<br><br><strong>Which of the following is most likely to indicate that he is prepared for surgery?</strong>","o":["Good exercise tolerance, but a history of dizziness on standing","Lack of a history of palpitations, and a normal ECG","A normal echocardiogram, and chest X-ray","History of dizziness on standing, a 5-minute ECG with no premature ventricular complexes, and nasal congestion","Several blood pressure recordings of <160/90 mmHg"],"a":3,"e":"Postural dizziness, nasal congestion and absence of ventricular ectopy indicate adequate alpha-blockade and cardiovascular preparation.","w":["Postural symptoms alone are insufficient.","A normal short ECG does not exclude ectopy.","Normal imaging does not prove adequate pharmacological blockade.","CORRECT","Controlled blood pressure alone does not confirm adequate alpha-blockade."],"p":["Targets include BP <160/90 mmHg.","Postural hypotension should occur but not be severe.","No more than one PVC per 5 minutes.","Nasal congestion is a typical sign of alpha-blockade."],"m":"Phaeochromocytoma preparation is suggested by postural hypotension, nasal congestion and absent ectopy."},{"q":"A 45-year-old man is admitted to the surgical ward with a fever, toothache and neck discomfort. Whilst waiting for surgery you are called to his bedside as he is more breathless and complaining of substernal pain. On examination he is hypotensive and there is tender, ‘woody’ induration of his neck. On auscultation you hear a pericardial rub.<br><br><strong>Which investigation is most appropriate to guide management in this scenario?</strong>","o":["Cervical and chest ultrasound","Cervical and chest computed tomography","Cervical and chest magnetic resonance imaging","Cervical and chest radiograph","Echocardiogram"],"a":1,"e":"This is Ludwig’s angina complicated by possible descending necrotising mediastinitis. CT of the neck and chest rapidly defines the depth, collections and mediastinal extension.","w":["Ultrasound cannot reliably assess deep neck spaces or mediastinum.","CORRECT","MRI gives excellent soft-tissue detail but is too slow in an unstable airway-risk patient.","Plain radiographs are insensitive and inadequate for operative planning.","Echo may assess pericardial effusion but not the cervical or mediastinal infection."],"p":["Ludwig’s angina causes woody submandibular induration.","Major threats: airway obstruction and descending mediastinitis.","CT neck and chest is the imaging test of choice.","Secure the airway early with senior ENT/anaesthetic support."],"m":"Woody neck cellulitis with substernal pain: obtain urgent CT neck and chest."},{"q":"A 35-year-old cyclist suffered a severe traumatic brain injury with a large subdural haematoma and an associated C2–C3 cervical spine fracture. He is comatose and apnoeic, with neurosurgeons confirming that he is not a candidate for surgery due to poor prognosis. Confirmation of brainstem death is underway, with examination of cranial nerves just being completed.<br><br><strong>What is the next most appropriate test that will support the neurological diagnosis of death?</strong>","o":["Apnoea testing","Somatosensory evoked potentials","No further tests necessary","A second neurological examination of the cranial nerves","Electroencephalogram"],"a":4,"e":"Because high cervical spinal injury may itself cause apnoea, the apnoea test cannot reliably prove loss of brainstem respiratory drive. EEG is the most appropriate ancillary test.","w":["Apnoea may result from the C2–C3 injury rather than brainstem death.","Somatosensory evoked potentials are not validated for confirming death.","Further confirmation is required.","A second cranial nerve exam alone is incomplete without a valid apnoea test or ancillary test.","CORRECT"],"p":["Brainstem testing normally includes cranial nerves plus apnoea testing.","High cervical cord injury confounds interpretation of apnoea.","Use an ancillary test when standard testing cannot be completed reliably.","EEG is a widely used supportive test."],"m":"High cervical injury makes apnoea testing unreliable—use EEG support."},{"q":"An 84-year-old woman with an extracapsular hip fracture is scheduled for a dynamic hip screw on your morning trauma list. On examination she has an ejection systolic murmur in the aortic area and anaemia with a haemoglobin of 90 g/L. She has previously had a coronary stent and is on both aspirin and clopidogrel. Your hospital's echocardiogram technician is unavailable.<br><br><strong>How do you proceed?</strong>","o":["Postpone the surgery until an echocardiogram can be performed urgently","Proceed with the case under general anaesthesia and invasive blood pressure monitoring, with one unit of packed red blood cells","Perform a spinal anaesthetic after administration of one pool of platelets","Insert a lumbar epidural and use small volume incremental top-ups to achieve a surgical block","Proceed with the case under general anaesthesia and an ultrasound-guided fascia iliaca block with invasive blood pressure monitoring"],"a":4,"e":"Lack of echocardiography is not a valid reason to delay urgent hip-fracture surgery. Dual antiplatelet therapy contraindicates neuraxial techniques; GA plus fascia iliaca block and arterial monitoring is appropriate.","w":["Echo should not delay timely fixation.","Routine transfusion at Hb 90 g/L is not automatically indicated.","Platelets do not make immediate spinal anaesthesia safe after clopidogrel.","An epidural is contraindicated with clopidogrel.","CORRECT"],"p":["Hip fracture surgery should occur promptly, usually within 36 hours.","Do not delay solely for unavailable echocardiography.","Avoid neuraxial block with active clopidogrel effect.","Use invasive monitoring if significant aortic stenosis is possible."],"m":"Hip fracture + clopidogrel + murmur: proceed with GA, fascia iliaca block and arterial monitoring."},{"q":"A 35-year-old man for elective ankle surgery is to have an ultrasound guided popliteal nerve block.<br><br><strong>What is the most frequently used combination of ultrasound view and needle visualisation for this nerve block?</strong>","o":["Short-axis view with in-plane needle approach","Long-axis view with out-of-plane needle approach","Short-axis view with out-of-plane needle approach","Long-axis view with in-plane needle approach","Any of the above combinations"],"a":0,"e":"A short-axis view makes the nerve easier to identify, while an in-plane needle approach allows continuous visualisation of the needle and tip.","w":["CORRECT","Long-axis nerve imaging is less stable and out-of-plane needle visualisation is limited.","The nerve view is useful, but the needle tip may be uncertain out of plane.","In-plane is safe, but long-axis nerve imaging is technically le
