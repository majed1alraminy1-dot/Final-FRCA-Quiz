ss stable.","The combinations are not equally safe or commonly used."],"p":["Short-axis nerve view is usually easiest.","In-plane needle approach shows the whole shaft and tip.","Keep the tip visible before injecting.","Spread local anaesthetic around both tibial and common peroneal components."],"m":"Popliteal block: short-axis nerve view with an in-plane needle."},{"q":"You are called to the emergency department to assess a young woman that was rescued from a house fire following a gas leak after being trapped confined in a room. She is awake, with normal observations but suffered 10% body surface area partial thickness burns over her arms and face. You are asked to transfer her to the nearest burns unit that is 2 hours away. On examination she has singed nasal hair, a normal airway and no change in voice. Burns resuscitation is underway with intravenous fluids and analgesia.<br><br><strong>What is the next step in ensuring her safe transfer?</strong>","o":["Add the operating department practitioner to your transfer team","Full monitoring including invasive blood pressure measurement","Prepare difficult airway equipment for the transfer","Prepare intubating equipment and drugs","Elective intubation of the patient"],"a":4,"e":"Facial burns after an enclosed-space fire carry a high risk of progressive airway oedema, which may worsen with fluid resuscitation during a two-hour transfer. Secure the airway electively first.","w":["Extra staff do not substitute for a secure airway.","Invasive arterial pressure is unnecessary in a stable patient.","Difficult-airway equipment should be available, but waiting until deterioration is dangerous.","Preparing equipment alone is insufficient for a long transfer.","CORRECT"],"p":["Airway oedema after inhalational injury can progress unpredictably.","Fluid resuscitation may worsen swelling.","Intubate early in controlled conditions when transfer is prolonged.","Use a large uncut cuffed tube if possible."],"m":"Facial burns in an enclosed-space fire before long transfer: intubate electively."},{"q":"A 72-year-old man has been on the intensive care unit after being treated for an infective exacerbation of his chronic obstructive pulmonary disease. He has been mechanically ventilated for 5 days and has acceptable gas exchange. He has been weaned to pressure support ventilation requiring 12 cmH₂O inspiratory support and 5 cmH₂O of positive end-expiratory pressure (PEEP) with an inspired oxygen concentration of 0.35. He is currently obeying commands.<br><br><strong>How would you best assess his suitability for extubation?</strong>","o":["Change the patient to continuous positive airway pressure (CPAP) and assess ventilation and cardiovascular parameters for 30 minutes","Reduce the pressure support gradually over the next 48 hours by 2 cmH₂O per 12 hours and assess ventilation and cardiovascular parameters","Reduce the inspired oxygen fraction to 0.25 and repeat an arterial blood gas 30 minutes later","Repeat a chest radiograph to ensure resolution of his consolidative process","Assess the patient’s sputum production and send a repeat sample for microscopy to ensure clearance of the infective process"],"a":0,"e":"He meets readiness criteria for a spontaneous breathing trial. A 30-minute CPAP trial tests whether he can maintain ventilation and cardiovascular stability with minimal support.","w":["CORRECT","Slow reduction unnecessarily prolongs ventilation and increases complications.","Lowering FiO₂ does not assess spontaneous breathing capacity.","Radiographic resolution is not required before extubation.","Sputum culture does not determine readiness for extubation."],"p":["Use a spontaneous breathing trial for at least 30 minutes.","Typical methods: low pressure support, CPAP or T-piece.","Stop if RR >35, SpO₂ <90%, severe haemodynamic change or distress.","Assess cough, secretion handling and mental status before extubation."],"m":"Ready-to-wean patient: perform a 30-minute spontaneous breathing trial."},{"q":"You are asked to review a 72-year-old man who was admitted to your intensive care unit 6 hours ago following elective coronary artery bypass grafts. He is haemodynamically stable with no evidence of end organ hypoperfusion. The concern is that he has been slowly bleeding into his drains (total 570 mL since theatre) and has slow oozing through his sternotomy wound and around his lines and drains. His core temperature is 36.2°C and pH 7.32. Results: haemoglobin 78 g/L; platelet count 102 ×10⁹/L; INR 1.4; aPTTr 1.6; fibrinogen 1.8 g/L; ionised calcium 0.9 mmol/L. The patient is on long-term aspirin 75 mg daily. He received heparin in theatre that was reversed with protamine, and a single dose of 1 g tranexamic acid.<br><br><strong>Given this information the most appropriate treatment strategy is:</strong>","o":["1 unit packed red blood cells + 1 pool of platelets + 15 mL/kg fresh frozen plasma + 1 dose of cryoprecipitate","20 mmol of calcium chloride + protamine + 1 pool of platelets + tranexamic acid","2 units packed red blood cells","20 mmol of calcium chloride + 1 pool of platelets + 15 mL/kg fresh frozen plasma","Perform a thromboelastogram"],"a":3,"e":"He has platelet dysfunction, prolonged clotting tests and hypocalcaemia. Platelets, FFP and calcium directly correct these abnormalities; additional protamine, cryoprecipitate or red cells are not yet indicated.","w":["Cryoprecipitate and red cells are unnecessary at the stated fibrinogen and haemoglobin.","Extra protamine may become anticoagulant and repeat tranexamic acid is not indicated.","Hb 78 g/L does not mandate two units in a stable patient.","CORRECT","TEG may refine management but should not delay treatment of established abnormalities."],"p":["Correct temperature, pH and ionised calcium.","Aspirin and bypass impair platelet function.","Use FFP for broad factor deficiency.","Do not give repeat protamine without evidence of residual heparin."],"m":"Post-CPB oozing with low calcium and abnormal clotting: give calcium, platelets and FFP."},{"q":"A 60 kg, 55-year-old woman has been admitted to the intensive care unit with severe community acquired pneumonia. Two days later she develops worsening hypoxaemia with new bilateral infiltrates on chest radiography. She is currently ventilated with FiO₂ 1.0, inspiratory pressure 35 cmH₂O, PEEP 12 cmH₂O, I:E ratio 1:1 and tidal volume 250 mL. Arterial blood gas: pH 7.28, PaCO₂ 8.6 kPa, PaO₂ 7.1 kPa, HCO₃⁻ 21.4 mmol/L, lactate 2.3 mmol/L.<br><br><strong>Based on current evidence, which of the following would be an appropriate next step to improve her oxygenation and reduce mortality?</strong>","o":["Extracorporeal membrane oxygenation","Prone positioning","Inhaled nitric oxide","High frequency oscillation ventilation","Increase inspiratory pressure"],"a":1,"e":"She has severe ARDS with refractory hypoxaemia. Early prone positioning improves both oxygenation and mortality in moderate-to-severe ARDS.","w":["ECMO may be considered after referral to a specialist centre, but is not the first rescue step here.","CORRECT","Nitric oxide may transiently improve oxygenation but not survival.","HFOV has not shown benefit and may cause harm.","Higher pressure increases ventilator-induced lung injury."],"p":["Use tidal volume about 6 mL/kg predicted body weight.","Keep plateau pressure <30 cmH₂O.","Prone severe ARDS early and for prolonged sessions.","Accept permissive hypercapnia if pH remains tolerable."],"m":"Severe ARDS with refractory hypoxaemia: prone positioning improves survival."},{"q":"A 58-year-old man is brought in by ambulance following a house fire in an enclosed area. He is confused with a GCS 14/15. On examination he has singed facial hair with voice changes. He is noted to have partial thickness burns to the front of his torso, bilateral palms and palmar aspect of upper limbs. His body weight is 70 kg.<br><br><strong>According to the Parkland formula his estimated fluid requirement in the first 8 hours following his burn is:</strong>","o":["7560 mL","4850 mL","4620 mL","3910 mL","3780 mL"],"a":4,"e":"Burned area is 27% TBSA: anterior torso 18% plus bilateral palmar upper limbs 9%. Parkland = 4 × 70 × 27 = 7560 mL; half is given in the first 8 hours = 3780 mL.","w":["This is the total 24-hour requirement.","This does not match the Parkland calculation.","This does not match the calculated first-half volume.","This is close but not correct.","CORRECT"],"p":["Include partial- and full-thickness burns only.","Parkland = 4 mL × kg × %TBSA.","Give half in the first 8 hours from time of injury.","Titrate to urine output and perfusion."],"m":"70 kg × 27% × 4 = 7560 mL; first 8 hours = 3780 mL."},{"q":"A male motorcyclist of unknown age has been transferred to hospital after having a high-speed accident. The paramedics report states that the patient is unresponsive, has chest, abdominal, pelvic injuries and a traumatic right leg amputation currently secured with a tourniquet. The respiratory rate is 10 breaths per minute, there is a weak carotid pulse and the Glasgow coma score is 3. The trauma team members are present and you decide to prepare to intubate the patient.<br><br><strong>What technique is most appropriate?</strong>","o":["Modified rapid sequence with rocuronium 1 mg/kg and midazolam 0.05 mg/kg","Rapid sequence induction with thiopentone 3 mg/kg and suxamethonium 1 mg/kg","Modified rapid sequence induction with midazolam 0.05 mg/kg, fentanyl 1–3 μg/kg and rocuronium 1 mg/kg","Modified rapid sequence induction with propofol 1–2 mg/kg, fentanyl 1–3 μg/kg and rocuronium 1 mg/kg","Modified rapid sequence with ketamine 2 mg/kg, fentanyl 1–3 μg/kg and rocuronium 1 mg/kg"],"a":4,"e":"Ketamine, fentanyl and high-dose rocuronium provide rapid intubation with the best cardiovascular stability for a shocked polytrauma patient.","w":["Omitting analgesia risks a marked sympathetic response.","Thiopentone may worsen hypotension and suxamethonium raises potassium and ICP transiently.","Midazolam is slower and less predictable in shock.","Propofol causes vasodilatation and myocardial depression.","CORRECT"],"p":["Trauma RSI mnemonic: fentanyl 3, ketamine 2, rocuronium 1 mg/kg.","Use reduced doses in profound shock.","Ketamine does not increase ICP when ventilation is controlled.","Prepare blood, vasopressors and a failed-airway plan."],"m":"Shocked polytrauma RSI: fentanyl–ketamine–rocuronium."},{"q":"The obstetric registrar has asked you to review a 22-year-old woman on the postnatal ward who underwent a Category 2 Caesarean section for chorioamnionitis 2 days ago. She has a respiratory rate of 28 breaths per minute, heart rate 100 beats per minute, blood pressure 92/50 mmHg and oxygen saturations of 91% on air. She received only one postoperative IV antibiotic dose before being changed to oral therapy. Her temperature is 38.7°C and she is complaining of abdominal tenderness.<br><br><strong>What is the next most appropriate line of management?</strong>","o":["High flow oxygen, blood cultures, intravenous fluids and urgent discussion with microbiology consultant","High flow oxygen, intravenous fluids and intravenous broad spectrum antibiotics","High flow oxygen, intravenous fluids and intravenous paracetamol","High flow oxygen, blood cultures, intravenous fluids and oral antibiotics","High flow oxygen, blood cultures and intravenous fluids"],"a":0,"e":"She has severe postpartum sepsis. Give oxygen and fluids, obtain cultures, and urgently discuss effective IV antibiotic therapy with microbiology because prior treatment has been inadequate.","w":["CORRECT","Antibiotics are required, but cultures and expert selection are important after recent inadequate therapy.","Paracetamol does not treat sepsis.","Oral antibiotics are inappropriate in a deteriorating septic patient.","This omits urgent antimicrobial treatment planning."],"p":["Maternal sepsis requires antibiotics within 1 hour.","Take cultures before antibiotics if this does not delay treatment.","Use high-dose IV broad-spectrum antibiotics.","Escalate early to critical care."],"m":"Postpartum sepsis after inadequate antibiotics: oxygen, cultures, IV fluids and urgent microbiology-guided IV therapy."},{"q":"A 4-year-old 18 kg girl is scheduled for elective squint surgery. She was born at 31 week gestation, was ventilated for 1 week, and then was on CPAP for a month. She now suffers from recurrent episodes of wheeze and hospital admissions requiring nebuliser therapy. She takes salbutamol and beclomethasone inhalers regularly. Her mother reported she had just recovered from another viral respiratory tract infection a week ago, but no longer had any cough or coryzal symptoms. On examination, there is a soft bilateral expiratory wheeze.<br><br><strong>The most appropriate management plan for this patient is:</strong>","o":["Ask the mother to give the patient an extra dose of her salbutamol inhaler before induction","Give the patient nebulised salbutamol before induction","Reschedule the surgery for when the patient is 6 weeks from the most recent viral respiratory illness","Give the patient a dose of intravenous steroid intraoperatively","Refer the patient to the paediatric respiratory team"],"a":2,"e":"An asthmatic child with recent viral infection and persistent wheeze has a high perioperative bronchospasm risk. Elective surgery should be postponed for about 4–6 weeks.","w":["A salbutamol dose alone does not remove the increased airway-reactivity risk.","Nebulised salbutamol does not make elective surgery safe one week after infection.","CORRECT","A single intraoperative steroid dose does not eliminate the risk.","Respiratory review may help long-term control but the immediate plan is postponement."],"p":["Asthmatic children have increased risk after URTI.","Postpone elective surgery 4–6 weeks after infection when wheeze persists.","Optimise inhaled therapy before rebooking.","Give preoperative beta₂ agonist once well controlled."],"m":"Recent URTI plus active wheeze in an asthmatic child: postpone elective surgery for 6 weeks."},{"q":"A 10-year-old 24 kg girl is scheduled on your day surgery list for an upper gastrointestinal endoscopy to investigate her unexplained recurrent abdominal pain. On arrival in the anaesthetic room, the child is crying, combative and refusing to cooperate. After 10 minutes she only allows a pulse oximeter. She is the final patient on the morning list, and the endoscopist has a clinic to attend in the afternoon.<br><br><strong>Your best plan of action is:</strong>","o":["Send the child back to the waiting area to have a sedative pre-medication","Ask the mother to help restrain the child for a quick gas induction","Give sublingual midazolam in the anaesthetic room","Give intramuscular ketamine in the anaesthetic room","Reschedule for another day with a plan for midazolam pre-medication on the ward"],"a":4,"e":"This is elective day-case investigation. Rescheduling permits proper psychological preparation and planned oral midazolam premedication without coercion or unsafe time pressure.","w":["Day-unit premedication may not allow adequate observation and timing.","Physical restraint is inappropriate for elective care except as a last resort.","Sublingual midazolam in an already distressed child is unlikely to be accepted.","IM ketamine is disproportionate for an elective procedure.","CORRECT"],"p":["Do not let list pressure justify coercion.","Use play therapy, parental support and planned premedication.","Oral midazolam is the usual first-line premedication.","Reschedule elective procedures when safe cooperation cannot be achieved."],"m":"Uncooperative child for elective day-case endoscopy: reschedule with planned ward premedication."},{"q":"A 6-year-old 20 kg girl is scheduled to have an emergency laparoscopic appendicectomy. She is clinically stable and appears comfortable at rest. You discover in your preoperative assessment that the patient’s maternal uncle has a possible history of malignant hyperthermia, but the patient and both her parents have not been investigated for malignant hyperthermia susceptibility.<br><br><strong>The most appropriate anaesthetic management is:</strong>","o":["Postpone anaesthesia and surgery until MHS has been investigated","Postpone surgery until more information is available about the uncle","Proceed with anaesthesia and surgery, but with modified anaesthesia technique to avoid known triggers","Proceed with surgery because MH is not maternally inherited","Proceed with surgery with high vigilance but no change in technique"],"a":2,"e":"Emergency surgery should proceed using an MH-safe technique that avoids volatile agents and suxamethonium because susceptibility is inherited in an autosomal dominant pattern.","w":["Emergency appendicectomy should not be delayed for testing.","Waiting for family records is unsafe in an urgent case.","CORRECT","MH can be inherited through the maternal line.","Vigilance alone is inadequate if triggers are administered."],"p":["Avoid all volatile agents and suxamethonium.","Prepare the anaesthetic machine appropriately.","Use TIVA and a non-depolarising relaxant.","Ensure dantrolene is immediately available."],"m":"Possible family history of MH: proceed urgently with a trigger-free anaesthetic."},{"q":"A 73-year-old woman suffering with depression and poorly controlled chronic back pain who is taking paracetamol, diclofenac and fluoxetine is started on tramadol. The following day, she presents with tremor, confusion and restlessness. On examination she is febrile, hyperreflexic and has mydriasis.<br><br><strong>What is the most likely cause of her symptoms?</strong>","o":["Opioid toxicity","Opioid withdrawal","Hyponatraemia","Serotonin syndrome","Anaphylaxis"],"a":3,"e":"Fluoxetine and tramadol both increase serotonergic activity. Fever, agitation, tremor, hyperreflexia and mydriasis are classic for serotonin syndrome.","w":["Opioid toxicity causes sedation, respiratory depression and miosis.","Withdrawal requires prior dependence and cessation.","Hyponatraemia causes neurological symptoms but not this hyperreflexic, febrile pattern.","CORRECT","Anaphylaxis causes rash, bronchospasm and circulatory collapse."],"p":["Triad: altered mental state, autonomic hyperactivity and neuromuscular excitability.","Clonus and hyperreflexia are important clues.","Stop serotonergic drugs immediately.","Treat supportively; cyproheptadine may be used in severe cases."],"m":"Fluoxetine + tramadol + fever and hyperreflexia = serotonin syndrome."},{"q":"A 41-year-old woman presents for repeated wide local excision for breast cancer, and is due to have adjuvant radiotherapy. Her past medical history includes diabetes and depression. She is worried about the operation, especially pain after her surgery.<br><br><strong>Which of the following is not a risk factor for chronic post-surgical pain?</strong>","o":["Diabetes","Fear of surgery","Repeated surgery","Younger age","Adjuvant radiotherapy"],"a":0,"e":"Diabetes is not a recognised independent risk factor for chronic postsurgical pain in this context. The other listed factors are recognised risks.","w":["CORRECT","Fear and anxiety about surgery increase risk.","Repeated surgery increases tissue and nerve injury.","Younger age is associated with greater risk after breast surgery.","Radiotherapy increases the risk of chronic pain."],"p":["CPSP persists for at least 2 months after surgery.","Risk factors include severe acute pain, anxiety, younger age and repeated surgery.","Breast surgery, thoracotomy and amputation are high-risk procedures.","Diabetes is not a recognised CPSP risk factor here."],"m":"Diabetes is not a standard risk factor for chronic postsurgical pain."},{"q":"A 65-year-old man presents to the pain clinic with long-standing poorly controlled lower back pain. He is frightened by the painful sensations and admits to feeling depressed since he is no longer able to walk unaided.<br><br><strong>Which of the following is the most appropriate assessment tool to evaluate his painful experience?</strong>","o":["Numeric rating scale","Visual analog scale","Verbal descriptor scale","McGill pain questionnaire","Wong–Baker FACES scale"],"a":3,"e":"Chronic pain is multidimensional. The McGill questionnaire assesses sensory, affective and functional aspects rather than pain intensity alone.","w":["The numeric scale measures intensity only.","The visual analogue scale is unidimensional.","The verbal descriptor scale is quick but limited to intensity.","CORRECT","The FACES scale is mainly used for children or cognitive impairment."],"p":["Acute pain can often be measured with a simple intensity scale.","Chronic pain needs multidimensional assessment.","McGill evaluates sensory and affective descriptors.","Include disability, mood and fear in chronic pain assessment."],"m":"Use the McGill questionnaire for multidimensional chronic pain assessment."},{"q":"You are asked to review an 84-year-old woman overnight on the ward with a right hip fracture. The orthopaedic core trainee is unable to control her pain despite administering paracetamol and 15 mg Oramorph.<br><br><strong>What is the most appropriate next step for managing this patient’s pain?</strong>","o":["Add gabapentin","Give a stat one-off dose of ibuprofen","Start a patient controlled analgesia","This patient needs emergency surgery","Perform a nerve block"],"a":4,"e":"When paracetamol and opioids do not provide adequate preoperative hip-fracture analgesia, a femoral or fascia iliaca block is the recommended next step.","w":["Gabapentin is not first-line for acute nociceptive hip pain.","NSAIDs are generally avoided in frail elderly hip-fracture patients.","PCA increases opioid burden and delirium/respiratory risk.","Surgery should be timely but does not provide immediate bedside analgesia.","CORRECT"],"p":["Use regular paracetamol first.","Add cautious opioid if needed.","Perform fascia iliaca or femoral block when pain remains uncontrolled.","Regional analgesia reduces opioid requirement and delirium risk."],"m":"Uncontrolled hip-fracture pain despite paracetamol and opioid: perform a nerve block."},{"q":"A 59-year-old man with a 2 year history of type I complex regional pain syndrome affecting his left leg presents after failed epidural injections and physiotherapy. He has a fentanyl patch and is taking paracetamol, ibuprofen, amitriptyline and gabapentin. Despite this, he suffers from severe debilitating leg pain, allodynia and hyperalgesia.<br><br><strong>What intervention is the most appropriate next step in managing his symptoms?</strong>","o":["Spinal cord stimulation","Radiofrequency lumbar sympathectomy","Below knee amputation","Guanethidine-sympathetic blockade","Non-invasive brain stimulation"],"a":0,"e":"For refractory long-term CRPS after integrated medical and physical therapy, spinal cord stimulation is the recognised evidence-based next intervention.","w":["CORRECT","Evidence for sympathectomy is poor.","Amputation may worsen CRPS and is not used for pain control.","Guanethidine blocks are ineffective.","Brain stimulation remains experimental."],"p":["CRPS I occurs without a defined nerve injury.","Spinal cord stimulation is considered after failed multidisciplinary treatment.","A temporary trial precedes permanent implantation.","Continue rehabilitation alongside neuromodulation."],"m":"Refractory CRPS after comprehensive therapy: consider spinal cord stimulation."},{"q":"You are pre-assessing a 6-year-old child in the day unit for re-do strabismus surgery to the right eye. The mother tells you that the child underwent the procedure six months prior and had to stay overnight due to intractable postoperative nausea and vomiting.<br><br><strong>Which of the following is least likely to prevent a repeat of this?</strong>","o":["Avoidance of perioperative opioids","Atropine 20 μg/kg at induction","Ondansetron 0.15 mg/kg","Sevoflurane maintenance over desflurane","Ondansetron 0.15 mg/kg plus dexamethasone 0.15 mg/kg"],"a":3,"e":"All volatile agents increase PONV risk, and there is no evidence that sevoflurane is less emetogenic than desflurane. This substitution is least likely to help.","w":["Avoiding opioids reduces PONV.","Atropine reduces the oculocardiac reflex, which is associated with vomiting.","Ondansetron is effective prophylaxis.","CORRECT","Dual antiemetic therapy is more effective than ondansetron alone."],"p":["Strabismus surgery has a high PONV risk.","Use multimodal prophylaxis.","Avoid opioids and maintain normocapnia.","Ondansetron plus dexamethasone is more effective than either alone."],"m":"Changing desflurane to sevoflurane does not meaningfully reduce PONV."},{"q":"You are called to the emergency department to assess a 65-year-old non-insulin dependent diabetic man presenting with an ischaemic foot. He also has hypertension and exertional angina. He admits to getting progressively short of breath over the last 6 months but he is able to climb one flight of stairs without stopping. Physical examination reveals no basal crackles and heart sounds are normal.<br><br><strong>What is the next most appropriate step in the management of his acutely ischaemic foot?</strong>","o":["Delay surgery until an echocardiogram can be performed","Proceed to surgery without delay","Proceed to surgery after discussing the case with your consultant","Proceed to surgery after booking a bed in HDU/ITU","Delay surgery until an arteriogram is performed"],"a":2,"e":"Limb-threatening ischaemia should not be delayed for elective cardiac testing. Early senior discussion is appropriate to balance urgency, comorbidity and perioperative planning.","w":["Echo should not delay limb-saving surgery.","Proceeding without senior input ignores important cardiac risk.","CORRECT","A critical-care bed may be helpful but should not become a condition for surgery.","Imaging should not delay intervention if the vascular team has determined surgery is required."],"p":["Urgency can override further cardiac testing.","Stable angina and heart failure increase risk but do not mandate delay.","Involve a senior anaesthetist early.","Optimise monitoring and postoperative destination pragmatically."],"m":"Acute limb ischaemia: do not delay for cardiac tests—proceed after senior discussion."},{"q":"An obese 45-year-old patient has undergone an inguinal hernia repair under general anaesthesia and a first generation supraglottic airway device was used. In recovery, he becomes hypoxic and short of breath. You are suspecting pulmonary aspiration of gastric contents.<br><br><strong>Which of the following lung segments is most likely to be contaminated following an episode of aspiration during a general anaesthetic?</strong>","o":["Apical segments of the lower lobes","Posterior basal segments of the lower lobes","Lateral segment of the right middle lobe","Lateral basal segments of the lower lobes","Apical segments of the upper lobes"],"a":0,"e":"During general anaesthesia the patient is usually supine. In this position, aspirate most often enters the dependent superior (apical) segments of the lower lobes.","w":["CORRECT","Posterior basal segments are more affected when upright.","Right middle lobe or lingula is more vulnerable when prone.","Lateral basal segments are more dependent when upright.","Upper lobes are more likely when the patient is lateral."],"p":["Aspiration distribution depends on patient position.","Supine: superior/apical lower-lobe segments.","Upright: posterior or lateral basal lower lobes.","Prone: right middle lobe or lingula."],"m":"Supine aspiration most commonly contaminates the apical segments of the lower lobes."},{"q":"A 17-year-old girl with a body mass index of 15 has been brought to the emergency department with a heart rate of 42 beats per minute and a blood pressure of 76/34 mmHg. Her respiratory rate is 10 breaths per minute and she is complaining of epigastric discomfort. Her investigations reveal an atrioventricular block and her blood gases demonstrate a metabolic alkalosis. Her mother states that she has lost weight and has had amenorrhoea for the past six months.<br><br><strong>The most likely diagnosis is:</strong>","o":["Ectopic pregnancy","Duodenal perforation","Anorexia nervosa","Acute hypothyroidism","Opioid overdose"],"a":2,"e":"Low BMI, weight loss, amenorrhoea, bradycardia, hypotension, conduction disturbance and metabolic alkalosis strongly indicate anorexia nervosa with purging.","w":["Ectopic pregnancy would usually cause tachycardia with shock.","Perforation causes an acute abdomen and tachycardia.","CORRECT","Hypothyroidism does not usually cause this marked weight loss and alkalosis.","Opioid overdose causes miosis and respiratory acidosis."],"p":["Anorexia causes bradycardia, hypotension and arrhythmias.","Vomiting produces hypokalaemic metabolic alkalosis.","Amenorrhoea reflects hypothalamic–pituitary–gonadal suppression.","Assess electrolytes and refeeding risk."],"m":"Low BMI + amenorrhoea + bradycardia + alkalosis = anorexia nervosa."},{"q":"A 33-year-old man who suffers from chronic alcohol and drug abuse was admitted to the intensive care unit with a head injury 5 days ago. He has been intubated and ventilated since admission and has been receiving enteral nutrition. Whilst on the unit he has developed refeeding syndrome.<br><br><strong>Which of the following is the most appropriate management in this patient?</strong>","o":["Omitting fluids containing potassium","Avoiding thiamine in his enteral feed","Infusion of 10% dextrose to correct hypoglycaemia","Infusion of phosphate","Infusion of calcium chloride to counter hyperkalaemia"],"a":3,"e":"The hallmark of refeeding syndrome is severe hypophosphataemia from insulin-driven intracellular uptake. Phosphate replacement is therefore central to treatment.","w":["Potassium is usually low and requires replacement.","Thiamine should be given, not avoided.","Additional glucose may worsen the electrolyte shifts.","CORRECT","Hyperkalaemia is not the typical problem; potassium usually falls."],"p":["High-risk groups include chronic alcohol misuse and prolonged malnutrition.","Check phosphate, potassium, magnesium and calcium.","Give thiamine before and during feeding.","Restart nutrition slowly and replace deficits."],"m":"Refeeding syndrome = hypophosphataemia; treat with phosphate and thiamine."}],"7":[{"q":"You are anaesthetising a previously well 43-year-old woman for a craniotomy to remove a frontoparietal meningioma. The patient is supine, with a 30° head-up tilt. 1 hour into the operation her oxygen saturations suddenly drop from 98% to 65%, her end-tidal CO₂ from 4.5 kPa to 2 kPa and her blood pressure, which initially rises, begins to fall rapidly.<br><br><strong>Which of the following best describes your initial step in the management of the situation?</strong>","o":["Administer 100% oxygen","Insert a right internal jugular central venous pressure catheter and aspirate any air","Raise the patient’s venous pressure at the operative site by levelling the table +/− inotropic agent +/− performing a Valsalva manoeuvre","Alert the surgeons and ask them to flood the operative site","Turn the patient into the left lateral, head down position"],"a":3,"e":"This is venous air embolism. The first priority is to stop further air entrainment by immediately alerting the surgeon to flood or pack the operative field.","w":["100% oxygen is essential, but first stop further air entry.","Central venous aspiration is useful only if a line is already appropriately positioned and follows source control.","Raising venous pressure follows immediate occlusion of the entry site.","CORRECT","Durant positioning is reserved for cardiovascular collapse and may be difficult during craniotomy."],"p":["A sudden fall in ETCO₂ is an early clue to venous air embolism.","Stop air entry first.","Then give 100% oxygen and support circulation.","Aspirate a right-atrial catheter if present."],"m":"Venous air embolism: first tell the surgeon to flood and occlude the operative site."},{"q":"You are caring for a 70 kg man undergoing coronary artery bypass grafting. Long term 75 mg aspirin was discontinued 5 days preoperatively. His separation from cardiopulmonary bypass was uneventful but during sternal wiring the surgeon states that the patient is ‘oozy’ and you note there is already 500 mL in the mediastinal drain. The activated clotting time is 115 seconds. TEG: r time 32 mm, k time 12 mm, α-angle 40°, maximum amplitude 40 mm, Ly30 5.0%.<br><br><strong>What is the most appropriate treatment?</strong>","o":["Further 50 mg protamine and 2 units of fresh frozen plasma","2 g tranexamic acid","10 units cryoprecipitate and 50 mg protamine","2 units of fresh frozen plasma and 2 pools of platelets","Re-open the patient and explore for bleeding immediately"],"a":3,"e":"Prolonged r time indicates clotting-factor deficiency, while low maximum amplitude indicates weak clot from platelet dysfunction or deficiency. FFP plus platelets treats both.","w":["ACT is normal, so more protamine is inappropriate.","Ly30 is normal, so there is no evidence of hyperfibrinolysis.","This provides fibrinogen and protamine but not platelets.","CORRECT","Correct the demonstrated coagulopathy before immediate resternotomy unless bleeding remains severe."],"p":["Prolonged r time → consider FFP.","Low MA → consider platelets.","High Ly30 → consider antifibrinolytic therapy.","Normal ACT argues against residual heparin."],"m":"TEG with prolonged r time and low MA requires FFP plus platelets."},{"q":"You are asked to assess a 78-year-old man scheduled for a transurethral resection of his prostate for prostate cancer. He appears fit and well but complains of being intermittently ‘light headed’. A portion of his ECG is shown in Figure 7.1.<br><br><strong>What is the most appropriate course of action to take?</strong>","o":["Refer for DDD pacemaker preoperatively","Schedule for surgery after reviewing a transthoracic echocardiograph","Refer for an AAI pacemaker preoperatively","Refer for a VVIR pacemaker postoperatively","Check electrolytes and if normal schedule for surgery"],"a":0,"e":"The ECG demonstrates symptomatic Mobitz II AV block. This is a class I indication for a permanent pacemaker, and dual-chamber DDD pacing preserves AV synchrony.","w":["CORRECT","Echocardiography does not correct the conduction abnormality.","Atrial pacing alone cannot protect against infranodal AV block.","Ventricular-only pacing loses AV synchrony and should not be delayed until after surgery.","Normal electrolytes do not make symptomatic Mobitz II safe."],"p":["Mobitz II is usually infranodal and may progress to complete heart block.","Symptomatic high-grade AV block requires pacing.","DDD pacing preserves AV synchrony.","Elective surgery should wait for definitive pacing."],"m":"Symptomatic Mobitz II AV block requires a preoperative DDD pacemaker."},{"q":"A 65-year-old man with severe obstructive sleep apnoea/hypopnoea syndrome has recently started using an auto-titrating nasal CPAP device to treat his daytime somnolence after lifestyle modifications failed to help. In clinic, he feels no better and admits to not fully complying with the treatment because of nasal stuffiness and irritation at night with occasional epistaxis.<br><br><strong>What is the most appropriate next step in managing his sleep apnoea?</strong>","o":["Change to fixed level CPAP","Change to bilevel positive airway pressure","Apply humidification","Introduce a mandibular repositioning device","Offer uvulopalatopharyngoplasty"],"a":2,"e":"Dry, cool high-flow air commonly causes nasal irritation, dryness and epistaxis. Heated humidification improves comfort and CPAP adherence.","w":["Fixed CPAP may worsen pressure intolerance and does not treat nasal dryness.","BiPAP is not required solely for nasal irritation.","CORRECT","Mandibular devices are mainly for mild–moderate OSA or CPAP failure.","Surgery is not first-line without a correctable anatomical lesion."],"p":["Treat CPAP side effects before declaring treatment failure.","Humidification reduces nasal dryness and bleeding.","Auto-titrating CPAP already minimises mean pressure.","Adherence is essential before judging efficacy."],"m":"CPAP-related nasal dryness and epistaxis: add humidification."},{"q":"A 39-year-old woman with a body mass index of 46 kg/m² for umbilical hernia repair is seen in day surgery pre-assessment clinic. She has well controlled hypertension. She snores loudly but sleeps well with no daytime somnolence. Her neck circumference is 35 cm, oxygen saturation on air is 96% and ECG is normal.<br><br><strong>Which option is the most appropriate next action?</strong>","o":["She can proceed for day case surgery","She should be listed for inpatient surgery","She should be referred for sleep studies","She should have a glucose tolerance test","She should be advised to lose weight prior to surgery"],"a":0,"e":"Obesity alone does not exclude day surgery. Her STOP-BANG score is low-to-intermediate without daytime symptoms or physiological abnormalities, so she may proceed in an appropriately equipped unit.","w":["CORRECT","Routine inpatient admission is not required solely because of BMI.","Sleep studies are not indicated without stronger symptoms or a high score.","A formal glucose tolerance test is not required for this decision.","Weight advice is appropriate but should not unnecessarily delay surgery."],"p":["BMI alone should not exclude day surgery.","Use STOP-BANG to screen for OSA.","Avoid long-acting opioids in obese patients.","Discharge only when baseline saturation is maintained unstimulated."],"m":"Morbid obesity alone is not a contraindication to day-case surgery."},{"q":"A 73-year-old man in the recovery room is extremely confused, combative and tachypnoeic after a radical robotic prostatectomy lasting nearly 7 hours. You also notice significant periorbital swelling.<br><br><strong>The immediate treatment for the likely condition includes:</strong>","o":["Non-invasive humidified CPAP by mask","Non-invasive BiPAP by mask","Heliox with added oxygen and urgent ENT referral","Ophthalmology opinion","Reintubation and head-up positioning"],"a":4,"e":"Prolonged steep Trendelenburg can cause severe facial, laryngeal and cerebral oedema. Agitation and tachypnoea make non-invasive support unsafe; secure the airway and position head-up.","w":["The confused combative patient is unlikely to tolerate CPAP safely.","BiPAP does not protect an oedematous airway.","Heliox is only a bridge for selected upper-airway obstruction.","Periorbital swelling is part of a broader head-and-neck oedema problem.","CORRECT"],"p":["Robotic prostatectomy uses prolonged steep Trendelenburg.","Expect facial, airway and cerebral oedema.","Reintubate if airway safety is doubtful.","Head-up positioning promotes venous drainage."],"m":"Severe agitation and facial oedema after prolonged Trendelenburg: reintubate and sit head-up."},{"q":"A 50-year-old man awaiting surgery for a mediastinal tumour becomes progressively more tachypnoeic and stridulous on room air. Heliox is administered as a holding measure and his symptoms slowly improve.<br><br><strong>Which physical property of helium is most important?</strong>","o":["A reduced density compared to air","A higher viscosity compared to air","A higher thermal conductivity compared to air","A lower blood:gas solubility coefficient compared to air","Its non-reactivity within the airway"],"a":0,"e":"Helium is much less dense than air, reducing the Reynolds number and resistance to turbulent flow through a narrowed airway.","w":["CORRECT","Its viscosity is similar to air and is not the key mechanism.","High thermal conductivity may cause cooling but does not improve flow.","Low solubility is useful for lung-volume measurement, not airway obstruction.","Chemical inertness means no pharmacological effect."],"p":["Heliox reduces turbulent-flow resistance.","It is a temporary bridge, not definitive treatment.","Its benefit is greatest in large-airway narrowing.","Adequate oxygen concentration must still be delivered."],"m":"Heliox works because helium has a much lower density than air."},{"q":"A 55-year-old man is undergoing emergency coronary angioplasty for myocardial infarction after return of spontaneous circulation from a ventricular fibrillation cardiac arrest. You have been urgently called to provide a general anaesthetic in the cardiac catheterisation suite as he is becoming increasingly drowsy and confused with a GCS of 10/15.<br><br><strong>What should you prioritise as your first action?</strong>","o":["Check the anaesthetic machine","Ensure suction and a tipping trolley is present","Take a history and perform a brief neurological examination","Draw up the emergency drugs","Call for anaesthetic assistance"],"a":4,"e":"Remote-site anaesthesia must not be undertaken alone. Calling for a dedicated skilled anaesthetic assistant is the first priority; equipment and drug checks can follow immediately.","w":["The machine must be checked, but assistance should be summoned first.","Suction and patient positioning are essential but can be prepared once help is coming.","The airway need is already evident; a detailed examination should not delay preparation.","Drugs are required, but safe anaesthesia needs trained assistance.","CORRECT"],"p":["Remote anaesthesia carries extra environmental and access risks.","Always have a dedicated anaesthetic assistant.","Prepare for cardiac arrest and difficult access.","Use theatre-equivalent monitoring and equipment."],"m":"In a remote location, first call for skilled anaesthetic assistance."},{"q":"A 75-year-old woman with chronic anaemia and angina is to have a Colles’ fracture reduction under Bier’s block.<br><br><strong>Which local anaesthetic agent is most appropriate?</strong>","o":["Levobupivacaine","Lignocaine","Ropivacaine","Prilocaine","Chloroprocaine"],"a":1,"e":"Prilocaine is usually preferred for IV regional anaesthesia, but it may cause methaemoglobinaemia and should be avoided in anaemia and ischaemic heart disease. Lignocaine is the best alternative.","w":["Levobupivacaine is too cardiotoxic and long acting for IVRA.","CORRECT","Ropivacaine is not recommended for Bier’s block.","Prilocaine may reduce oxygen-carrying capacity through methaemoglobinaemia.","Chloroprocaine causes venous irritation and is not routinely used for IVRA in the UK."],"p":["Never use bupivacaine for Bier’s block.","Prilocaine is usually least toxic but can cause methaemoglobinaemia.","Lignocaine maximum is commonly 3 mg/kg without adrenaline.","Do not release the tourniquet before 20 minutes."],"m":"IVRA in anaemia or angina: choose lignocaine rather than prilocaine."},{"q":"A 65-year-old woman is to have a palmar fasciectomy of the middle finger under axillary nerve block. Thirty minutes after performing the block, it is apparent that the median nerve is spared. You decide to perform a supplementary median nerve block.<br><br><strong>Which approach is most appropriate?</strong>","o":["Wrist","Mid-forearm","Axillary","Antecubital fossa","Supraclavicular"],"a":3,"e":"At the antecubital fossa, the block is proximal to the origin of the anterior interosseous nerve and therefore covers all relevant median nerve branches for hand surgery.","w":["A wrist block misses the anterior interosseous branch.","A mid-forearm block may also be distal to the anterior interosseous branch.","Repeating the failed axillary injection is less logical.","CORRECT","A proximal supraclavicular block is unnecessarily extensive after an axillary block."],"p":["The anterior interosseous nerve leaves just distal to the antecubital fossa.","Use 5–7 mL around the median nerve under ultrasound.","Supplement a spared nerve distally rather than repeating the whole plexus block.","Avoid intraneural injection."],"m":"Supplement a spared median nerve at the antecubital fossa."},{"q":"A 6-year-old boy with global developmental delay is first on your surgical list for orchidopexy. He will not interact with you. One attempt at intravenous access fails; the child is inconsolable and the mother is visibly distressed.<br><br><strong>The best way to proceed would be:</strong>","o":["Cancel and require counselling/play therapy before rebooking","Overpower the child and proceed with sevoflurane 8% in oxygen","Overpower the child and proceed with sevoflurane 8% in oxygen and nitrous oxide","Send the child back to the ward and prescribe oral midazolam 0.5 mg/kg, resending at 15 minutes","Send the child back to the ward and prescribe oral ketamine 5 mg/kg, resending at 15 minutes"],"a":3,"e":"Restraint should be a last resort. Oral midazolam is the standard first-line premedication and allows the child and mother time to settle before another attempt.","w":["Cancellation is not yet necessary because premedication has not been tried.","Forced inhalational induction risks laryngospasm and psychological trauma.","Nitrous oxide does not make forced induction acceptable.","CORRECT","Oral ketamine is generally reserved when first-line strategies fail."],"p":["Oral midazolam dose: 0.5 mg/kg.","Onset is about 5–10 minutes, peaking later.","Use the minimum restraint necessary only as a last resort.","Debrief the parent and child after a difficult induction."],"m":"After failed IV access in a distressed child, step back and use oral midazolam."},{"q":"A 35-year-old man has presented with a syncopal episode the day after a fall during a rugby match, and CT scan has confirmed an extradural haematoma.<br><br><strong>What feature indicates that intubation should be performed before transfer to a neurosurgical centre?</strong>","o":["GCS 11/15","An episode of vomiting","A seizure","Suspected skull fracture","A drop in GCS by 1 point on the verbal scale"],"a":2,"e":"A seizure following head injury is a recognised indication for intubation and controlled ventilation before transfer.","w":["GCS 11 alone does not mandate intubation if airway and physiology are stable.","Vomiting requires caution but is not an absolute indication alone.","CORRECT","A suspected fracture alone does not require intubation.","A one-point verbal fall alone is not the threshold; motor deterioration is more important."],"p":["Intubate for GCS ≤8.","Also intubate for seizures or loss of airway reflexes.","A fall of one motor point or two total points is significant.","Maintain PaO₂ >13 kPa and PaCO₂ about 4.5–5 kPa."],"m":"Head injury plus seizure: intubate before transfer."},{"q":"A 45-year-old man has suffered an isolated, catastrophic, irrecoverable traumatic brain injury. He has become progressively tachycardic, hypotensive and polyuric despite aggressive crystalloid filling. Blood pressure is 75/45 mmHg and stroke volume is 82 mL.<br><br><strong>The first vasoactive drug of choice is:</strong>","o":["Adrenaline","Dopamine","Labetalol","Vasopressin","Metaraminol"],"a":3,"e":"Catastrophic brain injury commonly causes diabetes insipidus and vasoplegia. Vasopressin treats both the hypotension and the underlying ADH deficiency.","w":["Adrenaline increases myocardial oxygen demand and does not treat DI.","Dopamine is less targeted and may cause arrhythmia.","Labetalol would worsen hypotension.","CORRECT","Metaraminol supports vascular tone but does not reduce polyuria."],"p":["Brain death may cause DI, myocardial depression and vasoplegia.","Polyuria suggests loss of ADH.","Vasopressin supports blood pressure and reduces urine output.","Correct hypovolaemia first."],"m":"Potential donor with polyuria and vasoplegic hypotension: use vasopressin."},{"q":"A 76-year-old man underwent uncomplicated three-vessel on-pump CABG 4 hours ago. Noradrenaline requirement has increased from 0.08 to 0.2 μg/kg/min, CVP remains 12 mmHg, chest-drain loss is 300 mL and metabolic acidosis is worsening.<br><br><strong>What is the next appropriate intervention?</strong>","o":["Organise an urgent transthoracic echocardiogram","Request the cardiothoracic surgeon to attend immediately","Give sequential intravenous crystalloid boluses of 100 mL","Commence dobutamine 2.5 μg/kg/min","Insert a pulmonary artery catheter"],"a":2,"e":"Early after bypass, warming, vasodilation, redistribution and modest blood loss commonly produce relative hypovolaemia. Small sequential fluid challenges with reassessment are the best initial intervention.","w":["Echo is useful if the patient does not respond or a mechanical problem is suspected.","The surgeon should be informed, but immediate assessment of fluid responsiveness is appropriate.","CORRECT","Do not start inotropy before correcting possible preload deficiency.","A pulmonary artery catheter is unnecessary as the first step."],"p":["Use small 100–250 mL fluid challenges after cardiac surgery.","Assess response after each bolus.","Consider tamponade, graft failure and pneumothorax if no response.","Worsening lactate indicates impaired perfusion."],"m":"Early post-CABG deterioration without obvious bleeding: test fluid responsiveness with small boluses."},{"q":"A 65-year-old man with moderate COPD has been ventilated for an infective exacerbation for 5 days. During a spontaneous breathing trial he rapidly develops shallow breathing, hypercapnia, mild respiratory acidosis and a modest fall in PaO₂. He also has a significant secretion load and only a moderate cough.<br><br><strong>The best strategy is:</strong>","o":["Extubate onto mask ventilation","Perform a percutaneous tracheostomy later today","Institute protocolised gradual reduction in pressure support","Initiate titrated interval sprint weaning with work and rest cycles","Re-sedate and recommence SIMV"],"a":3,"e":"He clearly fails the spontaneous breathing trial because of respiratory muscle fatigue. Short, titrated work periods separated by adequate rest are the most appropriate COPD weaning strategy.","w":["Secretions and weak cough make NIV-assisted extubation risky.","Day 5 is too early for routine tracheostomy without a clear prolonged need.","Gradual pressure reduction is possible but does not target fatigue as effectively.","CORRECT","SIMV is inferior for weaning and unnecessary sedation delays recovery."],"p":["COPD weaning failure is often due to respiratory muscle fatigue.","Use work–rest sprint intervals.","Heavy secretions are a relative contraindication to NIV extubation.","Do not rush to tracheostomy on day 5."],"m":"Failed SBT in COPD with fatigue: use titrated sprint weaning."},{"q":"A 74-year-old man has been ventilated for 3 days after emergency laparotomy complicated by acute kidney injury requiring filtration. Overnight he develops fever, increased noradrenaline requirement and increased oxygen requirement.<br><br><strong>Which investigation is most useful in determining immediate empirical antibiotic treatment?</strong>","o":["Blood cultures from a peripheral site and central line","CT abdomen","Sputum and urine cultures","Stool sample","Chest radiograph"],"a":4,"e":"After more than 48 hours of ventilation with a new oxygen requirement, ventilator-associated pneumonia is likely. A chest radiograph rapidly identifies new consolidation and helps select the likely source for empirical therapy.","w":["Blood cultures are useful but do not localise the most likely source immediately.","CT abdomen is considered if initial tests do not identify a source.","Cultures should be obtained but results are not immediate.","A stool sample is not indicated without diarrhoea.","CORRECT"],"p":["VAP occurs after >48 hours of ventilation.","Look for fever, purulent secretions, worsening oxygenation and new infiltrates.","Early VAP tends to involve community organisms; late VAP more resistant organisms.","Obtain cultures before antibiotics when this causes no delay."],"m":"Ventilated patient with fever and rising oxygen need: obtain a chest radiograph first."},{"q":"A 69-year-old woman with chronic renal impairment underwent on-pump CABG yesterday. She is now oliguric at 18 mL/hour with a positive balance of 2430 mL. Bicarbonate has fallen from 20 to 14 mmol/L, potassium risen from 5.6 to 6.4 mmol/L, urea from 7.6 to 17.6 mmol/L and creatinine from 110 to 182 μmol/L.<br><br><strong>The best renal treatment strategy is:</strong>","o":["Commence dopamine infusion","Give 15 units short-acting insulin in 50 mL 50% dextrose over 15 minutes","Give 500 mL 1.23% sodium bicarbonate","Give furosemide 20 mg then 5 mg/hour","Commence renal replacement therapy"],"a":4,"e":"She has rapidly progressive AKI with oliguria, hyperkalaemia, metabolic acidosis, uraemia and fluid overload. Definitive renal replacement therapy is required.","w":["Low-dose dopamine does not prevent or treat AKI.","Insulin/dextrose is only temporary and may cause dysglycaemia and rebound hyperkalaemia.","Bicarbonate does not correct the underlying renal failure.","Diuretics may increase urine volume but do not improve renal outcome.","CORRECT"],"p":["Dialysis indications: refractory hyperkalaemia, acidosis, uraemia or fluid overload.","Rising K⁺ plus oliguria is particularly concerning.","Give IV calcium if ECG toxicity is present.","Do not use dopamine for renal protection."],"m":"Progressive oliguric AKI with K⁺ 6.4 and acidosis requires renal replacement therapy."},{"q":"A late-booking 37-year-old woman presents at 37 weeks with recurrent painless vaginal bleeding. She is haemodynamically stable and not in labour. Grade III placenta praevia is diagnosed and she is to have a category III Caesarean section.<br><br><strong>Which should form part of the anaesthetic plan?</strong>","o":["Large-bore intravenous access and group and save","Large-bore intravenous access, cross-matched blood and general anaesthesia","Cross-matched blood, cell salvage and regional anaesthesia","Group and save, cell salvage and general anaesthesia","Large-bore intravenous access, cross-matched blood and intraoperative cell salvage"],"a":4,"e":"Grade III placenta praevia carries major haemorrhage risk. The essential plan includes large-bore IV access, immediately available cross-matched blood and cell salvage.","w":["Group and save alone is insufficient.","General anaesthesia is not mandatory, and cell salvage is omitted.","Large-bore access is omitted.","Cross-matched blood is omitted.","CORRECT"],"p":["Prepare at least four units of cross-matched blood.","Use cell salvage for anticipated major obstetric bleeding.","Regional anaesthesia may be appropriate in a stable patient.","Have rapid infusion and a multidisciplinary team ready."],"m":"Placenta praevia plan: large-bore IV access, cross-matched blood and cell salvage."},{"q":"A 27-year-old woman is rushed into theatre with a postpartum haemorrhage of 800 mL. Uterine inversion has been diagnosed and manual reduction has failed. Blood pressure is 100/60 mmHg and heart rate 95 beats per minute. She has adequate IV access and is receiving crystalloid.<br><br><strong>What is the best next management?</strong>","o":["General anaesthesia and immediate laparotomy","Administration of a tocolytic agent","Immediate infusion of two units of O-negative blood","Regional anaesthesia to relax the uterus","Rapid infusion of 500 mL crystalloid, then regional anaesthesia"],"a":1,"e":"After failed manual reduction in a relatively stable patient, pharmacological uterine relaxation with a tocolytic facilitates replacement.","w":["General anaesthesia is used if tocolysis and further reduction fail.","CORRECT","Her haemodynamics do not currently mandate immediate uncrossmatched blood.","Regional anaesthesia does not relax the uterus adequately.","Additional fluid plus regional anaesthesia does not address the inversion."],"p":["Use terbutaline, magnesium or IV glyceryl trinitrate.","Continue haemorrhage resuscitation simultaneously.","After reduction, give uterotonics to maintain tone.","Proceed to GA and laparotomy if reduction remains impossible."],"m":"Failed manual reduction of uterine inversion: give a tocolytic next."},{"q":"A 3-year-old 16 kg child is scheduled for adenotonsillectomy. He ate a light breakfast at 7 am and has had nothing since. It is now 1 pm and he is unlikely to be anaesthetised until 4 pm. He is hungry and thirsty.<br><br><strong>The best course of action is:</strong>","o":["Postpone the case and let the child eat and drink","Let the child drink clear water until 2 pm, planning anaesthesia at 4 pm","Start an IV infusion of 0.9% saline","Start an IV infusion of 0.9% saline with 5% dextrose","Continue fasting and do the child as soon as possible"],"a":1,"e":"Clear fluids are permitted until 2 hours before anaesthesia. Allowing water reduces thirst and dehydration without increasing aspiration risk.","w":["The operation need not be cancelled.","CORRECT","IV fluid is unnecessary when oral clear fluid is safe.","Dextrose-containing IV fluid is also unnecessary.","Prolonged fasting causes avoidable distress and dehydration."],"p":["Food/formula: 6 hours.","Breast milk: 4 hours.","Clear fluids: 2 hours.","Minimise fasting rather than routinely exceeding these intervals."],"m":"Children may drink clear water until 2 hours before anaesthesia."},{"q":"A 2-month-old 6 kg boy is having an emergency laparotomy for bowel obstruction. Nasopharyngeal temperature is 35.8°C.<br><br><strong>The best way to reduce heat loss through radiation is:</strong>","o":["Turn the theatre temperature up","Use a warm-air blanket","Use an overhead radiant heater","Cover the patient’s head with a hat","Use warm irrigation fluid"],"a":0,"e":"Radiant heat loss depends on the temperature difference between the patient and surrounding surfaces. Raising ambient theatre temperature most effectively reduces that gradient.","w":["CORRECT","Forced-air warming mainly reduces convective and radiant loss from covered skin but does not reduce the environmental gradient as directly.","A radiant heater supplies heat but the question asks how to reduce radiant loss.","A hat reduces heat loss from one surface area only.","Warm irrigation reduces conductive heat loss."],"p":["Infants lose heat rapidly because of a high surface-area-to-mass ratio.","Warm the operating room before the child arrives.","Use multiple warming methods together.","Monitor core temperature continuously."],"m":"To reduce radiant heat loss, reduce the patient–environment temperature gradient by warming the theatre."},{"q":"A 46-year-old man developed back pain after heavy lifting 6 months ago and still has lower-back pain radiating to his buttocks. He limits gardening and golf because of pain.<br><br><strong>What is the most likely cause?</strong>","o":["Epidural adhesions","Facet joint","Disc prolapse","Discogenic","Sacroiliac pain"],"a":3,"e":"Mechanical low-back pain referred to the buttocks without radicular features is most commonly discogenic.","w":["Epidural adhesions usually follow surgery or inflammation.","Facet pain is possible but accounts for a smaller proportion in younger patients.","Disc prolapse usually causes radicular leg pain and neurological symptoms.","CORRECT","Sacroiliac pain is less common than discogenic pain."],"p":["Discogenic pain is the commonest identified source of mechanical back pain.","Pain is usually axial and activity related.","Referred pain may reach the buttocks or thighs.","Radicular pain below the knee suggests nerve-root involvement."],"m":"Chronic mechanical back pain referred to the buttocks is most often discogenic."},{"q":"A 36-year-old primigravida at 38 weeks has BMI 40 and pre-eclampsia treated with labetalol. BP is 158/96 mmHg. She is 6 cm dilated and coping well. Platelets are 98 ×10⁹/L with normal clotting.<br><br><strong>What is the most appropriate labour analgesia?</strong>","o":["Remifentanil PCA","Intramuscular pethidine","Entonox","Epidural with patient-controlled epidural analgesia","No analgesia at present"],"a":3,"e":"An early working epidural reduces the hypertensive response to labour and can be extended for Caesarean delivery, avoiding a potentially difficult airway in an obese pre-eclamptic patient.","w":["Remifentanil requires intensive respiratory monitoring and does not offer the same emergency anaesthetic plan.","Pethidine is inferior and may cause maternal and neonatal sedation.","Entonox alone may be inadequate.","CORRECT","She should be counselled early before urgent analgesia or surgery becomes necessary."],"p":["Platelet count has no absolute universal cutoff; trend and coagulation matter.","Use a low-dose local-anaesthetic epidural mixture.","Recheck platelets if disease progresses and before catheter removal.","Obesity and pre-eclampsia both favour early epidural placement."],"m":"Obese pre-eclamptic patient in labour: establish an early epidural."},{"q":"A 69-year-old man undergoing elective hip replacement has significant COPD controlled with inhalers. You offer spinal anaesthesia.<br><br><strong>Which is the most appropriate postoperative analgesia option?</strong>","o":["Morphine PCA","Fentanyl PCA","Regular oral opioids","Intrathecal diamorphine","Femoral nerve catheter with bupivacaine"],"a":2,"e":"Regular oral opioids allow mobilisation and avoid PCA-associated respiratory depression or motor block from a femoral catheter.","w":["Morphine PCA increases respiratory-depression risk in severe COPD.","Fentanyl PCA offers no major safety advantage.","CORRECT","Intrathecal diamorphine carries delayed respiratory-depression risk.","A femoral catheter may inadequately cover hip pain and inhibit mobilisation."],"p":["Use multimodal oral analgesia after hip arthroplasty.","Avoid excessive opioid dosing in COPD.","Motor block delays rehabilitation.","Monitor sedation and ventilation carefully."],"m":"In severe COPD after hip replacement, regular oral opioids are preferable to PCA or intrathecal opioid."},{"q":"A 38-year-old woman known to the pain clinic presents with acute-on-chronic lower-back pain without radiation or red flags. Previous MRI was normal. Facet injections helped for only 2 weeks. She takes paracetamol and Oxycontin 20 mg twice daily.<br><br><strong>What is the most appropriate next step?</strong>","o":["Increase Oxycontin and add breakthrough Oxynorm","Book further facet joint injections","Book lumbar epidural","Add amitriptyline","Referral to a pain management programme"],"a":4,"e":"Persistent non-specific back pain is best managed with a multidisciplinary programme incorporating exercise, education and psychological strategies rather than escalating opioids or repeating short-lived procedures.","w":["Opioid escalation increases harm with limited long-term benefit.","Repeated injections gave only transient benefit.","Lumbar epidural has no evidence for simple non-radicular back pain.","Amitriptyline is not indicated without neuropathic features.","CORRECT"],"p":["Use multidisciplinary rehabilitation for chronic non-specific back pain.","CBT and graded exercise have good evidence.","Avoid immediate-release opioid escalation.","Exclude red flags before conservative management."],"m":"Chronic non-specific back pain needs a pain-management programme, not more opioids."},{"q":"A 30-year-old man with ulcerative colitis is undergoing total colectomy. He has used a fentanyl patch 50 μg/hour for one year and refused an epidural.<br><br><strong>What is the most appropriate pain-relief option?</strong>","o":["Morphine PCA 1 mg bolus while keeping the fentanyl patch on","Double the fentanyl patch dose","Bilateral TAP blocks","Increase patch to 75 μg/hour plus fentanyl PCA bolus only","Fentanyl PCA bolus 10 μg with background infusion 10 μg/hour"],"a":4,"e":"In major surgery, patch absorption becomes unpredictable. A fentanyl PCA with a background infusion provides baseline opioid to prevent withdrawal and patient-controlled rescue dosing.","w":["Continuing the patch gives unreliable absorption during fluid and temperature changes.","Doubling the patch is slow and unpredictable.","TAP blocks are useful adjuncts but inadequate alone in an opioid-tolerant colectomy patient.","Changing the patch plus bolus-only PCA remains unreliable.","CORRECT"],"p":["Opioid-tolerant patients need their baseline opioid requirement continued.","A background PCA infusion is appropriate only in selected tolerant patients.","Remove or account for the fentanyl patch.","Expect increased perioperative opioid requirements."],"m":"Opioid-tolerant colectomy patient: fentanyl PCA with a background infusion."},{"q":"You review a 7-year-old boy with an 11% TBSA partial-thickness chest burn from hot cooking oil. Vital signs and GCS are stable.<br><br><strong>Which information meets referral criteria to a specialised burns centre?</strong>","o":["Being 7 years old","Having an 11% TBSA scald","A likely significant inhalational injury","Any burn involving hot oil","He meets no referral criteria"],"a":1,"e":"Children under 16 with more than 5% dermal or full-thickness TBSA burn should be referred to a specialist burns centre.","w":["Age 7 alone is not an extreme-age criterion.","CORRECT","This mechanism does not suggest inhalational injury.","Hot oil alone is not a referral criterion.","An 11% burn clearly meets the paediatric TBSA threshold."],"p":["Paediatric referral threshold is >5% TBSA dermal/full-thickness burn.","Refer burns involving face, hands, feet, perineum or flexures.","Also refer inhalational injury or significant comorbidity.","Consider non-accidental injury in children."],"m":"A child with an 11% partial-thickness burn requires specialist burns referral."},{"q":"A 72-year-old man had an above-knee amputation under combined spinal–epidural. Surgery finished at 2 pm. Dalteparin 2500 units is planned at 10 pm.<br><br><strong>What instructions should be given about epidural removal and further dalteparin?</strong>","o":["Remove after checking PT and APTT","Remove after 10 am next day and administer dalteparin immediately","Remove at 10 pm the following evening and give dalteparin immediately","Remove at 11 am the following day and administer dalteparin after 4 hours","Leave catheter and await anaesthetic advice"],"a":3,"e":"After prophylactic LMWH, wait at least 12 hours before epidural-catheter removal, then wait 4 hours before the next dose.","w":["PT and APTT do not measure LMWH effect.","Immediate LMWH after removal is unsafe.","This delay is excessive and immediate dosing remains unsafe.","CORRECT","Clear instructions can be given without unnecessary delay."],"p":["Prophylactic LMWH: wait ≥12 hours before catheter removal.","After removal, wait ≥4 hours before the next dose.","Routine coagulation tests do not assess LMWH activity.","Use longer intervals for therapeutic dosing or renal impairment."],"m":"Epidural removal: 12 hours after prophylactic LMWH; next dose 4 hours later."},{"q":"A 42-year-old woman being assessed for gastric banding snores and has BMI 48 kg/m².<br><br><strong>According to STOP-BANG, which additional criterion would make her high risk for OSA?</strong>","o":["Collar size 38 cm","High blood pressure","Diabetes","Pulmonary hypertension","Collar size 33 cm"],"a":1,"e":"She already scores for snoring and BMI >35. Hypertension adds the third STOP-BANG point, placing her in the high-risk category.","w":["Neck circumference scores only if >40 cm.","CORRECT","Diabetes is not a STOP-BANG item.","Pulmonary hypertension is not an item.","A 33-cm neck does not score."],"p":["STOP: snoring, tiredness, observed apnoea, pressure.","BANG: BMI >35, age >50, neck >40 cm, male gender.","A score ≥3 indicates high risk.","Use the result to plan postoperative monitoring."],"m":"In this woman, hypertension gives the third STOP-BANG point."},{"q":"A 64-year-old man is brought to the emergency department with dizziness and difficulty breathing. Heart rate is 68 beats per minute, blood pressure 76/40 mmHg, and he has generalised rhonchi and wheeze without rash. He has chronic glaucoma and his eye drops were recently changed.<br><br><strong>Which eye drop is the most likely cause?</strong>","o":["Phenylephrine","Adrenaline","Brimonidine","Levobunolol","Apraclonidine"],"a":3,"e":"Levobunolol is a topical non-selective beta blocker. Systemic absorption can cause bronchospasm, bradycardia, hypotension and heart failure.","w":["Phenylephrine more often causes hypertension and tachyarrhythmia.","Adrenaline may cause hypertension and myocardial ischaemia.","Brimonidine is an alpha₂ agonist and does not typically cause bronchospasm.","CORRECT","Apraclonidine is also an alpha₂ agonist."],"p":["Eye drops can be rapidly absorbed through the nasolacrimal duct.","Topical beta blockers can cause major systemic effects.","Use punctal occlusion to reduce absorption.","Avoid non-selective ophthalmic beta blockers in asthma or severe COPD."],"m":"Wheeze and hypotension after new glaucoma drops: suspect levobunolol."}],"8":[{"q":"A 26-year-old man who suffered an isolated blunt force head injury a week ago, is showing no clinical signs of improvement. He is ventilator dependent and his family are aware of the situation. You are called to the neurointensive care unit to aid in the performance of brainstem death testing as there are no consultants available.<br><br><strong>Which factor is most likely to make testing inappropriate within the next hour?</strong>","o":["Recent cessation of an infusion of midazolam","Hyperglycaemia","Temperature of 34°C","Administration of atracurium 25 mg 40 minutes ago","Availability of two physicians to perform testing on this shift – an ST7 anaesthetist (yourself) and an ST7 respiratory physician"],"a":4,"e":"Brainstem death testing requires two suitably qualified doctors, and one must be a consultant. Two ST7 doctors alone cannot validly perform the tests.","w":["Recent midazolam may delay testing, but drug levels can be checked and may become acceptable.","Blood glucose is acceptable over a broad range once severe disturbance is excluded.","A temperature of 34°C can be corrected by active warming.","Residual atracurium can be assessed with nerve stimulation and reversed if necessary.","CORRECT"],"p":["Two doctors are required.","Both should have at least 5 years’ GMC registration.","One must be a consultant.","Neither should belong to the transplant team."],"m":"Brainstem death testing is invalid unless one of the two examining doctors is a consultant."},{"q":"A 70-year-old man with a history of well-controlled hypertension and smoking, has a large meningioma resected. It is a 6-hour procedure during which the blood loss is 600 mL. He coughs briefly on extubation and is transferred to the recovery room obeying commands. Half an hour later he rapidly drops his GCS to 3/15, becomes bradycardic and hypoxic. His blood pressure is maintained.<br><br><strong>Which of the following is the most likely cause for his deterioration?</strong>","o":["Myocardial infarction","Air embolism","Morphine analgesia","Intracranial haematoma","Hypovolaemia"],"a":3,"e":"Rapid neurological collapse with bradycardia after craniotomy strongly suggests an acute postoperative intracranial haematoma causing raised intracranial pressure.","w":["MI does not best explain the abrupt GCS fall with bradycardia.","Venous air embolism usually presents intraoperatively with an ETCO₂ fall and cardiovascular compromise.","Morphine toxicity is less likely given the timing and dramatic focal neurological deterioration.","CORRECT","Hypovolaemia would usually cause hypotension and tachycardia."],"p":["Post-craniotomy bleeding often appears early in recovery.","Coughing and hypertension may precipitate bleeding.","Bradycardia plus reduced consciousness suggests raised ICP.","Urgent neurosurgical review and imaging are required."],"m":"Sudden postoperative GCS fall with bradycardia after craniotomy = intracranial haematoma."},{"q":"You are anaesthetising a 70 kg patient for coronary artery bypass grafting (CABG). He suffered a non-ST elevation myocardial infarction (NSTEMI) 10 days ago but has been becoming increasingly breathless on minimal exertion. Recent angiography shows an 80% stenosis of the left main coronary artery. Baseline blood pressure is 130/80 mmHg. Following induction with fentanyl, midazolam and propofol, the systolic blood pressure drops to 65 mmHg and there is anterior ST elevation on the ECG. The blood pressure rises to 120/78 after 1.0 mg of metaraminol. The transoesophageal echo shows worsening anterior hypokinesis.<br><br><strong>What is the next most appropriate step?</strong>","o":["Give 500 mL of colloid stat","Give 30,000 units of heparin","Give 1 mg of metaraminol and wait for 2 minutes","Ask the surgeon to insert an intra-aortic balloon pump","Commence milrinone"],"a":1,"e":"Persistent ischaemia and worsening anterior wall motion despite restored blood pressure suggest the need for urgent cardiopulmonary bypass. Immediate full heparinisation prepares for bypass.","w":["A fluid bolus is not the key treatment for ongoing left-main ischaemia.","CORRECT","More metaraminol increases afterload and myocardial oxygen demand.","IABP may help later but could delay urgent bypass.","Milrinone before revascularisation may worsen hypotension."],"p":["Heparin dose for CPB is about 300–400 IU/kg.","Target ACT is usually >480 seconds.","Persistent wall-motion abnormality indicates ongoing ischaemia.","Do not delay urgent revascularisation."],"m":"Left-main ischaemia after induction with worsening TOE changes: heparinise for emergency bypass."},{"q":"A 45-year-old woman presents for urgent repair of a LeFort III fracture with involvement of the small bones of the nasal complex following a motor vehicle accident. Her mandibular molar teeth are loose and she has poor mouth opening and a clear cervical spine. It is anticipated she will be a difficult intubation and will require postoperative ventilation.<br><br><strong>Which route for airway control is the most appropriate to use in this scenario?</strong>","o":["Nasal intubation","Retromolar intubation","Surgical tracheostomy","Oral intubation via direct laryngoscopy","Submental intubation"],"a":2,"e":"LeFort III injury involving the nasal complex requires unobstructed oral and nasal surgical access, and postoperative ventilation is expected. A formal tracheostomy gives the safest stable airway.","w":["Nasal intubation interferes with nasal repair and may be unsafe.","Retromolar intubation is unsuitable with loose molars and prolonged ventilation.","CORRECT","Direct oral intubation is difficult and prevents dental occlusion.","Submental intubation is unsuitable for prolonged postoperative ventilation."],"p":["LeFort III = craniofacial disjunction.","Avoid nasal tubes when the nasal complex is fractured.","Submental/retromolar routes suit short-term access only.","Tracheostomy is preferred when prolonged ventilation is anticipated."],"m":"LeFort III + difficult airway + postoperative ventilation = surgical tracheostomy."},{"q":"You are called to assist a junior colleague who has just topped-up an epidural to enable an emergency Caesarean section for prolonged labour. The block level was confirmed to be satisfactory. Upon securing the surgical drapes the patient complained of a strange sensation around her mouth and double vision before becoming unconscious followed by loss of cardiac output.<br><br><strong>What is the most likely diagnosis?</strong>","o":["Concealed haemorrhage","Local anaesthetic (LA) toxicity","Amniotic fluid embolus","Pulmonary embolus","Total spinal block"],"a":1,"e":"Perioral symptoms and diplopia followed by CNS depression and cardiovascular collapse are classic for severe local anaesthetic systemic toxicity after an epidural top-up.","w":["Concealed haemorrhage does not explain the early neurological warning symptoms.","CORRECT","AFE is possible during labour but does not classically begin with circumoral symptoms.","PE does not cause the characteristic prodrome.","A total spinal would cause ascending paralysis and hypotension rather than early CNS excitatory symptoms."],"p":["LAST may occur immediately or up to an hour after dosing.","Early signs include circumoral tingling, tinnitus and visual disturbance.","Stop injection, call for help and start lipid rescue.","Use reduced adrenaline doses during LAST arrest."],"m":"Perioral symptoms before collapse after epidural top-up = local anaesthetic toxicity."},{"q":"A 54-year-old woman is to undergo an abdominal hysterectomy with lymph node resection for endometrial adenocarcinoma. She has mild asthma, managed on inhalers, recently diagnosed diet controlled type II diabetes, and a body mass index (BMI) of 38. She admits to snoring and daytime sleepiness. Her exercise tolerance is reasonable.<br><br><strong>The most appropriate analgesic plan would include:</strong>","o":["Gabapentin premedication. Simple analgesia and intravenous morphine intraoperatively with transversus abdominis plane (TAP) blocks at the end of the procedure. Postoperative PCA fentanyl in the high dependency unit (HDU)","Lumbar epidural with plain levobupivacaine and simple analgesia. Oral morphine postoperatively","Simple analgesia and intravenous morphine intraoperatively with TAP blocks at the end of the procedure. Postoperative PCA morphine in HDU","Simple analgesia, lumbar epidural PCEA with levobupivacaine/fentanyl mixture","Intraoperative Remifentanil target-controlled infusion, asleep spinal at the end of the procedure, PCA morphine"],"a":3,"e":"Her obesity and probable OSA make systemic opioid minimisation important. A low-dose epidural levobupivacaine/fentanyl mixture with simple analgesia provides effective opioid-sparing analgesia.","w":["Gabapentin plus PCA opioids increases sedation risk in probable OSA.","Plain local anaesthetic epidural may require more systemic opioid supplementation.","TAP blocks do not cover visceral pain well and PCA morphine increases respiratory risk.","CORRECT","An asleep spinal plus PCA morphine is less controllable and still opioid-heavy."],"p":["Abdominal hysterectomy has major visceral pain.","OSA favours opioid-sparing regional analgesia.","Low-dose local anaesthetic/opioid epidural improves dynamic pain.","Use multimodal simple analgesia."],"m":"Obese patient with probable OSA having open hysterectomy: use epidural PCEA to minimise systemic opioids."},{"q":"A 27-year-old man is scheduled for surgical exploration and repair of his fractured mandible after being assaulted the previous night with injuries to the side of his face. After administration of 100 μg fentanyl, 200 mg propofol and 50 mg rocuronium, his mouth will not open despite adequate force. He is afebrile with normal end tidal carbon dioxide levels.<br><br><strong>What is the most likely cause of his persistent mouth closure?</strong>","o":["Pain","Masseter spasm","Sub-masseteric abscess","Depressed zygomatic fracture","Anterior dislocation of the mandible"],"a":3,"e":"Persistent trismus despite anaesthesia and neuromuscular blockade suggests mechanical obstruction. A depressed zygomatic arch can impinge on the coronoid process and prevent mouth opening.","w":["Pain should be abolished by anaesthesia.","Masseter spasm is less likely after rocuronium with normal temperature and ETCO₂.","A submasseteric abscess is unlikely after an acute injury without fever.","CORRECT","Anterior mandibular dislocation produces a fixed open mouth, not a closed one."],"p":["Zygomatic arch fracture may be clinically subtle.","The arch can obstruct the coronoid process.","Mechanical trismus persists after paralysis.","Discuss restricted mouth opening with surgeons before induction."],"m":"Trismus that persists after paralysis suggests a depressed zygomatic arch fracture."},{"q":"48 hours following a severe traumatic brain injury, a 25-year-old man remains intubated and ventilated and haemodynamically stable. Sedation was discontinued 36 hours earlier but his GCS remains 3/15 and he continues to make no respiratory effort. The critical care te
