<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2457d6">
<title>Final FRCA — 300 SBAs</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe3eb;--p:#2457d6;--ps:#eef2ff;--g:#15803d;--gb:#ecfdf3;--r:#b42318;--rb:#fef3f2;--a:#8a4b00;--ab:#fffaeb}
[data-theme=dark]{--bg:#0f172a;--card:#172033;--text:#f8fafc;--muted:#a8b3c7;--line:#334155;--p:#7da2ff;--ps:#233251;--g:#57d487;--gb:#123321;--r:#ff8d86;--rb:#3a1d22;--a:#ffd16b;--ab:#3a2d12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:8px 8px 90px}.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;font-size:19px}
.btn,.primary,.danger{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:800;background:var(--card);color:var(--text)}.primary{background:var(--p);color:#fff;border-color:var(--p)}.danger{background:var(--rb);color:var(--r)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap}.active{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mock{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--card)}.mock h2{margin:0 0 5px;font-size:18px}.mock p{margin:3px 0;color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--p)}.mock-actions{display:flex;gap:7px;margin-top:10px}.mock-actions button{flex:1}
.hidden{display:none!important}.search{display:flex;gap:8px}.search input{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}.results{display:grid;gap:8px;margin-top:10px}.result{padding:10px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.meta,.tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:13px;font-weight:800;background:var(--bg)}
.qnum{color:var(--p);font-size:13px;font-weight:900}.question{margin:8px 0 14px}.opts{display:grid;gap:8px}.opt{width:100%;display:flex;gap:9px;text-align:left;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)}.letter{min-width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--ps);color:var(--p);font-weight:900}
.opt.correct{background:var(--gb);border-color:var(--g);color:var(--g)}.opt.wrong{background:var(--rb);border-color:var(--r);color:var(--r)}.opt:disabled{opacity:1}.answer{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}.correct-title{color:var(--g);font-weight:900}.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}.box h3{font-size:15px;margin:0 0 5px}.box p{margin:0}.wrong-line{font-size:14px;margin:6px 0;padding-left:8px;border-left:3px solid var(--r)}.box ul{margin:4px 0;padding-left:20px}.must{background:var(--ab);color:var(--a);font-weight:800}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}.marked{background:var(--ab)!important;color:var(--a)!important;border-color:var(--a)!important}.center{text-align:center;padding:22px 8px}.big{font-size:46px;font-weight:900;color:var(--p)}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sum{border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--bg)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.summary{grid-template-columns:1fr}.brand{font-size:17px}.question{font-size:15.5px}.opt{font-size:14.5px}}

"CORRECT","Atrial pacing is not the treatment for fast atrial flutter.","Digoxin has a slow onset and is unsuitable for urgent rhythm restoration."],"p":["Post-CABG AF/flutter commonly occurs within 48 hours.","Treat the patient, not only the blood pressure: cardiac index has fallen markedly.","Synchronise shocks with the R wave.","Atrial flutter often responds to relatively low-energy synchronised shocks."],"m":"Atrial flutter + haemodynamic compromise = synchronised DC cardioversion."},{"q":"You are scheduled to anaesthetise an 80 kg man for aortic valve replacement. He is 73 years old and reports a rash upon administration of penicillin. His skin swab is positive for methicillin-resistant <em>Staphylococcus aureus</em> (MRSA) colonisation.<br><br><strong>Which of the following antibiotic regimens is most appropriate for the patient?</strong>","o":["Flucloxacillin 2 g, gentamicin 120 mg","Vancomycin 1.5 g, gentamicin 400 mg","Cefuroxime 1.5 g, metronidazole 750 mg","Co-amoxiclav 1.2 g, linezolid 600 mg","Clindamycin 900 mg, ciprofloxacin 400 mg"],"a":1,"e":"Cardiac valve surgery requires Gram-positive cover, and MRSA colonisation requires vancomycin. Gentamicin adds Gram-negative cover; the stated doses match the book regimen.","w":["Flucloxacillin does not cover MRSA.","CORRECT","This lacks reliable MRSA cover; metronidazole is unnecessary here.","Co-amoxiclav does not cover MRSA and linezolid is not standard prophylaxis.","This is not the recommended cardiac surgical prophylaxis regimen."],"p":["Give prophylactic antibiotics before skin incision.","MRSA colonisation changes prophylaxis toward a glycopeptide.","Vancomycin must be infused slowly to reduce infusion reactions.","Check renal function when aminoglycosides are used."],"m":"MRSA-colonised patient for valve surgery: vancomycin-based prophylaxis."},{"q":"A 76 year old woman who is spontaneously breathing through a temporary double lumen cuffed tracheostomy tube following a laryngectomy becomes acutely breathless. Help is on its way but despite application of high-flow oxygen, her oxygen saturations are 82% with a respiratory rate of 40 breaths per minute.<br><br><strong>What is the most appropriate next step in her airway management?</strong>","o":["Deflate the tracheostomy tube cuff","Remove the inner cannula","Hand ventilate through the tracheostomy tube","Position the patient upright","Remove the tracheostomy tube"],"a":1,"e":"Acute obstruction of a double-lumen tracheostomy is commonly caused by a blocked inner cannula. Removing it is the quickest diagnostic and therapeutic step.","w":["Cuff deflation does not clear a blocked tube.","CORRECT","Ventilation through an obstructed inner cannula will fail.","Positioning does not relieve a mechanical obstruction.","Removing the whole tube is more invasive and follows simpler reversible steps."],"p":["Call for help and give oxygen to the stoma.","Remove attachments and the inner cannula first.","Pass a suction catheter to assess patency.","A laryngectomy patient cannot be oxygenated through the mouth/nose."],"m":"Blocked tracheostomy: remove the inner cannula first."},{"q":"A 28-year-old woman has an Achilles tendon repair under general anaesthesia as a day case. She has a BMI of 32 kg/m² and is taking the oral contraceptive pill. She will need a below knee plaster cast for 6–8 weeks postoperatively.<br><br><strong>What is the best form of venous thromboembolism prophylaxis for her?</strong>","o":["Advice on mobilisation and fluid intake","Graduated compression stockings and pneumatic compression device on day of surgery","Graduated compression stockings post discharge for 7 days","Single dose low molecular weight heparin on day of surgery","Extended course of low molecular weight heparin post discharge"],"a":4,"e":"She has multiple VTE risks and prolonged lower-limb immobilisation. Protection must continue during the high-risk post-discharge immobilisation period.","w":["Advice alone is inadequate for this risk profile.","Mechanical measures only on the operative day do not cover prolonged risk.","Seven days of stockings is insufficient for 6–8 weeks of immobilisation.","A single LMWH dose does not cover the post-discharge period.","CORRECT"],"p":["Assess patient and procedure VTE risk together.","Lower-limb immobilisation markedly prolongs risk.","Obesity and oestrogen-containing contraception add risk.","Balance LMWH against bleeding risk."],"m":"Prolonged lower-limb immobilisation with extra VTE risks requires extended prophylaxis."},{"q":"A 65-year-old woman is scheduled for an extended abdominal hysterectomy. She is not on any anticoagulants but 2 years ago she developed a blood clot following a total hip replacement. At that time her treatment injections caused a wound haematoma, and she was put on a ‘blood thinning’ infusion for several days. At the end of the treatment she remembers having investigations for low platelets in her blood. These results are unavailable.<br><br><strong>For immediate perioperative prophylaxis this time the best treatment would be:</strong>","o":["A heparin infusion started 6 hours following surgery if bleeding is controlled","Treatment dose low-molecular-weight heparin (LMWH) injection once daily","Fondaparinux injection once daily","Low-dose aspirin orally throughout the perioperative period","A danaparoid infusion"],"a":4,"e":"The history strongly suggests heparin-induced thrombocytopenia. Danaparoid is a non-heparin anticoagulant suitable when HIT is suspected and anticoagulation is required.","w":["Unfractionated heparin risks recurrent HIT.","LMWH cross-reacts with HIT antibodies and treatment dosing is excessive for prophylaxis.","Fondaparinux is not the book’s preferred immediate option in this scenario.","Aspirin is inadequate VTE prophylaxis for major pelvic surgery.","CORRECT"],"p":["HIT is prothrombotic, not simply a bleeding disorder.","Stop all heparin products when HIT is suspected.","Use a non-heparin anticoagulant.","Document previous HIT clearly before future procedures."],"m":"Suspected previous HIT: avoid UFH and LMWH."},{"q":"A 21-year-old woman is undergoing a Le Fort I transverse osteotomy to correct her maxillary retrusion. A nasal tube is used and anaesthesia is maintained by propofol and remifentanil infusions. During the down-fracture, her pulse rate falls to 29 bpm and her blood pressure reads 70/30 mmHg. Her oxygen saturation, end tidal CO₂ and airway pressures remain unchanged.<br><br><strong>What is the most likely cause of her haemodynamic compromise?</strong>","o":["Haemorrhage","Venous air embolus","Endotracheal tube damage","Trigeminocardiac reflex","Remifentanil"],"a":3,"e":"Maxillary manipulation stimulates trigeminal afferents and produces a vagal response: profound bradycardia and hypotension. Stable capnography and airway pressures argue against airway or embolic causes.","w":["Haemorrhage would not usually cause abrupt profound bradycardia.","Venous air embolism commonly changes end-tidal CO₂ and may impair oxygenation.","Tube damage would alter airway pressures, capnography or oxygenation.","CORRECT","Remifentanil may cause bradycardia, but the tight temporal link to down-fracture is classic for this reflex."],"p":["Afferent limb: trigeminal nerve.","Efferent limb: vagus nerve.","First action: stop surgical stimulation.","Treat persistent severe bradycardia with an anticholinergic."],"m":"Maxillofacial traction + sudden bradycardia = trigeminocardiac reflex."},{"q":"A 64-year-old man with no previous cardiac or respiratory morbidity is attending for his second treatment of electroconvulsive therapy (ECT). After his previous treatment, he had a supraventricular tachycardia with a peak blood pressure of 198/105 mmHg, which resolved spontaneously within 5 minutes. For his anaesthetic he had received propofol 90 mg and suxamethonium 40 mg.<br><br><strong>What is the most appropriate course of action for this second treatment?</strong>","o":["Perform procedure with defibrillation pads on his chest","Pre-medicate with oral atenolol","Use intravenous esmolol during procedure","Use remifentanil infusion during procedure","Use sublingual nifedipine during procedure"],"a":2,"e":"ECT causes a brief sympathetic surge with tachycardia and hypertension. Esmolol is short-acting, titratable and suitable for attenuating this transient response.","w":["Prophylactic pads are unnecessary after a brief self-terminating SVT.","Oral atenolol is prolonged and poorly titratable for a short procedure.","CORRECT","Remifentanil may reduce anaesthetic requirement but is not the best targeted treatment here.","Sublingual nifedipine is unpredictable and may cause excessive hypotension."],"p":["ECT initially causes parasympathetic then sympathetic activation.","Esmolol has rapid onset and short duration.","Avoid excessive beta-blockade that may shorten seizure duration.","Treat only clinically important haemodynamic responses."],"m":"Transient ECT-related tachycardia/hypertension: use a short-acting titratable agent such as esmolol."},{"q":"You are called to see a 65-year-old patient in the surgical ward 3 days following an elective abdominal aortic aneurysm repair. A thoracic epidural catheter is in situ. He is febrile and complains of back pain and lower limb weakness.<br><br><strong>What would be the most appropriate next step?</strong>","o":["Stop the epidural infusion and contact the neurosurgeon","Stop the epidural infusion, do regular neurological observations and monitor the epidural catheter site","Arrange an urgent MRI scan and inform the neurosurgeon","Stop the epidural infusion and start empirical antibiotics","Remove the epidural catheter and do a full neurological examination"],"a":2,"e":"Fever, spinal pain and neurological deficit with an epidural catheter suggest an epidural abscess. Urgent MRI and immediate neurosurgical involvement are required to prevent permanent injury.","w":["Stopping the infusion is sensible but imaging must not be delayed.","Observation alone risks irreversible neurological damage.","CORRECT","Antibiotics are needed, but first obtain urgent diagnostic assessment and neurosurgical input.","Removing the catheter alone neither diagnoses nor decompresses an abscess."],"p":["Classic red flags: fever, back pain, neurological deficit.","MRI is the investigation of choice.","Early decompression improves neurological outcome.","Take blood cultures and start antibiotics promptly after assessment."],"m":"Suspected epidural abscess with weakness = urgent MRI + neurosurgical referral."},{"q":"A 70 kg, 36-year-old man is scheduled for foot surgery under a regional anaesthetic approach.<br><br><strong>Which of the following needles would you use to perform a lateral popliteal nerve block?</strong>","o":["50 mm length, short bevel peripheral nerve block needle","50 mm length, long bevel peripheral nerve block needle","150 mm length, short bevel peripheral nerve block needle","100 mm length, short bevel peripheral nerve block needle","100 mm length, long bevel peripheral nerve block needle"],"a":3,"e":"The lateral popliteal approach is relatively deep, so a 100 mm needle is appropriate. A short bevel reduces the risk of nerve penetration and fascicular injury.","w":["A 50 mm needle is often too short for the lateral approach.","Long bevel needles are more likely to penetrate nerve fascicles.","150 mm is unnecessarily long for most adults.","CORRECT","The length is suitable but the long bevel is less safe."],"p":["Choose needle length according to target depth.","Short bevel gives more tissue resistance and reduces fascicular penetration.","Never inject against high resistance or with severe pain.","Ultrasound does not replace safe injection practice."],"m":"Deep peripheral block: adequate length, short bevel."},{"q":"A 28-year-old pedestrian struck by a bus presents to the emergency department. In hospital, he has had a primary survey which reveals an obvious head injury; he also appears to have a fracture to his right arm. His chest appears clear and a FAST scan of the abdomen is negative. Because he had been confused, the emergency medicine registrar has asked you to sedate him for a CT scan of his head. On examination, he grimaces and groans to a deep painful stimulus, but does not open his eyes. He flexes his left arm and leg.<br><br><strong>The safest option for CT scan would be to:</strong>","o":["Titrate small doses of propofol to effect with continuous monitoring including waveform capnography","Refuse to give sedative drugs on account of his depressed conscious state, but accompany him to the scanner","Perform a rapid sequence induction (RSI) with propofol and suxamethonium 1.5 mg/kg, and transfer with a propofol infusion","Perform a modified RSI with 1.5 mg/kg suxamethonium, after 2 μg/kg fentanyl and propofol and manual in-line stabilisation of the cervical spine","Fit a Miami J collar and blocks and then perform a modified RSI with 1 mg/kg rocuronium and 3 mg/kg ketamine"],"a":3,"e":"He has severe traumatic brain injury with an unprotected airway and possible cervical spine injury. Controlled intubation using manual in-line stabilisation, adequate induction and rapid neuromuscular blockade is safest.","w":["Sedation may cause airway obstruction, hypoventilation and secondary brain injury.","Transporting without securing the airway is unsafe at this conscious level.","This omits adequate analgesia and explicit cervical spine protection.","CORRECT","Ketamine/rocuronium may be reasonable in some settings, but the stated book answer is the modified RSI with fentanyl, propofol and suxamethonium."],"p":["Avoid hypoxia and hypotension in TBI.","Assume cervical spine injury until excluded.","Use manual in-line stabilisation during laryngoscopy.","Confirm ventilation continuously with waveform capnography."],"m":"Severe TBI requiring CT: secure the airway before transfer."},{"q":"A 19-year-old man presents to a district general hospital emergency department 8 hours after suffering a penetrating injury to his anterior chest. He has a Glasgow coma scale (GCS) of 15, heart rate of 105 beats per minute, blood pressure of 95/50 (MAP 65) mmHg, saturations of 99% on oxygen and a haemoglobin of 105 g/L. Transthoracic echocardiogram shows a haemopericardium for which he requires transfer to a nearby cardiothoracic centre for exploration.<br><br><strong>What pre-transfer intervention is most appropriate?</strong>","o":["Needle pericardiocentesis","Intubation and ventilation","Insertion of a pulmonary artery catheter for cardiac output monitoring","Insertion of invasive arterial and central venous catheter","Transfusion of 2 units packed red cells"],"a":3,"e":"He is maintaining consciousness and oxygenation but is at risk of sudden deterioration from tamponade. Invasive arterial pressure monitoring and reliable central access are appropriate before monitored transfer.","w":["Pericardiocentesis may worsen a temporarily contained penetrating injury and is reserved for collapse when surgery is unavailable.","Induction and positive-pressure ventilation can precipitate cardiovascular collapse in tamponade.","A pulmonary artery catheter is unnecessary and delays transfer.","CORRECT","Transfusion is not automatically indicated solely from haemoglobin 105 g/L and current observations."],"p":["Tamponade patients depend on preload and sympathetic tone.","Avoid unnecessary induction before definitive surgery.","Transfer with senior escort, blood available and continuous monitoring.","Prepare for immediate deterioration en route."],"m":"Stable penetrating haemopericardium: invasive monitoring and rapid transfer, not elective intubation."},{"q":"A 62-year-old man who sustained an isolated non-penetrating chest injury resulting in lung contusions and rib fractures is on the intensive care unit intubated and ventilated. He has deteriorated over the past 72 hours and now has a PaO₂:FiO₂ ratio (PFR) of 50 mmHg with a FiO₂ of 1.0 and a positive end-expiratory pressure (PEEP) of 5 cmH₂O. The investigations suggest he has developed Acute Respiratory Distress Syndrome (ARDS).<br><br><strong>The most important first intervention is:</strong>","o":["Furosemide bolus of 40 mg intravenously and commence an infusion aiming for a negative fluid balance","Administer a neuromuscular blocking agent","Perform a recruitment manoeuvre and incrementally increase the PEEP to above 14 cmH₂O","Adjust the ventilator settings to ensure tidal volumes of 6 mL/kg and a peak pressure of less than 30 cmH₂O","Prone the patient"],"a":2,"e":"This is profound hypoxaemia with very low PEEP. The first step in the book is lung recruitment followed by increasing PEEP to prevent derecruitment and improve oxygenation.","w":["Fluid restriction may help later but does not immediately recruit collapsed lung.","Neuromuscular blockade is an adjunct, not the first corrective step here.","CORRECT","Low tidal-volume ventilation is essential, but the stated pressure target should be plateau pressure and the immediate problem is severe derecruitment.","Proning is highly effective in severe ARDS but follows optimisation of basic ventilator settings."],"p":["Use lung-protective ventilation: about 6 mL/kg predicted body weight.","Keep plateau pressure ≤30 cmH₂O.","Use adequate PEEP in severe ARDS.","Prone early when severe hypoxaemia persists."],"m":"Severe ARDS with PEEP 5: recruit lung and raise PEEP promptly."},{"q":"A 26-year-old woman with a past medical history of self-harm was found unconscious at home with empty alcohol and amitriptyline bottles on the floor. These had been ingested within half an hour. On arrival to the emergency department her Glasgow coma scale (GCS) was 5 (E1, V1, M3). She was intubated for airway protection. The patient subsequently developed a blood pressure of 80/60 mmHg associated with a heart rate of 150 beats per min, a QRS width of 100 msec and multiple ventricular ectopic beats.<br><br><strong>The next most important intervention is:</strong>","o":["Nasogastric tube insertion and administration of activated charcoal","Intravenous crystalloid bolus of 20 mL/kg followed by a noradrenaline infusion to maintain blood pressure","500 mL intravenous sodium bicarbonate 1.26% for treatment of a broadened QRS complex","Lignocaine 2 mg/kg for the management of ventricular ectopic beats","Lipid emulsion 20% 1.5 mL/kg for intravascular sequestration of tricyclic drug"],"a":1,"e":"In this presentation the book prioritises immediate circulatory resuscitation with crystalloid and vasopressor support. Her QRS is 100 ms, so the bicarbonate option as written is not the best next intervention.","w":["Activated charcoal is secondary after stabilising life-threatening hypotension.","CORRECT","Bicarbonate is central when QRS prolongation or arrhythmia from TCA toxicity is significant, but this option is not the best immediate choice as framed.","Lignocaine is not first-line before correcting haemodynamic instability and sodium-channel blockade.","Lipid emulsion is a rescue therapy for refractory severe toxicity."],"p":["TCA poisoning causes sodium-channel blockade, hypotension and arrhythmias.","Secure airway early when consciousness is depressed.","Use sodium bicarbonate for QRS widening/ventricular dysrhythmia.","Avoid class IA and IC antiarrhythmics."],"m":"In poisoned patients, stabilise ABCs before decontamination."},{"q":"A 28-year-old woman presents with progressive and ascending motor weakness. She reports a recent history of coryzal symptoms.<br><br><strong>The following would be an early indicator of the requirement for intubation:</strong>","o":["Respiratory rate >35 breaths per minute","PaO₂ <8 kPa","PaCO₂ >6.5 kPa","Vital capacity <15 mL/kg","Absence of bulbar weakness"],"a":3,"e":"This suggests Guillain–Barré syndrome. Falling vital capacity is an early marker of impending ventilatory failure; blood-gas abnormalities occur late.","w":["Tachypnoea is non-specific and may occur late.","Hypoxaemia is a late sign of ventilatory failure.","Hypercapnia is a late and dangerous sign.","CORRECT","Bulbar weakness increases risk; its absence does not exclude deterioration."],"p":["Measure serial vital capacity, not only oxygen saturation.","Consider intubation at VC <15–20 mL/kg.","Assess cough, bulbar function and secretion clearance.","Autonomic instability may accompany respiratory weakness."],"m":"GBS: vital capacity <15 mL/kg is a major intubation warning."},{"q":"A 70 kg elderly man, awaiting an elective transurethral resection of prostate (TURP), is admitted to the intensive care unit (ITU) with urosepsis. His average urine output over 12 hours is 28 mL/hour.<br><br>His ITU admission and pre-admission clinic biochemistry profile are shown below:<div class=\"mini-table\"><div><b></b><b>Pre-admission</b><b>Admission</b></div><div><span>Urea (mmol/L)</span><span>6.2</span><span>11.2</span></div><div><span>Creatinine (μmol/L)</span><span>83</span><span>132</span></div><div><span>Na⁺ (mmol/L)</span><span>131</span><span>129</span></div><div><span>K⁺ (mmol/L)</span><span>4.5</span><span>5.1</span></div></div><br><strong>According to the RIFLE criteria, which stage of acute kidney injury does this man fulfil?</strong>","o":["Risk","Injury","Failure","Loss","End-stage renal disease"],"a":1,"e":"His creatinine has risen to about 1.6 times baseline and urine output is 0.4 mL/kg/hour for 12 hours. The urine criterion places him in the RIFLE ‘Injury’ category.","w":["Risk is urine output <0.5 mL/kg/hour for 6 hours; he has persisted for 12 hours.","CORRECT","Failure requires more severe creatinine rise or urine output <0.3 mL/kg/hour for 24 hours/anuria.","Loss describes persistent complete loss of renal function for >4 weeks.","ESRD requires loss for >3 months."],"p":["RIFLE uses the worst of creatinine/GFR or urine criteria.","Risk: UO <0.5 mL/kg/h for 6 h.","Injury: UO <0.5 mL/kg/h for 12 h.","Failure: UO <0.3 mL/kg/h for 24 h or anuria 12 h."],"m":"70 kg × 0.5 mL/kg/h = 35 mL/h; 28 mL/h for 12 h = RIFLE Injury."},{"q":"A 41-year-old man has been invasively mechanically ventilated for three days due to pancreatitis. He develops pyrexia and increasing oxygen requirements. He is noted to have new left lower zone infiltrates on chest X-ray.<br><br><strong>Which of the following organisms is most likely to be the cause of his deterioration?</strong>","o":["Escherichia coli","Methicillin sensitive Staphylococcus aureus (MSSA)","Pseudomonas","Acinetobacter","Vancomycin resistant enterococci (VRE)"],"a":1,"e":"Ventilator-associated pneumonia developing within the first few days is early-onset VAP. It is more commonly caused by community-type organisms such as MSSA.","w":["E. coli is possible but is not the most likely early-onset pathogen listed.","CORRECT","Pseudomonas is more typical of late-onset or prior-antibiotic VAP.","Acinetobacter is usually a late, healthcare-associated resistant pathogen.","VRE is not a common primary cause of VAP."],"p":["VAP is pneumonia after ≥48 hours of ventilation.","Early-onset pathogens are generally less resistant.","Late-onset VAP favours Pseudomonas, Acinetobacter and MRSA.","Send respiratory cultures before antibiotics when feasible."],"m":"Early VAP (around day 3): think MSSA rather than resistant Gram-negatives."},{"q":"A 32-year-old primigravid patient with a body mass index (BMI) of 55 is on the labour ward. It is 10 pm; she is currently 7 cm dilated and requesting an epidural. The baby is in the occiput posterior (OP) position. You are unable to palpate her spinous processes. On your third attempt, with difficulty, you perform a lumbar epidural at L3/4 and accidentally cause a dural tap.<br><br><strong>What is the best line of management in this situation?</strong>","o":["Repeat your attempt at an adjacent lumbar level and use a smaller test dose","Request help from a colleague to attempt the epidural","Use the ultrasound to help locate the depth of the epidural space before re-attempting","Abandon your attempt and institute a remifentanil PCA","Site a spinal catheter, inform midwife and perform subsequent top-ups yourself"],"a":4,"e":"After accidental dural puncture in a technically difficult obese parturient, threading the catheter intrathecally avoids further difficult attempts and provides reliable analgesia. It must be clearly labelled and managed by experienced staff.","w":["Another blind attempt risks a second dural puncture and delay.","Calling for help is reasonable, but the existing access can be safely used as a spinal catheter.","Ultrasound helps before puncture but does not remove the benefit of using the established intrathecal route.","Remifentanil PCA is less reliable and adds respiratory risk in severe obesity.","CORRECT"],"p":["Clearly label an intrathecal catheter.","Use small, carefully calculated doses.","Communicate with midwifery and obstetric teams.","Leaving it for about 24 hours may reduce PDPH risk."],"m":"Difficult epidural + accidental dural puncture: consider converting to a labelled spinal catheter."},{"q":"You are fast bleeped to the emergency department (ED) where a 22-year-old woman who is 28/40 pregnant has presented with a history of seizures for the past 45 minutes. A wedge has been placed under the right side of the patient and large bore intravenous access has been secured. Her blood pressure is 180/110 mmHg, heart rate 154 beats per minute, respiratory rate 24 breaths per minute and an arterial blood gas sample reveals a pH of 7.2 with an elevated lactate. The obstetric registrar is present and suspects this is an eclamptic fit. 4 g of intravenous magnesium sulphate (MgSO₄) has been given over 5 minutes and anti-hypertensive medication has been started. The patient is still fitting.<br><br><strong>What should the next stages of management be?</strong>","o":["Secure airway with endotracheal tube (ETT) and perform emergency Caesarean section in the ED","Commence MgSO₄ infusion at 1 g/hour, secure airway with ETT and perform emergency Caesarean in the ED","Commence MgSO₄ infusion at 1 g/hour, give a further 2 g MgSO₄ bolus, secure airway with ETT and continue supportive management","Give a further 2 g MgSO₄ bolus and if no response administer phenytoin 15 mg/kg","Commence MgSO₄ infusion at 1 g/hour, give a further 2 g MgSO₄ bolus, secure airway with ETT and perform emergency Caesarean section in the ED"],"a":2,"e":"Persistent eclamptic seizure after the loading dose is treated with a further magnesium bolus and maintenance infusion. Because fitting is prolonged, secure the airway and stabilise the mother before deciding the safest timing and location of delivery.","w":["This omits further magnesium and prioritises delivery before maternal stabilisation.","This omits the repeat magnesium bolus.","CORRECT","Phenytoin is not first-line before completing magnesium therapy and airway control.","Emergency Caesarean section should not be performed in the ED solely because of the seizure."],"p":["Magnesium is first-line for eclamptic seizures.","Loading dose: 4 g IV; recurrent seizure: additional 2 g IV.","Maintenance commonly 1 g/hour.","Maternal resuscitation precedes delivery."],"m":"Persistent eclampsia: repeat MgSO₄, start infusion, secure airway, stabilise first."},{"q":"A 5-day-old boy presents to a local emergency department with a 2-day history of increasing respiratory distress. He is lethargic with a heart rate of 184 beats per minute, a respiratory rate of 68 breaths per minute, a blood pressure of 66/32 mmHg, capillary refill time of 6 seconds, SpO₂ 96% on air on the right hand, but unrecordable from the other limbs. His axillary temperature is 36.1°C, but his extremities are mottled and feel cool to touch. The chest sounds clear and the heart sounds seem normal with weakly palpable femoral pulses. He was given a bolus of 10 mL/kg of 0.9% saline and broad-spectrum intravenous antibiotics. A rapid sequence induction was performed, and the patient intubated and ventilated.<br><br><strong>The most appropriate next step in his management is:</strong>","o":["Start prostaglandin E₂ intravenous infusion and refer to tertiary centre for possible coarctation of the aorta","Arrange for an urgent chest X-ray","Insert a nasogastric tube to decompress the stomach to aid ventilation","Perform arterial blood gas analysis","Keep the infant warm with radiant heater"],"a":0,"e":"Shock at 5 days with differential pre/post-ductal saturations and weak femoral pulses suggests duct-dependent systemic circulation from critical coarctation. A prostaglandin infusion is lifesaving while arranging urgent transfer.","w":["CORRECT","Chest X-ray may support assessment but must not delay ductal reopening.","Gastric decompression is supportive, not definitive.","ABG is useful but should not delay prostaglandin.","Warming is important but does not treat obstructed systemic flow."],"p":["Duct-dependent lesions often present as the duct closes in the first week.","Compare right-hand (pre-ductal) with lower-limb saturations.","Prostaglandin may cause apnoea—prepare for ventilation.","Weak/absent femoral pulses suggest coarctation."],"m":"Collapsed neonate with weak femorals: start prostaglandin immediately."},{"q":"A 20 kg 5-year-old child was brought to the emergency department of a district general hospital with 15% burns from scalding to neck, chest, abdomen and right upper limb having already received 20 mL/kg (400 mL) Hartmann's and 20 μg/kg intravenous (IV) morphine for analgesia. It is 4 hours since the time of injury. On examination, the child appears comfortable, with a heart rate of 110 beats per minute, blood pressure of 124/82 mmHg, a respiratory rate of 22 breaths per minute and SpO₂ of 99% on air.<br><br><strong>The next most appropriate step in the management of this patient for the next 4 hours is:</strong>","o":["IV Hartmann’s at 110 mL/hour. Refer to tertiary centre for further management","IV Hartmann’s at 110 mL/hour. Admit for further observation and management","IV Hartmann’s at 75 mL/hour. Refer to tertiary centre for further management","Intubate and ventilate. IV Hartmann’s at 110 mL/hour. Refer to tertiary centre for further management","Give IV antibiotic prophylaxis. IV Hartmann’s at 110 mL/hour. Admit for further observation and management"],"a":0,"e":"Parkland requirement is 4 × 20 × 15 = 1200 mL in 24 hours; 600 mL is due in the first 8 hours. After the 400 mL already given, 200 mL remains over 4 hours, plus maintenance about 60 mL/hour, giving roughly 110 mL/hour. The burn pattern warrants specialist referral.","w":["CORRECT","The extent and sites of burn require tertiary burns assessment.","75 mL/hour underestimates combined resuscitation and maintenance.","No current clinical evidence mandates intubation.","Routine prophylactic antibiotics are not indicated."],"p":["Parkland: 4 mL × kg × %TBSA.","Give half in the first 8 hours from time of burn.","Children also need maintenance fluid.","Refer paediatric burns involving neck/chest or significant TBSA."],"m":"In children, calculate both burn resuscitation fluid and maintenance."},{"q":"A 57-year-old woman presents with a history of severe facial pain that occurs in sudden episodes of a few minutes and only affect her right cheek. It starts with a sharp ‘electric shock’ which then becomes an ache before it abruptly disappears. Treatment with carbamazepine was commenced at 100 mg b.d. this week, and this has provided only modest relief.<br><br><strong>The most appropriate next step in her treatment is:</strong>","o":["Increase dose of carbamazepine","Microvascular decompression","Add amitriptyline","Add lamotrigine","Cognitive-behavioural therapy"],"a":0,"e":"This is classic trigeminal neuralgia. Carbamazepine is first-line and 100 mg twice daily is a low starting dose, so it should be titrated upward before adding or switching treatment.","w":["CORRECT","Surgery is reserved for drug-resistant or intolerant cases.","Amitriptyline is not first-line for classical trigeminal neuralgia.","Lamotrigine is generally second-line or adjunctive.","CBT may support coping but does not treat the neuralgic attacks."],"p":["Pain is brief, unilateral, electric-shock-like and often triggerable.","Carbamazepine is first-line.","Check FBC, LFTs and sodium during therapy.","Consider imaging in atypical or young patients."],"m":"Trigeminal neuralgia: optimise carbamazepine before escalating to other therapies."},{"q":"You are presented with a 43-year-old woman who had a mastectomy 7 years ago, followed by neoadjuvant radiotherapy and chemotherapy for left sided breast cancer. She is currently taking hormonal therapy and has had pain over the left chest wall for the past 2 years.<br><br><strong>Which of the following is most correct regarding this patient’s chest wall pain?</strong>","o":["Urgent referral for investigation of recurrence is needed","Phantom pain is rare in post-mastectomy patients","Long-term opioids should be commenced","Brachial plexus pathology is the likely cause","The pain will usually respond to anticonvulsants"],"a":4,"e":"Chronic post-mastectomy pain is usually neuropathic, often related to intercostobrachial nerve injury. Neuropathic agents such as anticonvulsants commonly help.","w":["A stable 2-year history is less suggestive of urgent recurrence, though red flags still require assessment.","Phantom breast sensations and pain are recognised after mastectomy.","Long-term opioids are not first-line for neuropathic post-surgical pain.","Brachial plexopathy is possible after radiotherapy but is not the likeliest general explanation.","CORRECT"],"p":["Post-mastectomy pain is a chronic neuropathic pain syndrome.","Intercostobrachial nerve injury is common.","Use gabapentinoids or other neuropathic agents.","Always reassess for recurrence if new red flags appear."],"m":"Chronic post-mastectomy pain is usually neuropathic and often responds to anticonvulsants."},{"q":"A 46-year-old right-handed violinist presents with a 3-month history of worsening severe pain in his right wrist, which commenced suddenly after a long performance in a concert. He has noticed the painful wrist going pale and cold at times, and swelling occasionally. Sometimes it sweats, and it has become stiff and difficult to use. It appears smaller than his left hand, and the nails of his right fingers have become brittle and discoloured. He admits to being very distressed and anxious as he is no longer able to perform. Treatment with paracetamol and amitriptyline has been commenced.<br><br><strong>The most appropriate next step in his management is:</strong>","o":["Pregabalin 75 mg b.d.","Acupuncture","Patient education and psychological support","Application of 5% lignocaine patches","Mirror therapy"],"a":2,"e":"The features suggest complex regional pain syndrome. Early education, reassurance and psychological support are core components of multidisciplinary rehabilitation and improve engagement with physiotherapy.","w":["Pregabalin may be added but does not address the central functional and psychological problem alone.","Evidence for acupuncture is limited.","CORRECT","Lignocaine patches are for localised superficial neuropathic pain and are not the key next step.","Mirror therapy may be useful within rehabilitation but follows education and a coordinated plan."],"p":["CRPS features: pain, vasomotor, sudomotor, motor and trophic change.","Treat early with graded mobilisation and desensitisation.","Avoid immobilisation and fear-driven disuse.","Use multidisciplinary physical and psychological rehabilitation."],"m":"CRPS treatment starts with education and active multidisciplinary rehabilitation."},{"q":"A 30-year-old woman with chronic lower back pain is assessed in an outpatient clinic. She tells you that her pain has improved with exercise and local heat application, but when she thinks about the pain it seems to get worse.<br><br><strong>Regarding this gate theory of pain, which of the following is most accurate?</strong>","o":["It applies mostly to nociceptive pain","It is the basis of how transcutaneous electrical nerve stimulation (TENS) machines work","A supraspinal input is required","Inhibition occurs via Aδ fibres","This theory does not apply to children"],"a":1,"e":"Gate control describes inhibition of nociceptive transmission in the dorsal horn by activity in large-diameter afferents. TENS exploits this mechanism.","w":["The theory explains modulation of pain transmission rather than only nociceptive pain.","CORRECT","Descending supraspinal input can modulate the gate but is not required for the basic mechanism.","Inhibition is mainly via large Aβ fibres, not Aδ fibres.","The mechanism also applies to children."],"p":["Gate is located conceptually in the dorsal horn/substantia gelatinosa.","Aβ input closes the gate to C and Aδ nociceptive signals.","Rubbing an injured area uses the same principle.","Attention and emotion modify pain through descending pathways."],"m":"TENS works by activating large Aβ fibres to inhibit nociceptive transmission."},{"q":"A 73-year-old woman with metastatic breast cancer presents with a 4-month history of severe pain in her back, upper arms and legs. She has been on increasing doses of modified release oral morphine and paracetamol, and while this combination provides her some relief, she is troubled by drowsiness, pruritus, and constipation. At times she feels this is more distressing than her initial pain. Additionally, she is on warfarin for atrial fibrillation.<br><br><strong>The most appropriate next step in her management would be:</strong>","o":["Add diclofenac","Reduce the dose of morphine","Add naloxone","Opioid rotation","Prescribe a laxative"],"a":1,"e":"The first response to multiple troublesome opioid adverse effects is to reduce the opioid dose while maintaining analgesia with appropriate adjuvants. Rotation is considered if problems persist.","w":["Diclofenac adds bleeding and renal risk in a patient taking warfarin.","CORRECT","Naloxone is short-acting and may abruptly reverse analgesia; it is for acute toxicity.","Opioid rotation is a later option if dose reduction and symptom treatment fail.","A laxative treats only constipation, not drowsiness and pruritus."],"p":["Always prescribe bowel prophylaxis with regular opioids.","Distinguish toxicity from uncontrolled pain.","Use adjuvant analgesics to permit opioid reduction.","Consider opioid rotation for persistent intolerable effects."],"m":"Multiple chronic opioid side effects: reduce dose first, then consider rotation."},{"q":"A 35-year-old man has been admitted to the intensive care unit with a 55% total body surface area (BSA) burn. He is intubated and has been resuscitated as per the Parkland formula.<br><br><strong>Which of the following statements is correct?</strong>","o":["Should temperature spike above 38°C, take blood cultures and start broad spectrum antibiotics","Enteral nutrition should be started as soon as possible","Steroids are indicated as there is greater than 40% BSA burns","Fluid resuscitation should be continued according to the Parkland formula even if polyuria develops","If fluid management is optimal generalised oedema is unlikely to develop"],"a":1,"e":"Major burns cause profound hypermetabolism and protein catabolism. Early enteral feeding supports gut integrity, wound healing and survival.","w":["Burn patients may have a high baseline temperature; antibiotics require clinical suspicion/cultures, not fever alone.","CORRECT","Routine steroids are not indicated.","Parkland is only a starting guide and must be titrated to response.","Capillary leak causes oedema even with appropriate resuscitation."],"p":["Start enteral nutrition early.","Titrate fluid to urine output and perfusion, not formula alone.","Avoid prophylactic systemic antibiotics.","Prevent hypothermia with a warm environment and active warming."],"m":"Major burns: early enteral nutrition is essential."},{"q":"A hypertensive 68-year-old man on amlodipine is undergoing an elective abdominal aortic aneurysm repair. At the end of the operation the surgeon is prepared to release the infrarenal aortic cross-clamp.<br><br><strong>Which of the following interventions would mitigate the ensuing hypotension?</strong>","o":["Starting an infusion of noradrenaline at 0.5 μg/kg/min after cross-clamp release","Starting an infusion of dobutamine at 5 μg/kg/min after the cross-clamp release","Rapid infusion of 500 mL of colloid during cross-clamp release","Tilting the table in reverse Trendelenburg position","Optimising the intravascular volume during aortic cross-clamping"],"a":4,"e":"The best prevention is anticipatory: optimise circulating volume before unclamping and ask for gradual release. Interventions started only after release are less effective.","w":["Starting high-dose noradrenaline after release is reactive and may worsen upper-body vasoconstriction.","Dobutamine after release does not correct inadequate preload.","A 500 mL bolus during release may be too little and too late.","Head-up tilt reduces venous return and worsens hypotension.","CORRECT"],"p":["Unclamping reduces SVR and central blood volume.","Acidic, hyperkalaemic metabolites return from ischaemic limbs.","Communicate and release the clamp gradually.","Prepare vasopressors but optimise preload first."],"m":"Prevent unclamping hypotension before it happens: optimise volume during cross-clamping."},{"q":"A 74-year-old man is brought to the emergency department with palpitations. He has a heart rate of 156 beats per minute and atrial fibrillation on his ECG.<br><br><strong>Which one of the following would not warrant immediate direct current cardioversion?</strong>","o":["Blood pressure of 84/30 mmHg","GCS of 12/15","Bi-basal crepitations and tachypnoea","Sweating with cold clammy hands","T wave inversion in lead aVR"],"a":4,"e":"T-wave inversion in aVR is normally expected and is not evidence of instability. The other features indicate shock, impaired consciousness or heart failure.","w":["This is severe hypotension from an unstable tachyarrhythmia.","Reduced GCS suggests cerebral hypoperfusion.","Crepitations and tachypnoea suggest acute pulmonary oedema.","Cold clammy sweating indicates shock.","CORRECT"],"p":["Unstable tachyarrhythmia: shock, syncope, myocardial ischaemia or heart failure.","Use synchronised cardioversion.","Sedate if conscious and time permits.","Do not mistake normal aVR T-wave inversion for ischaemia."],"m":"T-wave inversion in aVR is normal and alone does not mandate cardioversion."},{"q":"A 3-year-old boy suffers from dry and scaly skin, oral thrush, dandruff and dry hair, as well as poor vision in the dark. On examination he has xerosis and Bitot’s spots.<br><br><strong>The most likely deficiency is:</strong>","o":["Vitamin A","Vitamin D","Vitamin C","Vitamin B12","Vitamin K"],"a":0,"e":"Night blindness, conjunctival xerosis and Bitot’s spots are classic manifestations of vitamin A deficiency. Dry skin and recurrent epithelial infections also fit.","w":["CORRECT","Vitamin D deficiency causes rickets/osteomalacia.","Vitamin C deficiency causes scurvy with bleeding and poor wound healing.","Vitamin B12 deficiency causes megaloblastic anaemia and neurological dysfunction.","Vitamin K deficiency causes impaired coagulation and bleeding."],"p":["Vitamin A maintains vision and epithelial integrity.","Early eye symptom: night blindness.","Bitot’s spots are foamy conjunctival plaques.","Severe deficiency may progress to corneal ulceration and blindness."],"m":"Night blindness + Bitot’s spots = vitamin A deficiency."}],"2":[{"q":"5 days ago a 25-year-old woman suffered a traumatic brain injury. Despite a normal CT, she demonstrated bilateral motor posturing. She therefore had an intracranial pressure (ICP) bolt inserted shortly after admission in order to monitor her ICP. You begin your morning review by analysing her ICP waveform.<br><br><strong>Which of the following would concern you most acutely?</strong>","o":["Lundberg A waves","A flat trace","A baseline value of 20 mmHg","Lundberg B waves","The most prominent upstroke being the P2 (tidal) wave"],"a":0,"e":"Lundberg A (plateau) waves are abrupt, sustained rises in ICP and indicate critically reduced intracranial compliance with risk of cerebral ischaemia. They demand urgent assessment and treatment.","w":["CORRECT","A flat trace may reflect equipment failure and requires checking, but it is not itself a physiological ICP crisis.","An ICP of 20 mmHg is abnormal/borderline and needs attention, but is less immediately dangerous than an A wave.","B waves are shorter oscillations and may indicate impaired compliance, but are less acute than A waves.","A prominent P2 suggests reduced compliance, but not the same immediate danger as plateau waves."],"p":["Lundberg A waves: large sustained ICP elevations.","P2 greater than P1 suggests reduced compliance.","Always check the transducer/system if the trace is flat.","Treat sustained raised ICP promptly to preserve cerebral perfusion."],"m":"Lundberg A waves are the most acutely dangerous ICP waveform."},{"q":"You are called to the emergency department to assist with a 20-year-old man who presented following a grand-mal seizure. He has begun fitting again and his conscious level has remained below baseline for 30 minutes. He has a history of epilepsy and has not been taking his usual medication since his prescription ran out 1 week ago. He is otherwise well.<br><br><strong>Which of the following is the most appropriate immediate action?</strong>","o":["Intubate the patient to protect his airway and optimise ventilation","Check his blood glucose and treat any hypoglycaemia with intravenous dextrose","Take blood for full blood count, electrolytes, urea, creatinine, liver function tests and anti-epileptic medication levels","Administer his anti-epileptic medication intravenously","Apply pulse oximetry, blood pressure and ECG monitoring"],"a":4,"e":"The immediate first step is basic resuscitation and monitoring. Apply pulse oximetry, blood pressure and ECG monitoring while assessing airway, breathing, circulation and reversible causes.","w":["Intubation is reserved for failure to maintain the airway, severe hypoxia or refractory status.","Glucose must be checked rapidly, but first establish basic monitoring and ABC assessment.","Blood tests are important but follow immediate stabilisation.","Simply replacing his usual antiepileptic is not the first emergency step in an actively fitting patient.","CORRECT"],"p":["Status epilepticus is a medical emergency.","Start with ABC, oxygen, monitoring and IV access.","Check capillary glucose early.","Treat ongoing seizures promptly with guideline-based benzodiazepines."],"m":"Active seizure: stabilise and monitor first, then treat the seizure and reversible causes."},{"q":"You are asked to pre-assess a 68-year-old man for elective open umbilical hernia repair. He suffers from exertional angina (three flights of stairs) and had coronary angiography 6 months ago, which showed right coronary and circumflex artery disease. He had a myocardial infarction 2 years ago. His symptoms have been stable over the past year and he is currently taking bisoprolol 2.5 mg once a day (o.d.), aspirin 75 mg o.d. and ramipril 2.5 mg o.d. His creatinine is 120 μmol/L. He is not diabetic and has not had a stroke. He is independent and performs all his own housework.<br><br><strong>Which of the following is the most appropriate next step in this patient’s management?</strong>","o":["Schedule the patient for surgery. Cease the ramipril 24 hours preoperatively. Continue the aspirin","Schedule the patient for surgery. Cease the bisoprolol 2 days preoperatively.","Obtain non-invasive stress testing","Refer for repeat coronary angiogram","Refer for coronary artery bypass surgery"],"a":0,"e":"He has stable symptoms, acceptable functional capacity and recent coronary assessment. Proceed with surgery, continue established beta-blocker and aspirin, and omit the ACE inhibitor before surgery to reduce perioperative hypotension.","w":["CORRECT","Abrupt beta-blocker withdrawal may cause rebound tachycardia and ischaemia.","Further stress testing is unlikely to change management in a stable, functional patient.","Recent angiography already defines his coronary disease; repeat angiography is unnecessary.","CABG is not indicated solely to make non-cardiac surgery safer in stable disease."],"p":["Continue chronic beta-blockers perioperatively.","ACE inhibitors are commonly withheld before surgery because of hypotension risk.","Stable coronary disease does not automatically require more testing.","Only investigate if the result will change management."],"m":"Stable IHD with good function: proceed; continue beta-blocker and aspirin, withhold ramipril."},{"q":"A healthy 30-year-old man due for an appendicectomy is undergoing a rapid sequence induction. After full pre-oxygenation and administration of thiopentone and suxamethonium, three attempts at intubation have failed with an unexpected grade III Cormack & Lehane laryngoscopy view. His oxygen saturations are 92% and full cricoid pressure is being applied.<br><br><strong>What action is most appropriate in this situation?</strong>","o":["Reattempt intubation using a different laryngoscope","Reattempt intubation whilst reducing the cricoid pressure","Attempt insertion of a supraglottic airway device","Postpone surgery and awaken the patient","Attempt cannula cricothyroidotomy"],"a":3,"e":"After repeated failed intubation during an RSI, oxygenation and patient safety take priority. If ventilation can be maintained, abandon the procedure and wake the patient rather than continue traumatic attempts.","w":["Further repeated laryngoscopy increases trauma and delays recovery of oxygenation.","Reducing cricoid pressure may improve the view, but after three failed attempts the safest plan is to stop.","A supraglottic airway may be used as a rescue to oxygenate, but the definitive plan is to wake the patient if possible.","CORRECT","Front-of-neck access is for cannot-intubate, cannot-oxygenate—not when waking remains feasible."],"p":["Limit intubation attempts.","Prioritise oxygenation over intubation.","Release cricoid pressure if it impairs ventilation or laryngoscopy.","Failed RSI with adequate oxygenation: wake the patient."],"m":"After failed intubation in RSI, wake the patient unless surgery is immediately life-saving."},{"q":"An 80-year-old woman, admitted with pneumonia 14 days ago, suffers an episode of large haematemesis requiring endoscopic investigation. You anaesthetise her and secure her airway uneventfully with a size 7.5 endotracheal tube (ETT) secured at 24 cm to the teeth. Oxygen saturations are 99% (FiO₂ 0.4). The gastroenterologist then extends her head. At this point she becomes progressively hypoxic and chest wall movement becomes limited to the right side.<br><br><strong>What is the most likely reason for her desaturation?</strong>","o":["Aspiration of gastric contents","Bronchospasm","Sputum plugging of a bronchus","Pneumothorax","Endobronchial intubation"],"a":4,"e":"The tube was already relatively deep at 24 cm. Head and neck movement can alter ETT position; migration into a main bronchus produces unilateral ventilation and progressive hypoxaemia.","w":["Aspiration usually causes diffuse respiratory compromise rather than immediate unilateral movement after head positioning.","Bronchospasm causes bilateral wheeze and increased airway pressures.","A mucus plug is possible but the temporal relation to head movement strongly favours tube migration.","Pneumothorax is possible but is less directly linked to head extension.","CORRECT"],"p":["Always reassess tube position after head/neck movement.","Unilateral chest movement suggests endobronchial intubation or pneumothorax.","Check depth, auscultation and capnography.","Withdraw the tube cautiously if endobronchial placement is suspected."],"m":"Sudden unilateral ventilation after head movement = check for endobronchial intubation."},{"q":"A 56-year-old man is taken to the intensive care unit following a laparotomy a week ago for bowel obstruction. He is hypertensive, has a body mass index (BMI) of 42, and has had an ileus for the last 7 days. His abdomen is tender and tensely distended. There are no signs of sepsis, but he has worsening renal function and a poor urine output, despite a very positive fluid balance. He had become increasingly breathless with type II respiratory failure, and after a failed trial of non-invasive ventilation, is now mechanically ventilated. His ventilator pressures are worsening and his base excess and lactate are increasing.<br><br><strong>Which of the following is the most correct regarding this patient?</strong>","o":["A measurement of intra-abdominal pressure is most safely performed with an intraperitoneal catheter and pressure transducer","An intravesical measurement is performed at the end of inspiration","Abdominal compartment syndrome may provoke a cardiac arrest at laparotomy","An abdominal pressure of 24 mmHg can be considered normal","The only effective treatment is re-laparotomy leaving the abdomen open with a Bogota bag"],"a":2,"e":"Severe abdominal compartment syndrome can markedly reduce venous return. Sudden decompression at laparotomy may cause profound haemodynamic collapse and even cardiac arrest.","w":["Bladder pressure measurement is the standard safer indirect technique.","Intravesical pressure is measured at end-expiration with the patient supine.","CORRECT","Normal IAP is roughly 5–7 mmHg; 24 mmHg is severe hypertension.","Management includes medical measures and decompression; a Bogota bag is not the only option."],"p":["ACS = IAP above 20 mmHg plus new organ dysfunction.","Measure bladder pressure at end-expiration.","Abdominal perfusion pressure = MAP − IAP.","Decompression can cause sudden cardiovascular collapse."],"m":"ACS is IAP >20 mmHg with new organ dysfunction."},{"q":"A 60-year-old man awaiting surgical resection for his tracheal carcinoma presents to the emergency department with worsening dyspnoea. As part of his pulmonary function tests, a bedside flow-volume loop (spirogram) is ordered.<br><br><strong>What will be the most likely appearance of his flow-volume loop?</strong>","o":["Flattening of the inspiratory limb only","Flattening of the expiratory limb only","Flattening of both the inspiratory and expiratory limbs","Saw-tooth pattern in both the inspiratory and expiratory limbs","Normal appearance of both inspiratory and expiratory limbs"],"a":2,"e":"A fixed large-airway obstruction, such as a tracheal tumour, limits flow during both inspiration and expiration, producing flattening of both limbs.","w":["Inspiratory flattening alone suggests a variable extrathoracic obstruction.","Expiratory flattening alone suggests a variable intrathoracic obstruction.","CORRECT","A saw-tooth pattern is associated with upper-airway flutter, for example obstructive sleep apnoea.","A symptomatic fixed tracheal lesion should not produce a normal loop."],"p":["Fixed obstruction: both limbs flattened.","Variable extrathoracic obstruction: inspiratory flattening.","Variable intrathoracic obstruction: expiratory flattening.","Flow-volume loops help localise upper-airway obstruction."],"m":"Tracheal tumour = fixed obstruction = flattening of inspiration and expiration."},{"q":"A 32-year-old woman was recently diagnosed with brainstem death following a subarachnoid haemorrhage. She was initially hypertensive, then developed polyuria and gradually became hypotensive. The patient has received 30 mL/kg of crystalloid boluses.<br><br><strong>What is the next pharmacological intervention needed to restore the patient's blood pressure?</strong>","o":["Dopamine","Adrenaline","Vasopressin","Noradrenaline","Further bolus of colloid"],"a":2,"e":"Brainstem death commonly causes diabetes insipidus from loss of ADH, producing polyuria, hypovolaemia and hypotension. Vasopressin treats both the vasodilatory hypotension and the hormone deficiency.","w":["Dopamine does not correct the underlying ADH deficiency.","Adrenaline is not the preferred first targeted agent here.","CORRECT","Noradrenaline may support pressure but does not treat diabetes insipidus.","She has already received substantial fluid; further fluid alone will not correct ongoing DI."],"p":["Look for diabetes insipidus after brain death.","Features: polyuria, hypernatraemia and hypotension.","Vasopressin reduces urine output and supports vascular tone.","Optimise donor physiology to preserve organs."],"m":"Brain-dead donor + polyuria + hypotension: think DI and give vasopressin."},{"q":"You have been asked to see a 32-year-old patient in recovery following a retrograde intramedullary femoral nailing. He works as a builder and fell from a ladder sustaining bilateral femoral fractures. The plan is to fix the other leg in the next few days. He is desaturating to 88% on oxygen via facemask and is confused, and one of the recovery staff has also noticed a petechial rash on the patient’s neck.<br><br><strong>In diagnosis and treatment of the likely condition, which of the following tests is most important?</strong>","o":["Arterial blood gas analysis","Bronchoscopic alveolar lavage (BAL) for macrophages","Trial of methylprednisolone for 48 hours","A CT of the chest","Urine microscopy for lipid droplets"],"a":0,"e":"The triad of respiratory compromise, neurological change and petechiae suggests fat embolism syndrome. ABG is the most important immediate test to quantify hypoxaemia and guide respiratory support.","w":["CORRECT","Fat-laden macrophages are non-specific and BAL is invasive.","A steroid trial is treatment, not a diagnostic test, and evidence is limited.","CT may be non-specific and should not delay stabilisation.","Urinary fat droplets are non-specific."],"p":["Fat embolism syndrome usually appears 24–72 hours after long-bone trauma.","Classic triad: hypoxaemia, neurological signs and petechiae.","Diagnosis is clinical; ABG assesses severity.","Treatment is mainly supportive."],"m":"Long-bone fracture + hypoxia + confusion + petechiae = fat embolism syndrome."},{"q":"A 50-year old woman for elective hand surgery is to have an ultrasound guided axillary brachial plexus block.<br><br><strong>Which of the following would be the most appropriate ultrasound probe to use?</strong>","o":["Curved array probe","Linear array probe","Low frequency (2–5 MHz) probe","Phased array probe","Hockey stick footprint probe"],"a":1,"e":"The axillary plexus is superficial. A high-frequency linear probe provides excellent near-field resolution and a broad view of the artery and surrounding nerves.","w":["Curved probes are used for deeper structures and provide lower near-field resolution.","CORRECT","Low-frequency probes penetrate deeply but give poorer resolution for superficial nerves.","Phased-array probes are mainly used for cardiac imaging.","A hockey-stick probe may help in very small spaces, but a standard linear probe is most appropriate."],"p":["High frequency = better resolution, less penetration.","Use a linear probe for superficial peripheral nerve blocks.","Axillary nerves lie around the axillary artery.","Identify and avoid vascular puncture."],"m":"Superficial block: use a high-frequency linear ultrasound probe."},{"q":"A 38-year-old man has sustained a stab wound in the left flank following an altercation. In the emergency department he is awake and has saturations of 99% on room air, a respiratory rate of 25 breaths per minute, a heart rate of 110 beats per minute and a blood pressure of 85/40 mmHg. Initial resuscitation has started with intravenous access and blood samples taken. Any other injuries have been excluded apart from a dry puncture wound to the left flank associated with mild abdominal tenderness and no peritonism.<br><br><strong>What is the next step in the ongoing resuscitation of this patient?</strong>","o":["A fluid bolus of 10 ml/kg of colloid","A fluid bolus of 10 ml/kg of crystalloid","No fluid bolus","Insert an arterial line","Admit the patient to the emergency department observation ward"],"a":2,"e":"In penetrating trauma with suspected ongoing haemorrhage, permissive hypotension is appropriate while arranging definitive haemorrhage control, provided there is no traumatic brain injury. Routine fluid boluses may dislodge clot and worsen bleeding.","w":["Colloid may increase pressure and dilution without controlling bleeding.","Crystalloid may worsen dilutional coagulopathy and disrupt haemostasis.","CORRECT","An arterial line may be useful later but must not delay definitive assessment and haemorrhage control.","He is hypotensive and requires urgent surgical evaluation, not observation."],"p":["Use permissive hypotension in uncontrolled bleeding without TBI.","Prioritise blood products over large crystalloid volumes when resuscitation is needed.","Control haemorrhage definitively.","Do not normalise BP before bleeding is controlled."],"m":"Penetrating haemorrhage without TBI: avoid unnecessary fluid boluses; use permissive hypotension."},{"q":"A 55-year-old woman with a 1-month history of headaches presents with a severe headache followed by a collapse. In the emergency department of a large teaching hospital her Glasgow coma scale (GCS) was 3 and she was intubated and ventilated appropriately. A CT scan demonstrated a large subarachnoid haemorrhage (SAH) with blood in the intraventricular system and dilated lateral ventricles. A CT angiogram demonstrated a large posterior communicating artery aneurysm. Her pupillary response to light is sluggish.<br><br><strong>The most beneficial intervention in this patient would be:</strong>","o":["Immediate transfer to neurosurgical theatre for an extraventricular drain (EVD)","Immediate transfer to neurosurgical theatre for insertion of an intracranial bolt monitor","Immediate transfer to the intensive care unit for medical stabilisation before embolisation of the aneurysm","Administration of hypertonic saline and mannitol","Administration of intravenous phenytoin"],"a":0,"e":"She has acute obstructive hydrocephalus with profound coma and sluggish pupils. Urgent CSF diversion with an external ventricular drain is the intervention most likely to reverse the immediate neurological deterioration.","w":["CORRECT","An ICP bolt monitors pressure but does not drain CSF or treat hydrocephalus.","ICU stabilisation alone does not relieve the obstructive hydrocephalus.","Osmotherapy may transiently reduce ICP but does not correct ventricular obstruction.","Routine phenytoin does not address the cause of her deterioration."],"p":["Intraventricular blood can cause acute hydrocephalus.","EVD both monitors ICP and drains CSF.","Treat the immediately reversible cause before definitive aneurysm treatment.","Avoid hypotension and hypoxia."],"m":"SAH + hydrocephalus + coma = urgent external ventricular drainage."},{"q":"A 52-year-old man is admitted to the emergency department one hour ago with worsening shortness of breath, fevers and productive sputum. His observations include a temperature of 38°C, SpO₂ 95% on high-flow oxygen, blood pressure 88/49 mmHg, heart rate 126 beats per minute and respiratory rate 28 breaths per minute.<br><br>\n<div class=\"mini-table\">\n<div><b>Parameter</b><b>Result</b></div>\n<div><span>FiO₂</span><span>0.4</span></div><div><span>pH</span><span>7.21</span></div>\n<div><span>PaCO₂</span><span>4.8 kPa</span></div><div><span>PaO₂</span><span>11.4 kPa</span></div>\n<div><span>Base excess</span><span>−5.6 mmol/L</span></div><div><span>HCO₃⁻</span><span>20.6 mmol/L</span></div>\n<div><span>K⁺</span><span>4.8 mmol/L</span></div><div><span>Na⁺</span><span>138 mmol/L</span></div>\n<div><span>Lactate</span><span>4.6 mmol/L</span></div></div><br>\nBlood cultures have been taken and a dose of co-amoxiclav and clarithromycin has been administered.<br><br><strong>The most appropriate next step would be:</strong>","o":["Intubation and ventilation","Central venous access and noradrenaline","Central venous access and measurement of ScvO₂","Non-invasive ventilation","30 mL/kg crystalloid bolus"],"a":4,"e":"He has septic shock physiology with hypotension and raised lactate. After antibiotics, the next immediate step is rapid crystalloid resuscitation, with reassessment before vasopressors.","w":["He is oxygenating and has no clear immediate indication for intubation before circulation is addressed.","Noradrenaline is added if hypotension persists after adequate fluid resuscitation.","ScvO₂ measurement is not the first priority.","NIV does not treat septic circulatory failure.","CORRECT"],"p":["Give early antibiotics and cultures.","Initial sepsis fluid bolus: about 30 mL/kg crystalloid.","Reassess frequently for responsiveness and overload.","Start noradrenaline if hypotension persists."],"m":"Sepsis with hypotension and lactate elevation: give 30 mL/kg crystalloid first."},{"q":"An 18-year-old woman presents to the intensive care unit with diabetic ketoacidosis (DKA) for which she has had multiple admissions in the past. On examination her heart rate is 110 beats per minute and her blood pressure is 100/60 mmHg. Her Glasgow coma scale (GCS) is 14 (E3, V5, M6). Her laboratory glucose was 39 mmol/L and the arterial blood gas demonstrated the following:<br><br>\n<div class=\"mini-table\">\n<div><b>Parameter</b><b>Result</b></div><div><span>pH</span><span>6.9</span></div>\n<div><span>PaO₂</span><span>14.1 kPa</span></div><div><span>PaCO₂</span><span>2.1 kPa</span></div>\n<div><span>HCO₃⁻</span><span>3.4 mmol/L</span></div><div><span>Lactate</span><span>2.2 mmol/L</span></div>\n<div><span>K⁺</span><span>4.6 mmol/L</span></div></div><br>\nCurrent treatment is an insulin infusion of 5 units/hour and 500 mL of intravenous Hartmann’s solution being administered over 4 hours.<br><br><strong>How would you alter her treatment on admission to the ICU?</strong>","o":["Reduce the rate of insulin when her blood sugar drops below 30 mmol/L","Increase the insulin infusion by 1 unit/hr if the bicarbonate concentration remains 3 mmol/L after 1 hour","Change the intravenous fluid from Hartmann’s solution to 0.9% sodium chloride and add potassium 20 mmol to be given over 4 hours","Give a fluid bolus of 500 mL of crystalloid to assess cardiovascular and metabolic response","Start an infusion of bicarbonate 1.26% 100 mL/hour to correct the acidosis until the blood ketone level reduces as a result of insulin therapy"],"a":1,"e":"DKA treatment aims to suppress ketogenesis, not simply lower glucose. If bicarbonate and ketones are not improving adequately, increase the fixed-rate insulin infusion while continuing careful fluid and potassium management.","w":["Do not reduce insulin solely because glucose falls; add dextrose when needed so insulin can continue.","CORRECT","Hartmann’s is acceptable; potassium replacement depends on serial potassium measurements.","She is not described as shocked, and indiscriminate bolus fluid may be harmful.","Bicarbonate is not routinely recommended even in severe DKA unless exceptional indications exist."],"p":["Fixed-rate insulin is usually 0.1 units/kg/hour.","Target ketone fall ≥0.5 mmol/L/hour or bicarbonate rise ≥3 mmol/L/hour.","Add dextrose when glucose falls while continuing insulin.","Monitor potassium closely."],"m":"DKA resolution is judged by ketones and bicarbonate—not glucose alone."},{"q":"A 76-year-old patient is admitted to the postoperative care unit (POCU) following a prolonged and difficult laparotomy for ischaemic bowel. She underwent an extended right hemicolectomy, associated bowel oedema was noted. Her intra-abdominal pressure (IAP) is monitored due to her risk of abdominal compartment syndrome (ACS).<br><br><strong>Which of the following would define abdominal compartment syndrome in this patient:</strong>","o":["IAP > 12 mmHg with new organ dysfunction","IAP > 16 mmHg with new organ dysfunction","IAP > 20 mmHg with new organ dysfunction","IAP > 25 mmHg with new organ dysfunction","IAP > 30 mmHg with new organ dysfunction"],"a":2,"e":"Abdominal compartment syndrome is defined as a sustained IAP above 20 mmHg associated with new organ dysfunction or failure.","w":["This defines intra-abdominal hypertension, not ACS.","This remains below the diagnostic ACS threshold.","CORRECT","ACS may be present before 25 mmHg.","Waiting until 30 mmHg delays diagnosis."],"p":["Normal IAP in critical illness is about 5–7 mmHg.","IAH begins at IAP ≥12 mmHg.","ACS = sustained IAP >20 mmHg plus organ dysfunction.","Use bladder pressure for standard measurement."],"m":"ACS = IAP >20 mmHg with new organ dysfunction."},{"q":"A 24-year-old asthmatic presents to the emergency department with wheeze, shortness of breath and a peak flow which is 20% of his usual. He has had two courses of steroids in the past year and has been hospitalised twice for acute asthma. The medical team has asked you to review him as they are worried he is tiring and not responding to initial treatment.<br><br><strong>Which feature is most likely to suggest that this is the case?</strong>","o":["pH of 7.32","Oxygen saturations of 88% on air","Unable to complete sentences with single breath","Responding to voice on the AVPU score","No improvement despite optimum therapy including a salbutamol infusion"],"a":3,"e":"A reduced conscious level—responding only to voice—is a life-threatening sign suggesting exhaustion, hypoxaemia or hypercapnia and impending respiratory arrest.","w":["Mild acidaemia is concerning but less direct than altered consciousness.","Hypoxaemia indicates severe asthma but does not specifically prove exhaustion.","Inability to complete sentences indicates severe asthma but may occur before fatigue.","CORRECT","Failure of therapy is concerning, but altered consciousness is the clearest sign of immediate deterioration."],"p":["Peak flow 20% of usual = life-threatening severity.","Normal or rising PaCO₂ in severe asthma is ominous.","Altered consciousness indicates impending arrest.","Call for senior airway/ICU help early."],"m":"Asthma with reduced consciousness = impending respiratory failure."},{"q":"A 37-year-old woman with a past history of asthma is 38/40 pregnant and undergoing a category 2 Caesarean section for pre-eclampsia. The baby and placenta have been delivered, 5 IU of syntocinon has been given and a syntocinon infusion commenced. The estimated blood loss so far is 800 ml and the obstetric registrar informs you “the uterus is still floppy”.<br><br><strong>Which of the following is the best drug to use next?</strong>","o":["5 IU syntocinon intravenously","5/500 syntometrine intravenously","250 μg carboprost intramuscularly","1 mg misoprostol rectally","Atosiban 6.75 mg intravenously"],"a":0,"e":"The book answer is a further 5 IU dose of syntocinon. Ergometrine is undesirable in pre-eclampsia, carboprost can cause bronchospasm in asthma, and atosiban is a uterine relaxant.","w":["CORRECT","Syntometrine contains ergometrine, which is contraindicated in hypertension/pre-eclampsia.","Carboprost may precipitate severe bronchospasm in asthma.","Misoprostol is an alternative uterotonic but is not the preferred next option here.","Atosiban is a tocolytic and would worsen uterine atony."],"p":["Oxytocin is first-line for uterine atony.","Avoid ergometrine in pre-eclampsia/hypertension.","Avoid carboprost in asthma.","Misoprostol can be used when other uterotonics are unsuitable."],"m":"PPH with asthma and pre-eclampsia: avoid carboprost and ergometrine."},{"q":"A 6-year-old, 24 kg boy is seen in the emergency department having fallen on his right arm. An X-ray confirmed a closed displaced fracture of the right distal radius. There is no neurovascular compromise to the right hand. He was given 2.4 mg of oral morphine for pain. The surgeon wants to perform an urgent manipulation under anaesthesia with percutaneous wiring. The boy last ate 9 hours ago and the fall occurred 7 hours ago.<br><br><strong>The immediate anaesthetic management should be:</strong>","o":["Proceed immediately with surgery with routine induction of general anaesthesia","Proceed immediately with surgery under general anaesthesia following a rapid sequence induction and intubation","Delay general anaesthesia and surgery by a further 4 hours, and then perform a rapid sequence induction and intubation","Delay general anaesthesia and surgery by further 12 hours, and then proceed as an elective case","Proceed with surgery under an axillary brachial plexus block"],"a":1,"e":"Trauma and opioid analgesia may delay gastric emptying despite the elapsed fasting time. Because surgery is urgent, proceed with a rapid sequence induction and tracheal intubation.","w":["Routine induction does not adequately address aspiration risk in this trauma patient.","CORRECT","A further arbitrary delay does not reliably normalise gastric emptying and unnecessarily postpones treatment.","A 12-hour delay is not justified for an urgent displaced fracture.","An awake regional technique is unsuitable as the sole plan for this child and procedure."],"p":["Fasting time alone does not guarantee an empty stomach after trauma.","Pain and opioids delay gastric emptying.","Urgent surgery with aspiration risk: RSI and intubation.","Balance urgency against aspiration risk."],"m":"Trauma + opioids may mean a full stomach even after standard fasting."},{"q":"A 9-year-old 30 kg girl has woken up in the anaesthetic recovery area after an emergency open appendicectomy. She is in distress and complaining of pain over the surgical site. Intraoperatively she was given 50 μg of fentanyl, 450 mg of paracetamol, and 15 mg of ketorolac all intravenously. A right-sided transverse abdominal plane block was performed using 20 mL of 0.25% bupivacaine. Her most recent set of clinical observations are: heart rate 128 beats per
