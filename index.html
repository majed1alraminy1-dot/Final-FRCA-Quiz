am believes the patient has suffered irreversible traumatic brain injury.<br><br><strong>What would be the next step in assessing the suitability of the patient to be an organ donor?</strong>","o":["Apnoea testing","CT scan of brain to confirm brainstem herniation","Brainstem testing","Cerebral circulation angiogram","Sensory and motor evoked potentials measurement"],"a":2,"e":"The next step is formal brainstem testing, including cranial nerve examination followed by apnoea testing, to confirm death by neurological criteria.","w":["Apnoea testing is performed after the cranial nerve component.","Imaging is not required when the cause is known and irreversible.","CORRECT","Angiography is reserved for exceptional uncertainty.","Evoked potentials are not used to confirm brainstem death."],"p":["Confirm a known irreversible cause.","Exclude sedation, hypothermia and metabolic disturbance.","Perform cranial nerve testing before apnoea testing.","Two complete examinations are required."],"m":"Potential neurological donor: perform formal brainstem testing next."},{"q":"A 66-year-old man with a history of stable angina on exertion presents for revision of a left total hip replacement, his medications include a statin and low-dose aspirin. The primary joint has been cemented, and the surgeon is concerned that the procedure may be ‘difficult’. The patient had haemoglobin of 110 g/L at his pre-assessment visit. You find a note from the pre-assessment nurse telling you that the patient is also a Jehovah’s Witness.<br><br><strong>The best blood conservation strategy, which is also likely to be acceptable to the patient would involve:</strong>","o":["Autologous pre-donation for one month with oral iron supplementation and recombinant erythropoietin (EPO). Rescue therapy for severe bleeding with recombinant factor VII","Autologous pre-donation for one month with intravenous iron supplementation. Rescue therapy for bleeding with recombinant factor VII","Preoperative iron supplementation and EPO. Acute hypervolaemic haemodilution during the procedure. Rescue therapy for bleeding with recombinant factor VII","Preoperative iron supplementation and erythropoietin (EPO). Acute hypervolaemic haemodilution during the procedure. Rescue therapy for bleeding with fresh frozen plasma and fibrinogen concentrate","Preoperative iron supplementation and EPO. Acute normovolaemic haemodilution, during the procedure. Rescue therapy for bleeding with recombinant factor VII and platelets"],"a":2,"e":"Preoperative iron and EPO improve red-cell mass. Acute hypervolaemic haemodilution avoids removal and storage of blood, and recombinant factor VII is often acceptable.","w":["Predonation involves blood storage and is usually unacceptable.","Predonation remains the problem despite IV iron.","CORRECT","FFP and fibrinogen are blood-derived fractions that may be unacceptable.","Normovolaemic haemodilution removes and stores blood; platelets are usually refused."],"p":["Jehovah’s Witness acceptance is individual—ask explicitly.","Optimise Hb with iron, folate, B12 and EPO.","Continuous-circuit cell salvage is often acceptable.","Recombinant products are commonly acceptable."],"m":"The most acceptable strategy avoids stored blood and uses iron/EPO plus non-blood recombinant haemostatic therapy."},{"q":"A 45-year-old patient requires abdominal surgery to be supplemented by a regional anaesthetic block.<br><br><strong>In which one of the following operations is a unilateral transversus abdominis plane (TAP) block most reliably able to provide perioperative analgesia?</strong>","o":["Laparoscopic inguinal hernia repair","Open appendicectomy","Paraumbilical hernia repair","Open cholecystectomy","Laparoscopic appendicectomy"],"a":1,"e":"A unilateral posterior TAP block reliably covers unilateral infraumbilical somatic pain, making open appendicectomy the best option.","w":["Laparoscopic surgery usually needs bilateral coverage because of multiple ports.","CORRECT","Paraumbilical surgery may require bilateral or subcostal coverage.","Open cholecystectomy needs a subcostal TAP block.","Laparoscopic appendicectomy usually requires bilateral blocks."],"p":["TAP block covers abdominal-wall pain, not visceral pain.","Posterior TAP generally covers T10–L1.","Use unilateral block for unilateral infraumbilical incisions.","Use bilateral blocks for midline or laparoscopic surgery."],"m":"A unilateral TAP block is most reliable for open appendicectomy."},{"q":"A 70-year-old man was admitted to your neurosurgical unit following a fall down flights of stairs. He sustained bilateral subdural haematomas and a C7 fracture. You are called to secure his airway as his GCS is 9 and he is agitated and confused.<br><br><strong>What is the most appropriate method of applying cricoid pressure for the rapid sequence intubation?</strong>","o":["Remove the collar completely and apply single handed cricoid pressure","Double handed cricoid pressure application without the collar","Keep the collar on and apply single handed cricoid pressure","Do not use cricoid pressure as it worsens laryngoscopy","Awake fiberoptic intubation without cricoid pressure"],"a":1,"e":"With the collar removed and manual in-line stabilisation applied, bimanual cricoid pressure offers better cervical stability and laryngoscopic conditions.","w":["Single-handed pressure with the collar fully removed may destabilise the neck.","CORRECT","The collar restricts mouth opening and impairs laryngoscopy.","Cricoid pressure may be released if it worsens the view, but the question asks how to apply it.","Awake fibreoptic intubation is unsuitable in an agitated patient with reduced GCS."],"p":["Remove the anterior collar for intubation.","Use manual in-line stabilisation.","Apply bimanual cricoid pressure if using it.","Release cricoid pressure early if it impairs ventilation or laryngoscopy."],"m":"Cervical injury RSI: collar off, MILS on, and bimanual cricoid pressure."},{"q":"A 55-year-old man is admitted to your intensive care unit following an emergency laparotomy for faecal peritonitis secondary to a perforated sigmoid diverticulum. He is paralysed and sedated, intubated and ventilated. His haemodynamic observations are as follows: heart rate 90 beats per minute sinus rhythm; mean arterial pressure (MAP) 62 mmHg on 0.36 μg/kg/min of noradrenaline; stroke volume index (SVI) is 19 mL/m²/beat before, and 20 mL/m²/beat after a 250 mL bolus of Hartmann’s solution given over 150 seconds; haemoglobin concentration is 84 g/L; arterial blood lactate is 4.8 mmol/L; central venous oxygen saturation is 56%; central venous to arterial carbon dioxide difference is 1.4 kPa; highly sensitive cardiac troponin T levels are 150 times the upper reference limit.<br><br><strong>Given this information the best treatment strategy is:</strong>","o":["Increase the rate of the noradrenaline infusion to achieve a MAP of 75–85 mmHg","Give a 50 mg bolus of hydrocortisone and repeat 6-hourly","Give two units of packed red blood cells","Request an urgent cardiology review as the patient needs an emergency coronary angiogram and the insertion of an intra-aortic balloon pump","Commence a titrated dobutamine infusion starting at 5 μg/kg/min"],"a":4,"e":"He is fluid unresponsive with low SVI, low ScvO₂ and a high CO₂ gap, indicating impaired cardiac output from septic cardiomyopathy or ischaemia. A titrated inotrope is appropriate.","w":["A higher MAP may increase afterload and worsen myocardial performance.","Hydrocortisone may be considered later for refractory shock.","Hb 84 g/L does not justify transfusion in a euvolaemic patient.","The troponin rise does not prove a type-1 MI requiring urgent PCI.","CORRECT"],"p":["A <10% SVI rise after a rapid bolus indicates fluid unresponsiveness.","Low ScvO₂ and high venoarterial CO₂ gap suggest inadequate flow.","Use dobutamine for low-output septic shock.","Troponin may rise in sepsis without coronary occlusion."],"m":"Fluid-unresponsive septic shock with low cardiac output: start dobutamine."},{"q":"A 69-year-old woman with an established history of essential hypertension, type 2 diabetes mellitus and chronic renal impairment, underwent elective, on-pump coronary artery bypass grafts yesterday. She is extubated and not on vasoactive drugs. Her fluid balance is +2430 mL since arrival in the intensive care unit. Her urine output has been averaging 18 mL/hour. Bicarbonate has fallen from 20 to 14 mmol/L, potassium risen from 5.6 to 6.4 mmol/L, urea from 7.6 to 17.6 mmol/L and creatinine from 110 to 182 μmol/L.<br><br><strong>On the basis of this information, the best renal treatment strategy is:</strong>","o":["Commence a dopamine infusion at 2.5 mg/kg/hour","Give 15 units of short acting insulin in 50 mL of 50% dextrose in 15 minutes","Give 500 mL of 1.23% sodium bicarbonate over 1 hour","Give 20 mg of furosemide intravenously followed immediately by an infusion at 5 mg/hour","Commence renal replacement therapy"],"a":4,"e":"She has rapidly progressive oliguric AKI with hyperkalaemia, metabolic acidosis, uraemia and fluid overload. Definitive renal replacement therapy is required.","w":["Low-dose dopamine does not prevent or treat AKI.","Insulin/dextrose is only a temporary measure and may cause rebound hyperkalaemia.","Bicarbonate does not correct the underlying renal failure.","Diuretics do not improve renal recovery.","CORRECT"],"p":["RRT indications include refractory hyperkalaemia, acidosis, uraemia and fluid overload.","Progressive oliguria plus rising K⁺ is dangerous.","Give IV calcium if ECG toxicity occurs.","Do not use dopamine for renal protection."],"m":"Progressive oliguric AKI with K⁺ 6.4 and acidosis requires renal replacement therapy."},{"q":"A 44-year-old woman presented with a grade 5 subarachnoid hemorrhage 7 days ago. Brainstem death testing conducted in the appropriate manner has revealed intact gag and deep tracheal stimulation reflexes. The multi-disciplinary team agrees that this patient has suffered a non-survivable brain injury.<br><br><strong>What is the next most appropriate course of action?</strong>","o":["Monitor for deterioration and conduct brain stem testing at a later date","Inform the family the results of the testing and approach the subject of heart-beating organ donation","Escalate life support therapy to ensure end-organ perfusion is maintained in case organ donation is accepted","Contact the transplant coordinator","Discuss the case with the coroner"],"a":3,"e":"She is not brainstem dead because reflexes remain, but non-heart-beating donation may still be possible after a decision to withdraw treatment. The transplant coordinator should assess suitability before family discussion.","w":["Repeating testing is not the next step when the injury is non-survivable but criteria are not met.","Heart-beating donation is not possible without neurological death.","Escalation solely for possible donation should not precede coordinator assessment and consent.","CORRECT","Coroner involvement may be needed later, but not before transplant coordination."],"p":["Withdrawal decisions must be separate from donation decisions.","NHBOD may be possible if death is expected soon after withdrawal.","Contact the transplant coordinator before approaching donation logistics.","The patient’s best interests remain primary."],"m":"Non-survivable injury without brainstem death: contact the transplant coordinator."},{"q":"A 42-year-old morbidly obese woman is admitted to the high dependency unit after an elective laparoscopic sleeve gastrectomy. Her background includes type 2 diabetes, a previous deep vein thrombosis and obstructive sleep apnoea. Two hours after admission the patient becomes agitated and breathless and an arterial blood gas demonstrates hypercapnic respiratory failure. A trial of non-invasive ventilation was not tolerated and made her more agitated, tachycardic and hypoxic.<br><br><strong>What is the next immediate step?</strong>","o":["Intubate and ventilate","Examine the respiratory system","Request an urgent chest radiograph","Request an urgent CT pulmonary angiogram","Organise an urgent transthoracic echo"],"a":1,"e":"Before committing to difficult reintubation, rapidly examine for reversible causes such as pneumothorax, aspiration, pulmonary oedema or airway obstruction.","w":["Intubation may become necessary, but the agitated patient still has a patent airway and a reversible cause may be found.","CORRECT","Imaging should be guided by immediate clinical examination.","CTPA is not the first step in an unstable postoperative patient.","Echo is not the first investigation without a focused examination."],"p":["Never skip bedside examination in postoperative deterioration.","Consider pneumothorax after central-line insertion.","NIV can convert a simple pneumothorax into tension pneumothorax.","Assess residual blockade, glucose, temperature and bleeding."],"m":"Post-bariatric hypercapnic deterioration: examine the respiratory system before reintubation."},{"q":"A 56-year-old woman with a background of chronic kidney disease presents with a pulmonary embolism. She was admitted to the high dependency unit and commenced on an unfractionated heparin infusion for anticoagulation. Five days later she developed hypoxic respiratory failure and became cardiovascularly unstable. A repeat CT pulmonary angiogram demonstrated an extension of her pulmonary embolism.<br><br><strong>What is the most useful investigation?</strong>","o":["Thrombophilia screen","Full blood count","Transthoracic echocardiogram","Lower limb vein ultrasound","Serotonin release assay"],"a":1,"e":"New thrombosis after five days of heparin strongly suggests heparin-induced thrombocytopenia. The first useful investigation is a full blood count to identify a platelet fall.","w":["A thrombophilia screen is not the immediate priority.","CORRECT","Echo assesses right-heart strain but does not diagnose HIT.","Leg ultrasound does not explain thrombosis despite heparin.","SRA confirms HIT after screening but is not the first test."],"p":["HIT typically appears 5–10 days after heparin starts.","Look for a platelet fall >50%.","Use the 4T score before antibody testing.","Stop all heparin immediately if HIT is suspected."],"m":"Thrombosis worsening on day 5 of heparin: check the platelet count first."},{"q":"A 20-year-old woman who is 37/40 pregnant with twins presents for an elective Caesarean section. She is normally fit and well and a spinal anaesthetic is performed. Immediately after performing the spinal she is placed in the supine position with a left lateral tilt and begins to complain of weak arms and difficulty in breathing. Her blood pressure drops to 80/50 mmHg, heart rate 43 beats per min and she loses consciousness. Her pupils are dilated and she has become apnoeic.<br><br><strong>Which of the following is the most likely diagnosis?</strong>","o":["Anxiety","Hypoglycaemia","Total spinal","High spinal-induced cardiovascular collapse","Aortocaval compression"],"a":2,"e":"Arm weakness, apnoea, unconsciousness and dilated pupils indicate spread to the cervical cord and brainstem—this is a total spinal.","w":["Anxiety does not cause bradycardia, apnoea and dilated pupils.","Hypoglycaemia does not fit the immediate post-spinal timing.","CORRECT","A high spinal causes cardiovascular and respiratory compromise but does not usually produce cranial nerve signs such as dilated pupils.","Aortocaval compression does not explain arm weakness and apnoea."],"p":["High block above T1 affects cardioaccelerator fibres.","C3–5 involvement causes apnoea.","Cranial nerve signs indicate a total spinal.","Support airway, ventilation and circulation immediately."],"m":"Dilated pupils and apnoea after spinal anaesthesia indicate a total spinal."},{"q":"The obstetric team wants to deliver a term baby by emergency Caesarean section for foetal distress. A spinal anaesthetic was quickly established, and the baby was delivered within minutes. However, the newborn appears floppy and pale. The midwife asked for help with resuscitation the newborn. A neonatal crash call has been put out, but the neonatal team has not yet attended. The mother is stable, and you leave her under the care of a second anaesthetist to assist the midwife.<br><br><strong>The first step in the resuscitation of a newborn is:</strong>","o":["Open the airway by maintaining the head in a neutral position","Establish the Apgar score by assessing the newborn’s appearance, pulse, grimace, activity and respiration","Deliver five inflation breaths at 30 cmH₂O airway pressure for a term baby","Dry and stimulate the newborn with a towel, replace the wet towel and cover the baby","Assess the heart rate by auscultating over the precordium"],"a":3,"e":"Newborn resuscitation begins with drying and stimulation, removing wet towels, providing warmth and starting the clock.","w":["Airway opening follows the initial drying and assessment.","Apgar scoring is not the first resuscitation step.","Inflation breaths are given if the baby is not breathing after initial measures.","CORRECT","Heart-rate assessment follows drying and stimulation."],"p":["Dry, stimulate and keep warm first.","Remove wet towels immediately.","Then assess tone, breathing and heart rate.","If apnoeic or gasping, open the airway and give five inflation breaths."],"m":"Newborn resuscitation starts with drying, stimulation and warmth."},{"q":"A 3-year-old 16 kg child with sickle cell disease is scheduled for adenotonsillectomy. He is the second case on the ENT list, but the first case is taking much longer than anticipated. He had dinner at 7 pm the previous night, and a drink at 9 pm before going to bed. He has had nothing to eat or drink since. It is now 10 am, and the child is unlikely to be anaesthetised until 1 pm. The nurse on the ward informs you that the child is getting upset because he is hungry and thirsty.<br><br><strong>The best course of action is:</strong>","o":["Postpone the case for another day, and let the child eat and drink","Let the child eat and drink until 10 am, with a plan to anaesthetise the child at 4 pm","Cancel the case, and re-consider the indication for adenotonsillectomy given the increased risk of anaesthesia and surgery in sickle cell disease","Start an intravenous infusion of warmed isotonic crystalloid","Continue to fast the child, and aim to do the child as soon as possible"],"a":3,"e":"Prolonged fasting and dehydration can precipitate a sickle crisis. Since the child is already dehydrated and surgery is still delayed, warmed isotonic IV fluid should be started.","w":["Cancellation is unnecessary.","Allowing food would create a prolonged further delay.","Sickle cell disease is not itself a reason to cancel indicated surgery.","CORRECT","Continuing to fast without hydration increases sickling risk."],"p":["Avoid dehydration, hypoxia, hypothermia, acidosis and venous stasis.","Minimise fasting in sickle cell disease.","Use warmed isotonic crystalloid when oral hydration is no longer practical.","Maintain normothermia throughout."],"m":"Prolonged fasting in sickle cell disease requires prompt warmed IV hydration."},{"q":"An 11-year-old boy was involved in a road traffic accident. He was brought in to the emergency department of a local district general hospital, where he was tachypnoeic, tachycardic, and responsive only to painful stimuli. He was intubated and ventilated and given 40 mL/kg of crystalloid intravenously. A CT head was performed after the child was stabilised, and showed an acute subdural haematoma and signs of raised intracranial pressure. After discussion with the nearest neurosurgical unit, the decision was made to transfer the child for urgent haematoma evacuation. The nearest neurosurgical unit is 1 hour away by ambulance, but the regional paediatric transport team will not be available for at least another 3 hours.<br><br><strong>The best option for the transfer of this patient is:</strong>","o":["Keep the child in the emergency department until the regional paediatric transport team is available to transfer the child","Move the child to theatre while waiting for the regional paediatric transport team to be available to transfer the child","Move the child to the intensive care unit while waiting for the regional paediatric transport team to transfer the child","Use a local non-specialist team to transfer the child immediately to the nearest neurosurgical unit","Find an alternative specialist paediatric transport team to transfer the child to the nearest neurosurgical unit"],"a":3,"e":"Urgent neurosurgical evacuation should not be delayed for several hours. A trained local team should transfer the stabilised child immediately when no specialist team is promptly available.","w":["Waiting in ED delays life-saving surgery.","Moving to theatre does not solve the transfer delay.","Local ICU admission also delays definitive care.","CORRECT","Searching for another specialist team is likely to create further delay."],"p":["Severe paediatric head injury requiring surgery should reach neurosurgery within about 4 hours.","Use the best available safe transport resource.","Stabilise airway, ventilation and circulation before departure.","Avoid hypoxia and hypotension during transfer."],"m":"Do not delay urgent paediatric neurosurgical transfer while waiting for a specialist team."},{"q":"A 39/40 week primiparous patient presents in labour. She is unable to have an epidural sited due to florid eczema over her back. Other analgesic options have failed, you have discussed and agreed on a remifentanil patient controlled analgesia (PCA).<br><br><strong>With regards to starting the PCA which of the following options is least correct?</strong>","o":["Patients require 1:1 midwife care","They require routine oxygen delivery","It is safe to use within 4 hours of other parenteral opiates","Requires a dedicated cannula","Patients require CTG monitoring"],"a":2,"e":"Remifentanil PCA should not be started within four hours of another parenteral opioid because of additive respiratory depression.","w":["Continuous one-to-one midwifery care is required.","Routine oxygen and continuous oximetry are commonly required.","CORRECT","A dedicated IV cannula is recommended.","Continuous fetal monitoring is required."],"p":["Counsel about respiratory depression, sedation, nausea and fetal bradycardia.","Use continuous pulse oximetry and 1:1 care.","Monitor RR, sedation, BP and CTG.","Avoid use within 4 hours of another parenteral opioid."],"m":"Remifentanil labour PCA is not safe within 4 hours of another parenteral opioid."},{"q":"A 70-year-old woman presents to the pain clinic with a 4-month history of neuropathic pain in the distribution of the left T10 dermatome. This was preceded by skin lesions in the same distribution. She is taking regular paracetamol and has been taking moclobemide for many years for depression. She also has a pacemaker for sick sinus syndrome.<br><br><strong>What is the most appropriate first line treatment for her pain?</strong>","o":["Transcutaneous electrical nerve stimulation (TENS)","Ten days of acyclovir and steroids","Amitriptyline","Pregabalin","Thoracic sympathetic block"],"a":3,"e":"This is post-herpetic neuralgia. Pregabalin is first-line and is safe with moclobemide, whereas amitriptyline risks a severe interaction with an MAOI.","w":["TENS is relatively contraindicated with a pacemaker.","Antiviral treatment is too late once PHN is established.","Amitriptyline should not be combined with an MAOI.","CORRECT","Sympathetic blocks have limited long-term benefit."],"p":["PHN is pain persisting >3 months after shingles.","First-line drugs include pregabalin or amitriptyline.","Avoid tricyclics with MAOIs.","Topical lidocaine may help localised pain."],"m":"Post-herpetic neuralgia with MAOI use: choose pregabalin."},{"q":"A 40-year-old woman with chronic pain from degenerative lumbar spine disease develops increasing pain in her left leg with weakness and altered sensation.<br><br><strong>Which of these statements is the most appropriate course of action?</strong>","o":["An urgent MRI is indicated to assess for nerve dysfunction","Initial treatment is conservative with simple analgesics","Early surgery should be considered to prevent further disease progression","Urgent surgical referral is needed if pain spreads to both legs","Lumbar spine radiography is useful if MRI not available"],"a":1,"e":"Unilateral radicular symptoms without red flags or progressive neurological compromise are initially managed conservatively because many resolve spontaneously.","w":["MRI is indicated but not urgently without red flags.","CORRECT","Early surgery is not routinely required.","Bilateral pain alone is not the key red flag; bladder/bowel dysfunction, saddle anaesthesia or progressive deficit are more important.","Plain radiographs do not show nerve-root compression."],"p":["Start with simple analgesia and activity advice.","Urgent imaging is for red flags.","Progressive motor deficit, cauda equina features or gait disturbance require urgent referral.","MRI is the preferred imaging test when needed."],"m":"Unilateral radicular pain without red flags is treated conservatively first."},{"q":"A 48-year-old man presents for an elective open rotator cuff repair. He is fit and well and has no known allergies.<br><br><strong>What would be the most appropriate perioperative analgesic plan?</strong>","o":["Interscalene block with 20 mL 0.5% levobupivacaine and regular paracetamol and ibuprofen","Suprascapular block with 20 mL 0.5% levobivacaine and regular paracetamol and ibuprofen","Axillary brachial plexus block with 20 mL 0.5% levobupivacaine and regular paracetamol and ibuprofen","Regular paracetamol, ibuprofen and morphine patient controlled analgesia (PCA)","Intra-articular injection with 10 mg morphine and 20 mL 0.5% levobupivacaine by surgeons at the end of surgery combined with regular paracetamol and ibuprofen"],"a":0,"e":"An interscalene block provides the most complete shoulder analgesia and should be combined with regular simple analgesics.","w":["CORRECT","Suprascapular block covers only part of the shoulder and lacks skin coverage.","Axillary block is too distal for shoulder surgery.","PCA causes more systemic adverse effects and inferior regional analgesia.","Intra-articular analgesia is less effective than interscalene block."],"p":["Shoulder surgery is highly painful.","Interscalene block covers roots/trunks supplying the shoulder.","Warn about phrenic nerve palsy.","Prescribe rescue opioid for block wear-off."],"m":"Open rotator cuff repair: interscalene block plus paracetamol and NSAID."},{"q":"A 26-year-old woman developed a headache 36 hours following a suspected dural puncture with a 16G Tuohy needle whilst having an epidural for labour analgesia. She had an epidural blood patch that was effective for 24 hours, but the headache has now returned. Neurological examination is normal and she is afebrile.<br><br><strong>What step would most likely be beneficial in the management of this ongoing headache?</strong>","o":["Sumatriptan","400 mg caffeine intravenously twice daily","Bed rest","Intravenous fluids","Second blood patch"],"a":4,"e":"Recurrent post-dural puncture headache after temporary improvement from the first patch is most effectively treated with a second epidural blood patch.","w":["Sumatriptan has limited evidence.","IV caffeine has only short-lived and inconsistent benefit.","Bed rest does not seal the dural leak.","Routine IV fluids do not correct the CSF leak.","CORRECT"],"p":["Blood patch is the gold-standard treatment for significant PDPH.","A second patch is required in a substantial minority.","Exclude alternative postpartum headache causes first.","Persistent atypical symptoms require neurological assessment."],"m":"Recurrent PDPH after a successful first patch: perform a second blood patch."},{"q":"A 73-year-old man is attending the day surgery unit for a cataract operation. He has a past medical history of atrial fibrillation, well-controlled chronic obstructive pulmonary disease (COPD) and type II diabetes mellitus. He has had retinal detachment surgery on the same eye previously and would prefer to have the procedure performed under regional anaesthesia.<br><br><strong>Which of the following is the most significant risk factor for this patient having a sub-Tenon’s block?</strong>","o":["INR of 2.0","COPD","Previous retinal detachment surgery","Age >70","Blood glucose of 8 mmol/L"],"a":2,"e":"Previous retinal detachment surgery may leave a scleral buckle and scarring, causing unpredictable spread and increased risk of globe perforation during sub-Tenon’s block.","w":["Therapeutic anticoagulation is not an absolute contraindication to sub-Tenon’s block.","COPD is acceptable if the patient can lie flat.","CORRECT","Age alone is not a contraindication.","A glucose of 8 mmol/L is not a significant block-related risk."],"p":["Previous retinal surgery changes anatomy.","Scleral buckles may obstruct cannula passage.","Topical anaesthesia may be safer.","Sub-Tenon’s block is generally safer than sharp-needle orbital blocks in anticoagulated patients."],"m":"The strongest risk factor for sub-Tenon’s block is previous retinal detachment surgery."},{"q":"The recovery nurses are concerned about a 74-year-old woman following a right carotid endarterectomy under superficial cervical plexus block. They noticed the right pupil is smaller than the left. The patient is asymptomatic but you also observe ptosis of the right eye. The anaesthetic chart shows that the anaesthetist used 20 mL of 0.25% levobupivacaine for the block.<br><br><strong>What is the explanation you provide to the concerned patient and nurses?</strong>","o":["This is a surgical complication; need to contact the surgical team","This is a regional anaesthetic related complication, reassure and continue to observe the patient in recovery for resolution","The patient had a stroke, alert the surgical team please","Administer intralipid 20%, to the patient","This is a congenital abnormality"],"a":1,"e":"Ptosis and miosis after cervical plexus block indicate temporary Horner’s syndrome from spread to the cervical sympathetic chain.","w":["It is not primarily a surgical complication in an otherwise asymptomatic patient.","CORRECT","The pattern is not typical of stroke.","The local anaesthetic dose is low and there are no systemic toxicity features.","Congenital anisocoria would not newly appear with ptosis."],"p":["Horner’s syndrome = ptosis, miosis and anhidrosis.","It can follow cervical plexus blockade.","It usually resolves as the block wears off.","Continue observation and neurological assessment."],"m":"Ptosis plus miosis after cervical plexus block = temporary Horner’s syndrome."},{"q":"A 65-year-old man is listed for an elective total knee replacement.<br><br><strong>What would be the most appropriate nerve block to manage his perioperative analgesia?</strong>","o":["Femoral nerve block","3-in-1 block","Fascia iliaca block","Adductor canal block","Sciatic and femoral nerve block"],"a":3,"e":"Adductor canal block provides effective sensory analgesia for total knee replacement while preserving quadriceps strength and supporting early mobilisation.","w":["Femoral block causes quadriceps weakness and fall risk.","The 3-in-1 block is unreliable, especially for obturator spread.","Fascia iliaca is less targeted for knee arthroplasty.","CORRECT","Combined sciatic and femoral block produces excessive motor block."],"p":["Adductor canal block targets the saphenous nerve and other sensory branches.","It is motor-sparing compared with femoral block.","Use larger volumes for major knee surgery.","Combine with multimodal analgesia."],"m":"Total knee replacement: choose an adductor canal block for motor-sparing analgesia."},{"q":"A 68-year-old lady has been admitted to hospital with suspected infective endocarditis and has positive blood cultures for Staphylococcus aureus.<br><br><strong>Which of the following criterion needs to be met in order to reach a conclusive diagnosis of infective endocarditis as per the modified Duke's criteria?</strong>","o":["Temperature >38°C","A dilated right ventricle on echocardiogram","Jayneway lesions","Intracardiac mass on echocardiogram","Pericardial effusion on echocardiogram"],"a":3,"e":"An oscillating intracardiac mass on echocardiography is a major Duke criterion and, together with positive blood cultures, supports a definitive diagnosis.","w":["Fever is only a minor criterion.","Right-ventricular dilatation is not a Duke criterion.","Janeway lesions are a minor vascular phenomenon.","CORRECT","Pericardial effusion is not a Duke major criterion."],"p":["Major criteria: typical positive blood cultures and positive echocardiography.","Echo major findings include vegetation, abscess or prosthetic-valve dehiscence.","Definite IE: two major, or one major plus two minor, or five minor.","Janeway lesions are minor vascular phenomena."],"m":"Positive cultures plus an intracardiac vegetation fulfils major Duke criteria."},{"q":"A 73-year-old man is undergoing a laparotomy for perforative peritonitis. He has a history of ischaemic heart disease and asthma. Intraoperative cardiac output monitoring is performed using an oesophageal Doppler probe. The readings are: SVI 110 mL/m², FTc 490 ms, heart rate 106 beats per minute and blood pressure 80/56 mmHg. Following a fluid bolus of 200 mL colloid his SVI changes to 115 mL/m² and FTc remains 490 ms with minimal change in vital parameters.<br><br><strong>Using the current data, which of the following options is the next most appropriate step in the management of this patient:</strong>","o":["Further 200 mL colloid bolus","Dobutamine infusion to titrate blood pressure","Noradrenaline infusion to titrate blood pressure","Observe for another twenty minutes and repeat measurements","500 mL crystalloid bolus"],"a":2,"e":"The high SVI and prolonged FTc indicate a low-afterload vasodilated circulation rather than hypovolaemia. The minimal response to fluid confirms that vasopressor therapy is required.","w":["Further fluid risks overload and is unlikely to help.","Dobutamine may worsen vasodilation.","CORRECT","Observation delays treatment of significant hypotension.","A larger crystalloid bolus is inappropriate in a fluid-unresponsive patient."],"p":["High FTc suggests low afterload.","A <10% rise in SV after fluid indicates non-responsiveness.","Septic vasodilation requires noradrenaline.","Dobutamine is for low-output states, not high-SVI vasoplegia."],"m":"High SVI + high FTc + hypotension after no fluid response = start noradrenaline."}],"9":[{"q":"A 61-year-old man has been brought to the emergency department intubated and ventilated. Examination reveals a large frontal haematoma and a single dilated, but reactive, pupil. His abnormal observations are a blood pressure of 180/100 mmHg, heart rate of 45 bpm and temperature of 35.5°C. An arterial blood gas shows PaO₂ 13 kPa, PaCO₂ of 6.9 kPa and blood glucose 8 mmol/L.<br><br><strong>Which of the following parameters should be your priority when attempting to acutely improve this patient's cerebral perfusion?</strong>","o":["Temperature","PaCO₂","Blood pressure","PaO₂","Blood glucose"],"a":1,"e":"Hypercapnia causes cerebral vasodilatation and rapidly raises ICP. Correcting PaCO₂ toward 4.5–5.0 kPa has the fastest useful effect on cerebral perfusion.","w":["Normothermia is desirable, but active warming is not the immediate priority.","CORRECT","His MAP is already high enough.","PaO₂ 13 kPa is adequate.","Glucose 8 mmol/L is acceptable."],"p":["CPP = MAP − ICP.","PaCO₂ strongly affects cerebral blood flow.","Avoid PaCO₂ <4.0 kPa because of cerebral ischaemia.","Target PaO₂ >13 kPa."],"m":"Raised ICP with PaCO₂ 6.9 kPa: correct ventilation first."},{"q":"You are anaesthetising a 78-year-old man for a right upper lobectomy and lymphadenectomy for adenocarcinoma via video assisted thoracoscopic surgical approach (VATS). He is a long-term smoker, has chronic obstructive pulmonary disease (COPD) and takes aspirin 75 mg o.d. His FEV₁ is 1.5 L. Despite your best efforts, you fail to site a thoracic epidural.<br><br><strong>Which of the following would be the most appropriate technique to optimise this gentleman's perioperative analgesia?</strong>","o":["Single shot paravertebral injection at T6","Ask the surgeon to site a paravertebral catheter","Run a remifentanil infusion perioperatively and leave the patient intubated overnight","Ask the surgeon to site an intrapleural catheter","Perform intercostal blocks at T5–8"],"a":1,"e":"A surgically placed paravertebral catheter gives unilateral continuous analgesia and is an excellent alternative when thoracic epidural placement fails.","w":["Single-shot duration is less reliable for major thoracic surgery.","CORRECT","Prolonged ventilation is unnecessary and harmful.","Intrapleural local anaesthetic is less reliable and may drain away.","Intercostal blocks are shorter acting."],"p":["Paravertebral analgesia is comparable to epidural for unilateral thoracic pain.","Catheters allow postoperative infusion.","It preserves haemodynamics better than thoracic epidural.","Avoid inadequate analgesia in COPD."],"m":"Failed thoracic epidural for VATS: use a paravertebral catheter."},{"q":"You are asked to urgently review a 57-year-old man 7 days post left pneumonectomy. He remained intubated and ventilated for 24 hours post operatively due to intraoperative bleeding and hypothermia. A left sided intercostal drain was removed 24 hours ago. He is now complaining of cough, shortness of breath and chest pain. His oxygen saturations are 89% on 15 L/min oxygen. On examination there is new subcutaneous emphysema of the chest wall. Heart rate is 60 beats per minute and blood pressure is 80/50 mmHg.<br><br><strong>What is the most appropriate next step?</strong>","o":["Urgent chest radiograph (CXR)","Needle thoracocentesis followed by insertion of 22F intercostal drain","Immediate insertion of a 12F intercostal drain by the Seldinger technique","Urgent bronchoscopy","Urgent CT scan and thoracic surgical opinion"],"a":1,"e":"This is likely bronchopleural fistula with tension physiology. Immediate needle decompression must be followed by a large-bore drain.","w":["Imaging would dangerously delay decompression.","CORRECT","A small Seldinger drain may be too slow and inadequate for blood/pus.","Bronchoscopy follows stabilisation.","CT follows emergency decompression."],"p":["Post-pneumonectomy stump breakdown can cause BPF.","Subcutaneous emphysema plus shock suggests tension physiology.","Decompress before imaging.","Use a large-bore drain if blood or pus may be present."],"m":"Tension pneumothorax after pneumonectomy: needle decompress, then large-bore drain."},{"q":"A 3-year-old boy is under general anaesthesia for the removal of a foreign body partially obstructing his right main bronchus via rigid bronchoscopy. He is breathing spontaneously and receiving sevoflurane in air. Foreign body instrumentation is difficult and after prolonged grasping attempts and suctioning, he becomes bradycardic with a heart rate of 25 beats per minute.<br><br><strong>What is the most likely cause of his clinical deterioration?</strong>","o":["Hypoxia","Depth of anaesthesia","Hypothermia","Hypercarbia","Vasovagal reflex"],"a":0,"e":"During paediatric bronchoscopy, severe bradycardia after prolonged instrumentation should be assumed to be hypoxic until proved otherwise.","w":["CORRECT","Excessive depth can cause bradycardia but is less likely after prolonged instrumentation.","Hypothermia is unlikely to develop this rapidly.","Hypercarbia usually initially causes tachycardia.","A vagal reflex is possible but hypoxia is more likely."],"p":["Bronchoscopy equipment narrows the airway lumen.","Suctioning reduces oxygen delivery.","Foreign-body displacement can completely obstruct the airway.","Bradycardia in children is commonly a late sign of hypoxia."],"m":"Paediatric bronchoscopy + profound bradycardia = hypoxia until proven otherwise."},{"q":"A 48-year-old woman has had an arthroscopic rotator cuff repair. She has received a general anaesthetic, a supraglottic airway was inserted and had an interscalene block. Her surgery finished at midday.<br><br><strong>Which of the following is most likely to prevent her from being discharged on the day of surgery?</strong>","o":["Lives in a rural location 30 minutes by car to the nearest hospital","Has an adult relative to act as carer at home only until 20.00","Hasn’t yet passed urine","Is taking a public taxi home with an adult relative","Has residual upper arm weakness"],"a":1,"e":"A responsible adult should remain with the patient for the first 24 hours after day-case anaesthesia.","w":["Thirty minutes from hospital is generally acceptable.","CORRECT","Voiding is not mandatory unless the urinary tract was manipulated.","A taxi is acceptable if accompanied.","Residual block weakness can be acceptable with clear instructions."],"p":["Day-case discharge needs a responsible adult escort.","The adult should remain for 24 hours.","Oral intake and voiding are not always mandatory.","Residual nerve block is acceptable with education and protection."],"m":"No 24-hour responsible adult carer = no same-day discharge."},{"q":"A 78-year-old man is listed for a transurethral resection of his prostate (TURP) under spinal anaesthesia. He has moderate to severe chronic obstructive pulmonary disease (COPD) with ongoing steroid use, ischaemic heart disease, and had a coronary stent inserted 15 months ago. He normally takes aspirin and clopidogrel, but has not been taking the latter for “a few weeks”. He has also recently started taking rivaroxaban 10 mg at night for an irregular heart rate.<br><br><strong>What is the safest way to proceed?</strong>","o":["Ensuring 18 hours after the last dose of rivaroxaban, give a spinal, and then start a heparin infusion postoperatively","Give a spinal now and use treatment dose low molecular weight heparin (LMWH) from 2 hours postoperatively","Wait until 24 hours after the last dose of rivaroxaban, then proceed with a spinal, and give the next dose immediately postoperatively","Ensure 12 hours after the last dose of rivaroxaban, and give prophylactic LMWH 6 hours postoperatively","Discuss with the patient the increased risks of central neuraxial blockade and proceed under general anaesthesia"],"a":0,"e":"The book recommends waiting 18 hours after prophylactic rivaroxaban before spinal anaesthesia, then using postoperative heparin rather than restarting rivaroxaban immediately.","w":["CORRECT","Neuraxial block now is unsafe.","Immediate postoperative rivaroxaban after spinal is unsafe.","Twelve hours is shorter than the book’s recommended interval.","General anaesthesia is not required when neuraxial timing can be made safe."],"p":["Aspirin alone does not contraindicate spinal anaesthesia.","Clopidogrel should be stopped for at least 7 days.","Rivaroxaban requires an adequate pre-block interval.","Do not restart potent anticoagulation immediately after neuraxial puncture."],"m":"Rivaroxaban: allow the full pre-spinal interval and delay potent postoperative anticoagulation."},{"q":"A 64-year-old man undergoes hip surgery under general anaesthesia. He is positive pressure ventilated through a size 5 laryngeal mask airway and anaesthesia is maintained with nitrous oxide and sevoflurane. In recovery, he complains of paraesthesia over the right anterior aspect of his tongue. There is no dysphagia or dysarthria and tongue appearance and movements are normal.<br><br><strong>What is the most likely cause of his neurological signs in recovery?</strong>","o":["Hypoglossal nerve injury","Lingual nerve injury","Recurrent laryngeal nerve injury","Inferior alveolar nerve injury","Venous drainage obstruction"],"a":1,"e":"Unilateral sensory disturbance over the anterior two-thirds of the tongue with preserved movement is typical of lingual nerve neurapraxia from LMA cuff pressure.","w":["Hypoglossal injury causes motor weakness and tongue deviation.","CORRECT","Recurrent laryngeal injury causes dysphonia or stridor.","Inferior alveolar injury affects lower teeth/chin.","Venous obstruction would cause tongue swelling or cyanosis."],"p":["Nitrous oxide can expand an LMA cuff.","Overinflation increases pressure-neuropraxia risk.","Lingual nerve supplies sensation to anterior two-thirds of tongue.","Most neurapraxias resolve spontaneously."],"m":"Anterior tongue paraesthesia with normal movement after LMA = lingual nerve injury."},{"q":"A patient with an acute subarachnoid haemorrhage is undergoing coil embolisation of the aneurysm in the interventional neuroradiology suite. Anaesthesia is induced with alfentanil, propofol and rocuronium. Maintenance of anaesthesia is with sevoflurane and remifentanil infusion. Shortly after intubation the observations are as follows: blood pressure 220/110 mmHg, heart rate 90 beats per minute, SpO₂ 98%, ETCO₂ 4.9 kPa and end-tidal sevoflurane 1.9%.<br><br><strong>What is the most appropriate initial management?</strong>","o":["Alert radiologist","Increase depth of anaesthesia","Increase minute ventilation","Give mannitol 1 g/kg","Start intravenous esmolol infusion"],"a":0,"e":"A sudden severe blood-pressure rise during coiling may indicate aneurysm rupture. The radiologist must be informed immediately before further targeted treatment.","w":["CORRECT","Deepening anaesthesia may be needed but follows immediate communication.","Ventilation is already acceptable.","Mannitol may be needed later if ICP rises.","Esmolol may control BP but should not precede alerting the operator."],"p":["Intra-procedural aneurysm rupture can present only as haemodynamic change.","Communicate immediately.","Then control BP and ICP.","Prepare for ventriculostomy or emergency surgery if required."],"m":"Sudden hypertension during aneurysm coiling: alert the radiologist first."},{"q":"A 10 kg child with no comorbidities is scheduled for an elective umbilical hernia repair as a day case.<br><br><strong>Which of the following would be the best regime of injectate for caudal epidural analgesia?</strong>","o":["10 mL of 0.25% levobupivacaine with 10 μg fentanyl","10 mL of 0.25% levobupivacaine","10 mL of 0.25% plain bupivacaine with 300 μg diamorphine","10 mL of 0.25% levobupivacaine with 25 μg clonidine","10 mL of 0.25% bupivacaine"],"a":1,"e":"For upper abdominal spread in a 10 kg child, 1 mL/kg of 0.25% levobupivacaine is appropriate. Additives are avoided in day surgery because of sedation, nausea or respiratory depression.","w":["Fentanyl does not prolong caudal analgesia and increases PONV.","CORRECT","Diamorphine risks delayed respiratory depression.","The clonidine dose is excessive for day surgery.","Bupivacaine is acceptable, but levobupivacaine has a safer toxicity profile."],"p":["Caudal volume determines spread.","Upper abdominal block: about 1 mL/kg.","Levobupivacaine provides less motor block and lower cardiotoxicity.","Avoid opioid additives in day cases."],"m":"10 kg child for umbilical hernia: 10 mL of 0.25% levobupivacaine."},{"q":"A 65-year-old man for elective thoracotomy and pulmonary lobectomy is to have a thoracic epidural for perioperative analgesia.<br><br><strong>Which of the following is the best approach for epidural insertion?</strong>","o":["A midline mid-thoracic epidural under general anaesthesia","A paramedian mid-thoracic epidural under light sedation or awake","A paramedian lower-thoracic epidural under general anaesthesia","A midline upper lumbar epidural under light sedation or awake","A midline mid-thoracic epidural under light sedation or awake"],"a":1,"e":"Mid-thoracic spinous processes are steeply angled, making a paramedian approach easier. The patient should remain awake or lightly sedated to report pain or paraesthesia.","w":["Insertion under GA removes neurological warning symptoms.","CORRECT","Lower thoracic placement may not cover the incision adequately and GA is less safe.","An upper lumbar catheter is too low.","Midline is more difficult in the mid-thoracic region."],"p":["Thoracic epidural level should match incision dermatomes.","T6–T7 is common for thoracotomy.","Paramedian is easier at T3–T7.","Avoid deep sedation during insertion."],"m":"Thoracotomy epidural: awake/lightly sedated, paramedian, mid-thoracic."},{"q":"An 84-year-old ASA 3 woman is listed for multilevel facet joint injections and a caudal epidural by the orthopaedic surgeons. The patient will need to lie in the prone position. Comorbidities include moderate COPD, angina, hypertension and chronic lower back pain. Alongside all her cardiovascular medications she takes regular co-dydramol and amitriptyline for her pain.<br><br><strong>The safest anaesthetic technique for this procedure is:</strong>","o":["0.25–0.5 mg/kg intravenous ketamine","Local anaesthesia only with no sedation","Infusion of remifentanil at 0.25 μg/kg/min","Target controlled infusion of propofol at a 1 μg/mL","0.5 μg/kg fentanyl followed after several minutes by small doses of intravenous midazolam titrated to effect"],"a":4,"e":"The painful prone procedure needs analgesia. A small fentanyl dose followed by carefully titrated midazolam offers the best balance of comfort and safety.","w":["Ketamine may worsen angina through sympathetic stimulation.","Local anaesthetic alone may be inadequate.","Remifentanil has a narrow safety margin and significant respiratory depression.","Propofol provides no analgesia and may cause hypotension/apnoea.","CORRECT"],"p":["Give the opioid first and allow peak effect.","Then titrate small benzodiazepine aliquots.","Prone sedation requires excellent monitoring and airway planning.","Loss of verbal contact means GA-level care."],"m":"For painful prone procedures, use small fentanyl then carefully titrated midazolam."},{"q":"A 62-year-old non-diabetic woman presents to the intensive care unit with severe urosepsis.<br><br><strong>Which of the following glucose levels would be the most appropriate to target?</strong>","o":[">4 mmol/L","4–6 mmol/L","6–8 mmol/L","<10 mmol/L","<15 mmol/L"],"a":3,"e":"Modern ICU practice avoids tight glycaemic control because it increases hypoglycaemia and mortality. The target is an upper glucose below 10 mmol/L.","w":[">4 mmol/L gives only a lower limit, not a treatment target.","Tight control causes excess hypoglycaemia.","This is tighter than required.","CORRECT","Below 15 mmol/L is too permissive."],"p":["Start insulin when repeated glucose exceeds about 10 mmol/L.","Avoid severe hypoglycaemia.","Use arterial or blood-gas samples when possible.","Monitor frequently during insulin infusion."],"m":"Sepsis glucose target: keep below 10 mmol/L, not 4–6."},{"q":"A 19-year-old male motorcyclist is admitted following a high speed road traffic accident. The retrieval team report he has clinical evidence of bilateral flail segments and a significant neurological injury. He is intubated and sedated by the retrieval service with intermittent doses of ketamine, propofol and rocuronium and arrives to the intensive care unit. He has been haemodynamically stable with moderate and escalating ventilator requirements.<br><br><strong>The most appropriate sedation regime for this patient on the intensive care unit would be:</strong>","o":["Propofol and fentanyl","Clonidine and fentanyl","Midazolam and fentanyl","Ketamine and fentanyl","Fentanyl alone"],"a":0,"e":"Propofol is short acting and easily titrated, allowing early neurological assessment, while fentanyl provides analgesia for severe chest-wall injury.","w":["CORRECT","Clonidine may cause haemodynamic compromise.","Midazolam accumulates and delays neurological assessment.","Ketamine may cause psychomimetic effects and is less easy to titrate for ICU sedation.","Fentanyl alone may not provide adequate hypnosis."],"p":["Use an analgesic plus a titratable hypnotic.","Propofol allows rapid sedation holds.","Avoid oversedation.","Exclude pneumothorax when ventilator requirements rise."],"m":"Head and chest trauma requiring early neurological review: propofol plus fentanyl."},{"q":"A 26-year-old woman who is 32/40 pregnant had a witnessed collapse whilst shopping. She received bystander CPR and advanced life support by the paramedics for one hour prior to transfer to a teaching hospital. In hospital, a Caesarean section was performed immediately. ALS continued for a further 45 minutes without return of spontaneous circulation and a profound metabolic acidosis developed.<br><br><strong>What now is the most appropriate management option?</strong>","o":["Terminate life support and organise a team debrief","Administer thrombolysis and continue ALS","Continue ALS until the intensive care consultant arrives","Commence extra-corporeal membrane oxygenation (ECMO)","Administer 10–20 mL of 8.4% sodium bicarbonate"],"a":3,"e":"In a young patient with prolonged refractory arrest despite perimortem Caesarean delivery, extracorporeal CPR offers the only realistic rescue option when available.","w":["Termination may be premature in a young potentially reversible case.","Thrombolysis is extremely hazardous after emergency Caesarean section.","Waiting adds delay without improving circulation.","CORRECT","Bicarbonate does not restore effective circulation."],"p":["VA-ECMO provides circulatory and gas-exchange support.","ECPR benefits are greatest when instituted early.","Pregnancy itself is not a contraindication.","Major recent surgery makes thrombolysis hazardous."],"m":"Prolonged refractory maternal cardiac arrest after delivery: consider ECMO."},{"q":"A 76-year-old woman has had an upper gastrointestinal bleed and presented with an acute kidney injury. After resuscitation and an oesophago-duodenoscopy she is admitted to the intensive care unit for renal replacement therapy. The nurse requests that you prescribe the particulars of renal haemofiltration including the anticoagulation.<br><br><strong>The most appropriate choice is:</strong>","o":["Unfractionated heparin loading dose followed by a pre-filter infusion","No anti-coagulation","Prostacyclin infusion","Sodium citrate pre-filter infusion","Increasing the fraction of replacement fluid added before the filter"],"a":2,"e":"Prostacyclin provides short-acting filter anticoagulation with minimal systemic effect, making it suitable after recent gastrointestinal bleeding.","w":["Heparin increases systemic bleeding risk.","After resuscitation, completely omitting anticoagulation may shorten filter life.","CORRECT","Citrate is effective but complex and was less commonly used in the book’s setting.","Predilution reduces clotting but is not sufficient anticoagulation."],"p":["All extracorporeal circuits activate coagulation.","Prostacyclin inhibits platelets and wears off rapidly.","Monitor for vasodilatation and hypotension.","Use no anticoagulation when significant coagulopathy persists."],"m":"Recent GI bleed needing haemofiltration: prostacyclin minimises systemic anticoagulation."},{"q":"A 65-year-old man is recovering on the high dependency unit after an emergency laparotomy for small bowel perforation for which he received an effective epidural. Overnight he becomes very agitated and confused and attempts to remove his invasive lines and monitoring. Examination, review of his blood science investigations and blood gas results are all unremarkable.<br><br><strong>What is the most appropriate course of treatment?</strong>","o":["Reassure the patient regarding his situation","Call his wife to hospital to help calm him down","Prescribe vitamin replacement therapy and benzodiazepine sedation","Prescribe haloperidol","Commence sedation with clonidine"],"a":3,"e":"This is dangerous hyperactive delirium after reversible causes have been excluded. Haloperidol is the first-line pharmacological treatment in the book.","w":["Reassurance alone is insufficient when he is actively unsafe.","Family support helps prevention but is not adequate for immediate control.","Benzodiazepines can worsen non-withdrawal delirium.","CORRECT","Clonidine may cause hypotension and is not first-line."],"p":["Always exclude hypoxia, sepsis, pain, retention and metabolic causes.","Use CAM-ICU or ICDSC for assessment.","Haloperidol can prolong QT.","Benzodiazepines are reserved mainly for alcohol withdrawal."],"m":"Unsafe hyperactive delirium after reversible causes are excluded: give haloperidol."},{"q":"A 26-year-old woman who is 3 days post-partum has returned to the labour ward complaining of an ongoing headache. She delivered vaginally after having a lumbar epidural for labour. On the first day postpartum she had complained of a frontal headache that worsened with coughing and had been diagnosed with a post-dural puncture headache (PDPH). At home, she has been taking simple analgesia and drinking plenty of water for the past 2 days but the headache is persisting.<br><br><strong>What is the next best line of management in this situation?</strong>","o":["Encourage her to drink coffee and 3 L of water per day","Encourage her to drink coffee and prescribe sumatriptan","Admit her overnight for intravenous fluid therapy, regular analgesia and further assessment","Offer her an epidural blood patch","Offer her an epidural blood patch and perform routine blood cultures at the same time"],"a":3,"e":"Persistent disabling PDPH despite two days of conservative treatment should be treated with an epidural blood patch.","w":["More conservative management is unlikely to resolve significant symptoms.","Sumatriptan has little evidence in PDPH.","IV fluids do not seal the leak.","CORRECT","Routine blood cultures are unnecessary in an afebrile patient."],"p":["Confirm the postural nature and perform a neurological examination.","Exclude pre-eclampsia, meningitis and cerebral venous thrombosis.","Blood patch is the definitive treatment.","Do not perform a blood patch in a febrile patient."],"m":"Persistent PDPH after conservative therapy: offer an epidural blood patch."},{"q":"A 21-year-old woman in antenatal clinic is due to have an elective Caesarean section for breech presentation within the next two weeks. She is concerned about having a spinal anaesthetic as she has been diagnosed with gestational thrombocytopenia. You review her blood results and her platelet count has been low but steady.<br><br><strong>Which of the following blood results would prevent this lady from having a spinal?</strong>","o":["Platelet count <50 × 10⁹/L","Activated partial thromboplastin time of 30 seconds","Platelet count <100 × 10⁹/L","Platelet count <70 × 10⁹/L","Prothrombin time of 12 seconds"],"a":0,"e":"In stable gestational thrombocytopenia with normal coagulation, the book accepts neuraxial anaesthesia above 50 × 10⁹/L. Below this level it should not be performed.","w":["CORRECT","An APTT of 30 seconds is normal.","A platelet count below 100 does not automatically contraindicate spinal anaesthesia.","Counts between 50 and 70 require senior judgement but are not an absolute bar in the book.","A PT of 12 seconds is normal."],"p":["Trend matters as well as the absolute platelet count.","Check for pre-eclampsia, DIC or other coagulopathy.","Discuss low counts with a consultant.","Follow local policy."],"m":"Stable gestational thrombocytopenia: platelet count below 50 × 10⁹/L prevents spinal anaesthesia."},{"q":"A 15 kg, 3-year-old girl was brought to the emergency department with a history of choking on a piece of apple 6 hours previously. She appears comfortable and not in respiratory distress. Her chest sounds clear on auscultation but a chest X-ray shows a right lung that is more inflated and radiolucent compared to the left, particularly on the expiration film. Suspecting the child has inhaled the piece of apple, the ENT team want to perform an urgent examination under anaesthesia with a rigid bronchoscopy and removal of foreign body.<br><br><strong>The most appropriate anaesthetic plan for this case is:</strong>","o":["Perform a rapid sequence induction and intubate to secure the airway","Routine intravenous induction with muscle relaxant. Intubate and ventilate until rigid bronchoscopy","Routine intravenous induction with muscle relaxant. Insert a supraglottic airway device for ventilation until rigid bronchoscopy","Routine intravenous induction without muscle relaxant. Facemask ventilation until rigid bronchoscopy","Inhalational anaesthetic induction and maintenance with sevoflurane, without muscle relaxant. Maintain spontaneous respiration throughout the case"],"a":4,"e":"Maintaining spontaneous ventilation reduces the risk that positive pressure will drive the foreign body distally or convert partial obstruction into complete obstruction.","w":["RSI and intubation may dislodge the foreign body.","Paralysis removes spontaneous breathing and may worsen obstruction.","An SAD does not protect against distal displacement.","IV induction may cause apnoea before the airway is controlled.","CORRECT"],"p":["Use sevoflurane in oxygen.","Avoid muscle relaxation until the airway is secured and the surgeon is ready.","Rigid bronchoscopy is the definitive treatment.","Positive pressure may worsen distal obstruction."],"m":"Suspected bronchial foreign body: inhalational induction with spontaneous ventilation."},{"q":"An 18-month old boy is scheduled for an inguinal hernia repair as a day case. His mother reports that he developed an anxiety to needles since a hospital admission for pneumonia 5 months previously, and has not had his MMR vaccination. His mother requests a gas induction and asks if he could receive his MMR vaccination while under general anaesthesia.<br><br><strong>The best course of action is:</strong>","o":["Administer the MMR vaccination after induction of anaesthesia","Ask the surgical team to administer the MMR vaccination whilst under general anaesthesia","Ask the paediatric team to administer the MMR vaccination postoperatively prior to discharge","Arrange for the GP to administer the MMR vaccination 4 weeks postoperatively","Cancel the surgery until the child has had his MMR vaccination"],"a":3,"e":"Routine vaccination should not be given opportunistically during anaesthesia. Arrange administration after recovery, and the book’s best option is GP vaccination four weeks later.","w":["Vaccination during anaesthesia is discouraged.","The surgical team should not administer it during GA.","Immediate postoperative vaccination may conflict with analgesic use and adverse-effect interpretation.","CORRECT","Missing MMR is not a reason to cancel the hernia repair."],"p":["Avoid combining elective vaccination with anaesthesia when possible.","Postoperative fever may confuse surgical assessment.","Paracetamol/NSAIDs may reduce vaccine immune response.","Arrange vaccination after recovery."],"m":"Do not give MMR during anaesthesia; arrange later GP vaccination."},{"q":"A 58-year-old woman is listed for an elective hysterectomy. She states that she has a morphine allergy which made her eyes and lip swell in the past.<br><br><strong>Which of the following analgesics would be unsafe in this patient?</strong>","o":["Pethidine","Tramadol","Buprenorphine","Methadone","Fentanyl"],"a":2,"e":"Buprenorphine is a phenanthrene structurally related to morphine, so cross-reactivity is possible in a true morphine allergy.","w":["Pethidine is a phenylpiperidine and structurally distinct.","Tramadol is structurally distinct.","CORRECT","Methadone is a diphenylheptane and structurally distinct.","Fentanyl is a phenylpiperidine and usually safe."],"p":["True IgE-mediated morphine allergy is rare.","Use an opioid from a different structural class.","Phenanthrenes include morphine, codeine, oxycodone and buprenorphine.","Clarify whether the previous reaction was allergy or histamine release."],"m":"True morphine allergy: avoid related phenanthrenes such as buprenorphine."},{"q":"A 64-year-old woman with a history of chronic pain is listed for a shoulder replacement. She normally takes gabapentin 300 mg three times a day, paracetamol 1 g as needed and a buprenorphine patch at 20 μg/hour.<br><br><strong>What is the most appropriate postoperative analgesic regimen for this patient?</strong>","o":["Paracetamol, ibuprofen, gabapentin, MST 25 mg twice daily, Oramorph 10–20 mg 4-hourly","Paracetamol, diclofenac, a morphine PCA 2 mg bolus with 5 minute lockout","Paracetamol, ibuprofen, gabapentin, fentanyl PCA with 25 μg bolus with 5 minute lockout","Paracetamol, codeine, tramadol and Oramorph 10–20 mg 4-hourly","Paracetamol, ibuprofen, gabapentin, Oxynorm 15 mg twice daily"],"a":0,"e":"A 20 μg/hour buprenorphine patch is roughly equivalent to 48 mg oral morphine per day. MST 25 mg twice daily replaces the baseline requirement, with Oramorph for breakthrough pain.","w":["CORRECT","The PCA settings are aggressive and omit clear baseline conversion planning.","A bolus-only fentanyl PCA does not replace her chronic background opioid.","This regimen is weak, duplicative and ignores her opioid tolerance.","Immediate-release Oxynorm is not appropriate as a fixed background regimen."],"p":["Continue baseline opioid equivalence perioperatively.","Buprenorphine patch conversion is approximately 1:100 to oral morphine in the book.","Breakthrough dose is usually about one-sixth of total daily opioid.","Continue gabapentin and simple analgesia if safe."],"m":"Replace the buprenorphine baseline with equivalent long-acting morphine plus breakthrough opioid."},{"q":"A 35-year-old man with a chronic history of intravenous heroin use and schizophrenia presents to the emergency department with a perforated duodenal ulcer. He is septic, coagulopathic and haemodynamically unstable, so is rushed to theatre for resuscitation and an emergency laparotomy.<br><br><strong>What is the most appropriate analgesic regimen to manage his postoperative pain?</strong>","o":["Thoracic epidural with plain bupivacaine","Intravenous methadone and ketamine infusion","Oral methadone and intravenous morphine as required","Intravenous methadone and intravenous morphine as required","Morphine patient controlled analgesia with a background infusion"],"a":4,"e":"A morphine PCA with a background infusion provides both analgesia and continuous opioid receptor stimulation to prevent withdrawal.","w":["Sepsis and coagulopathy contraindicate epidural placement and plain local anaesthetic does not prevent withdrawal.","Ketamine may exacerbate psychosis.","Oral absorption is unreliable after emergency laparotomy.","IV methadone conversion from street heroin is unpredictable.","CORRECT"],"p":["Opioid-dependent patients need baseline opioid replacement plus extra analgesia.","Avoid abrupt withdrawal.","PCA background infusions are appropriate only in opioid-tolerant patients.","Involve acute pain and addiction teams early."],"m":"Heroin-dependent postoperative patient: morphine PCA with a background infusion."},{"q":"A 68-year-old woman with advanced breast cancer and poor intravenous access is suffering from intractable bone pain in her distal right femur. A recent MRI scan has confirmed a solitary metastases in her right femur and ruled out a fracture. Management is at a palliative stage and she is currently taking paracetamol, ibuprofen and morphine sulphate.<br><br><strong>What is the most appropriate next step in controlling her pain?</strong>","o":["Internal fixation of femur","Bisphosphonates","Localised external beam radiotherapy","Radioisotope treatment","Gabapentin"],"a":2,"e":"A single painful bony metastasis without fracture is best treated with targeted external-beam radiotherapy.","w":["Fixation is reserved for pathological fracture or major structural risk.","Bisphosphonates are more useful for multifocal disease.","CORRECT","Radioisotopes are more appropriate for multiple metastases.","There is no neuropathic pain feature requiring gabapentin."],"p":["Local radiotherapy relieves pain in most patients.","Benefit develops over several weeks.","Use fixation for actual or impending pathological fracture.","Radioisotopes are for widespread skeletal disease."],"m":"Solitary painful bone metastasis without fracture: local external-beam radiotherapy."},{"q":"A 75-year-old woman with metastatic breast cancer is currently on 70 mg MST twice a day and 20 mg of Oramorph 4-hourly for breakthrough pain. She continues to suffer from back pain. An MRI excludes any cord compression but confirms the presence of vertebral bone deposits.<br><br><strong>What is next best step in treating her pain?</strong>","o":["Converting the patient to oxycodone","Start calcitonin","Increase the dose of MST","Radiotherapy","Start bisphosphonates"],"a":3,"e":"Her pain is from localised vertebral metastases and remains uncontrolled despite substantial opioid doses. Radiotherapy is the most effective targeted treatment.","w":["Opioid rotation may help tolerance but is not the best targeted step.","Calcitonin lacks evidence.","Further morphine is unlikely to control the metastatic pain adequately.","CORRECT","Bisphosphonates offer only modest pain benefit and are slower."],"p":["Always exclude spinal cord compression first.","Radiotherapy is effective for painful vertebral metastases.","Do not simply escalate opioids indefinitely.","Bisphosphonates reduce skeletal events but provide modest analgesia."],"m":"Painful vertebral metastases without cord compression: radiotherapy."},{"q":"A 22-year-old man is brought into a district general emergency department after being pulled from a burning house with 35% body surface area burns. They include partial thickness facial and anterior chest wall burns. He has a hoarse voice with carbonaceous sputum. His GCS is 15 and other observations are: heart rate 98 beats per minute, blood pressure 169/82 mmHg, respiratory rate 25 breaths per minute, saturations 100% on high flow oxygen and temperature 38.0°C. There are no other injuries.<br><br><strong>What is the most appropriate immediate course of action?</strong>","o":["Perform a modified rapid sequence induction with alfentanil, propofol and rocuronium and intubate with a size 8.0 cuffed oral tracheal tube cut to 24 cm to reduce dead space","Perform a rapid sequence induction with thiopentone and suxamethonium using an uncut size 8.0 cuffed oral tracheal tube","Refer and transfer to regional burns centre without delay for definitive treatment","Give 200 mg hydrocortisone intravenously","Give 1.5 g ceftriaxone intravenously"],"a":1,"e":"Hoarseness and carbonaceous sputum indicate impending inhalational-airway oedema. Intubate early using a large uncut tube; suxamethonium is safe within the first 24 hours after burns.","w":["Cutting the tube risks later displacement as facial swelling develops.","CORRECT","Transfer without securing the airway is unsafe.","Steroids do not prevent burn-airway oedema.","Prophylactic antibiotics are not indicated."],"p":["Intubate before oedema makes the airway difficult.","Use a large uncut oral tube.","Suxamethonium is safe within 24 hours of a burn.","Avoid routine prophylactic steroids and antibiotics."],"m":"Burns with hoarseness and carbonaceous sputum: early RSI and uncut large tube."},{"q":"One of the high dependency unit nurses calls you to review a 73-year-old woman 72 hours post-carotid endarterectomy. The patient appears confused, agitated and her blood pressure is 210/100 mmHg. The nurse administered 1 g of oral paracetamol for a persistent headache 1 hour ago after which the patient vomited.<br><br><strong>What is the next most appropriate step in the management of her condition?</strong>","o":["Administer a broad spectrum intravenous antibiotic","Administer 50 mL of 20% mannitol","Catheterise the patient","Administer a stat dose of oral amlodipine 10 mg","Administer a bolus dose of intravenous labetalol 10 mg"],"a":4,"e":"This is cerebral hyperperfusion syndrome after carotid endarterectomy. Rapid controlled reduction of blood pressure with IV labetalol is required.","w":["There is no evidence of infection.","Mannitol is not the definitive treatment in a conscious patient.","Urinary retention does not explain the severe hypertension and headache.","Oral amlodipine is too slow.","CORRECT"],"p":["Hyperperfusion syndrome usually occurs 2–7 days after CEA.","Features: headache, hypertension, confusion, seizures or focal deficit.","Mortality is high if untreated.","Treat rapidly with IV antihypertensive therapy."],"m":"Headache, confusion and severe hypertension after CEA = cerebral hyperperfusion syndrome; give IV labetalol."},{"q":"A 38-year-old man scheduled to have a revision of his arteriovenous fistula in the next 8 weeks is being assessed in the anaesthetic pre-assessment clinic. He suffers from chronic kidney disease and is on dialysis. His recent blood count shows a haemoglobin of 68 g/L with a low reticulocyte but a normocytic mean corpuscular volume.<br><br><strong>The most appropriate preoperative strategy for treating this patient's anaemia is:</strong>","o":["Blood transfusion","Human erythropoietin","Perioperative blood transfusion","Folic acid injections","Vitamin B12 injections"],"a":1,"e":"Normocytic anaemia with a low reticulocyte count in chronic kidney disease reflects erythropoietin deficiency. Recombinant EPO is the appropriate preoperative treatment.","w":["Transfusion is not first-line when there is time to optimise.","CORRECT","Waiting until surgery loses the opportunity for optimisation.","Folate deficiency causes macrocytosis.","B12 deficiency causes macrocytosis."],"p":["CKD anaemia is usually normocytic and hypoproliferative.","Treat iron deficiency before or alongside EPO.","EPO requires several weeks to raise haemoglobin.","Avoid unnecessary transfusion in transplant candidates."],"m":"CKD + low reticulocytes + normocytic anaemia = treat with erythropoietin."},{"q":"A 34-year-old parturient had epidural analgesia for a full-term normal delivery. 4 days later, she complains of constant severe back pain along with paraesthesia in her left leg. On examination she is febrile and has a motor power of 4/5 in both of her legs and normal power in her upper limbs.<br><br><strong>The immediate investigation of choice would be:</strong>","o":["Lumbar puncture","MRI lumbar spine","MRI whole spine","C-reactive protein","Erythrocyte sedimentation rate"],"a":2,"e":"Fever, back pain and neurological deficit after epidural suggest spinal epidural abscess. Gadolinium MRI of the whole spine is required because the abscess may extend beyond the insertion level.","w":["Lumbar puncture may spread infection and is not diagnostic.","Lumbar MRI may miss a more proximal collection.","CORRECT","CRP supports inflammation but cannot localise compression.","ESR is sensitive but not definitive."],"p":["Classic triad: back pain, fever and neurological deficit.","MRI with gadolinium is the investigation of choice.","Image the whole spine.","Urgent neurosurgical and infectious-disease management is required."],"m":"Suspected epidural abscess after neuraxial block: urgent MRI of the whole spine."},{"q":"You are reviewing a study that randomised two groups of patients to receive sedation either at the discretion of the caregivers or by following a strict protocol. The study hypothesis is that protocolisation reduces the total cumulative dose of sedative medications.<br><br><strong>Which of the following statistical tests would be most appropriate to analyse the results of this pilot study?</strong>","o":["Unpaired Student's t-test","Paired Student's t-test","Chi Squared test","Mann-Whitney U test","Paired ANOVA"],"a":3,"e":"The outcome is continuous, the two groups are independent, and a pilot study cannot safely assume normal distribution. Mann–Whitney U is appropriate.","w":["Unpaired t-test requires normally distributed data.","The groups are not paired.","Chi-squared is for categorical data.","CORRECT","ANOVA is inappropriate for two independent groups and is paired here."],"p":["Two independent groups = unpaired analysis.","Non-normal continuous data = non-parametric test.","Mann–Whitney U compares two independent groups.","Wilcoxon signed-rank is for paired non-parametric data."],"m":"Two independent groups with non-parametric continuous data: Mann–Whitney U test."}],"10":[{"q":"A 36-year-old man requires trans-sphenoidal surgery for a large anterior pituitary tumour with suprasellar extension.<br><br><strong>Prior to induction, which of the following are you most likely to need to prepare?</strong>","o":["Fibreoptic scope","Lumbar drain","Invasive arterial blood pressure monitoring","Intravenous insulin administration","Postoperative ventilation"],"a":2,"e":"Invasive arterial pressure monitoring is routinely required for trans-sphenoidal surgery because rapid blood loss and deliberate blood-pressure manipulation may occur.","w":["Fibreoptic intubation is needed only if the airway is difficult.","A lumbar drain may be required for selected suprasellar extension, but not routinely.","CORRECT","Insulin is needed only if there is diabetes or severe hyperglycaemia.","Postoperative ventilation is not routinely required."],"p":["The cavernous sinus contains the internal carotid arteries.","Rapid haemorrhage is possible.","Blood pressure may need tight manipulation.","Arterial monitoring is routinely indicated."],"m":"Trans-sphenoidal pituitary surgery requires invasive arterial blood-pressure monitoring."},{"q":"A 20-year-old male trauma patient has arrived in the emergency department who had flaccid paralysis of both lower limbs before being intubated at scene for transfer. A full body CT scan revealed a complex vertebral fracture of T5 with a retropulsed fragment and an undisplaced sacral fracture. Despite 2 litres of fluid resuscitation his blood pressure remains 80/40 mmHg with a heart rate of 69 beats per minute.<br><br><strong>Which of the following is the most likely reason for his fluid resistant hypotension?</strong>","o":["Spinal shock","Tension pneumothorax","Haemorrhage","Pulmonary embolus","Neurogenic shock"],"a":4,"e":"A high thoracic cord injury interrupts sympathetic pathways, causing vasodilatation, hypotension and relative bradycardia—neurogenic shock.","w":["Spinal shock describes areflexia and flaccidity below the lesion, not the haemodynamic cause.","CT did not show pneumothorax and the heart rate pattern is atypical.","Haemorrhage usually causes tachycardia.","PE is unlikely this early.","CORRECT"],"p":["Neurogenic shock follows high spinal injury.","Features: hypotension, bradycardia and warm peripheries.","Spinal shock is neurological areflexia.","Treat with fluids plus vasopressors."],"m":"High thoracic cord injury + hypotension + relative bradycardia = neurogenic shock."},{"q":"You are asked to anaesthetise a 68-year-old man for rigid bronchoscopy for biopsy of a posterior tracheal mass. He has normal mouth opening and neck extension.<br><br><strong>Which of the following is the most appropriate anaesthetic technique?</strong>","o":["Spontaneous ventilation with lidocaine topicalisation of the airway and sedation with intravenous midazolam","Inhalational induction and maintenance of deep anaesthesia with sevoflurane and oxygen via a facemask removed when the bronchoscope is inserted","Intravenous induction with propofol and atracurium. Oxygen and sevoflurane maintenance with IPPV via a microlaryngeal tube","Intravenous induction with propofol and atracurium followed by low frequency jet ventilation via the bronchoscope. Maintenance with propofol and remifentanil TCI","Placement of cricothyroid cannula followed by anaesthesia with propofol and remifentanil TCI. Jet ventilation via the cricothyroid cannula"],"a":3,"e":"Rigid bronchoscopy requires GA, paralysis, unobstructed surgical access and TIVA. Low-freque
