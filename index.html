ncy jet ventilation through the bronchoscope is the best option.","w":["Sedation is inadequate for rigid bronchoscopy.","Removing the mask risks awareness and hypoxia.","A microlaryngeal tube may obstruct access to the posterior tracheal lesion.","CORRECT","Cricothyroid jet ventilation is unnecessary with a straightforward airway."],"p":["Rigid bronchoscopy is highly stimulating.","Volatile agents cannot be reliably delivered through the bronchoscope.","Jet ventilation risks gas trapping and barotrauma.","TIVA with propofol/remifentanil is appropriate."],"m":"Rigid bronchoscopy for a tracheal mass: TIVA + paralysis + low-frequency jet ventilation."},{"q":"A 33-year-old man is extracted from a house fire and admitted to the emergency department. He cannot remember being rescued and on examination has singed nasal hair, burns across his neck and productive carbonaceous sputum. He is receiving high flow oxygen through a non-rebreathing mask and is not in respiratory distress.<br><br><strong>Which investigation will be most useful in assessing and managing his upper airway?</strong>","o":["Pulse oximetry","Chest X-ray","Computed tomography","Arterial blood gas","Flexible bronchoscopy"],"a":4,"e":"Flexible bronchoscopy directly visualises oedema, soot, ulceration and necrosis, permits suctioning and can guide intubation.","w":["Pulse oximetry may be falsely reassuring with carbon monoxide poisoning.","Chest X-ray is insensitive early.","CT cannot treat or directly inspect the airway.","ABG assesses gas exchange but not upper-airway injury.","CORRECT"],"p":["Bronchoscopy is the gold standard for early inhalational-airway assessment.","Airway oedema often peaks around 24 hours.","Carbonaceous sputum and neck burns are high-risk signs.","Intubate early if airway compromise is likely."],"m":"Suspected smoke-inhalation airway injury: flexible bronchoscopy is the key investigation."},{"q":"A previously well 9-year-old boy is having a laparoscopic appendicectomy. Anaesthesia was induced uneventfully with thiopentone and suxamethonium, followed by a sevoflurane/oxygen mix. Ten minutes after port insertion his airway pressures increase and oxygen saturations begin to fall. Despite adjusted ventilation, ETCO₂ reaches 9.0 kPa. Heart rate rises to 180 beats per minute and temperature to 40°C.<br><br><strong>Which action will ameliorate the situation most definitively?</strong>","o":["Hyperventilation with 100% oxygen","Cooling the patient","Switching maintenance to propofol","Treating hyperkalaemia","Dantrolene 1–10 mg/kg"],"a":4,"e":"This is malignant hyperthermia. Dantrolene is the only specific antidote and is therefore the definitive treatment.","w":["100% oxygen and hyperventilation are essential supportive measures.","Cooling treats hyperthermia but not the underlying process.","Stopping volatile anaesthesia is essential but not definitive.","Hyperkalaemia treatment is supportive.","CORRECT"],"p":["Early sign: unexplained rapid ETCO₂ rise.","Stop all triggering agents.","Give dantrolene promptly and repeat as required.","Treat acidosis, hyperkalaemia and hyperthermia."],"m":"Malignant hyperthermia is definitively treated with dantrolene."},{"q":"A 53-year-old man presents for a laparoscopic gastric bypass procedure. He has a BMI of 46 kg/m² and is an ex-smoker. He has obstructive sleep apnoea but does not use CPAP. He has severe reflux and a neck circumference of 46 cm; Mallampati score is 1 with good mouth opening.<br><br><strong>The most appropriate anaesthetic plan includes:</strong>","o":["Ramped head-up position, preoxygenation, RSI with suxamethonium and cricoid pressure. ITU postoperatively","Ramped head-up position, preoxygenation, RSI with rocuronium and cricoid pressure. HDU postoperatively","Ramped head-up position, preoxygenation, RSI with suxamethonium and cricoid pressure. HDU postoperatively","Awake fibreoptic intubation. Ward postoperative care","Ramped head-up position, preoxygenation, standard induction"],"a":2,"e":"Severe reflux warrants RSI. Ramped positioning improves preoxygenation and laryngoscopy, while untreated OSA requires at least HDU care.","w":["Routine ITU admission is unnecessary if uncomplicated.","The book prefers suxamethonium for this RSI scenario.","CORRECT","Awake fibreoptic intubation is not indicated with a reassuring airway assessment, and ward care is inadequate.","Standard induction is unsafe with severe reflux."],"p":["Align the tragus with the sternal notch.","Obesity alone does not equal difficult laryngoscopy.","Bariatric surgery carries aspiration risk.","Untreated OSA needs enhanced postoperative monitoring."],"m":"Bariatric patient with reflux and OSA: ramped RSI with suxamethonium and HDU care."},{"q":"A 62-year-old woman who presented for a laparoscopic cholecystectomy experienced an unanticipated difficult intubation. An endotracheal tube was eventually correctly sited following multiple attempts and use of an intubating stylet. The following day she is febrile with cervical surgical emphysema and complains of neck stiffness and dysphagia.<br><br><strong>What is the most likely cause of her symptoms?</strong>","o":["Oesophageal perforation","Uvular necrosis","Tracheal rupture","Arytenoid dislocation","Aspiration pneumonia"],"a":0,"e":"Fever, dysphagia, neck pain and cervical emphysema after traumatic intubation strongly suggest oesophageal perforation with developing mediastinal infection.","w":["CORRECT","Uvular necrosis causes sore throat and foreign-body sensation, not emphysema.","Tracheal rupture causes emphysema but fever and dysphagia favour oesophageal injury.","Arytenoid dislocation causes hoarseness or stridor.","Aspiration pneumonia does not cause cervical emphysema."],"p":["Oesophageal perforation can cause mediastinitis.","Risk rises with difficult repeated instrumentation.","Keep nil by mouth and start IV antibiotics.","Urgent imaging and surgical review are required."],"m":"Fever + dysphagia + cervical emphysema after difficult intubation = oesophageal perforation."},{"q":"A cardiac arrest call brings you to a 78-year-old man admitted to coronary care following urgent PCI for inferior myocardial infarction. The nurses administered a total of 3 mg atropine five minutes ago for bradycardia. He now has BP 80/40 mmHg, heart rate 35 beats per minute regular, but is alert.<br><br><strong>What is the next appropriate step?</strong>","o":["Administer 500 μg atropine","Start a dopamine infusion","Urgent transvenous electrical pacing","Start an adrenaline infusion","Give 250 mL colloid"],"a":3,"e":"Atropine has failed at the maximum dose. In hypotensive symptomatic bradycardia, an adrenaline infusion is the most appropriate immediate second-line treatment while pacing is arranged.","w":["The maximum atropine dose has already been given.","Dopamine is an alternative but adrenaline is better for hypotension.","Transvenous pacing is definitive but may not be immediately available.","CORRECT","Fluid may support preload but will not correct complete heart block."],"p":["Inferior MI commonly causes AV block.","After atropine failure, use adrenaline or isoprenaline.","Prepare for transcutaneous/transvenous pacing.","Treat adverse features urgently."],"m":"Symptomatic bradycardia after 3 mg atropine: start an adrenaline infusion."},{"q":"A 17-year-old girl presents for surgical correction of spinal scoliosis. She has dysmenorrhoea and menorrhagia for which she takes oral iron, and is otherwise fit. Haemoglobin is 101 g/L. The surgeon uses spinal cord monitoring.<br><br><strong>Along with two large-bore peripheral cannulae, which is the most appropriate anaesthetic technique?</strong>","o":["Volatile with remifentanil TCI; internal jugular line, radial arterial line and tranexamic acid","Radial arterial line; propofol and remifentanil TCI; cell salvage and tranexamic acid","Volatile with nitrous oxide; radial arterial line, cell salvage and tranexamic acid","Propofol and remifentanil TCI; radial arterial line, femoral central line and cell salvage","Propofol TCI with fentanyl boluses; radial arterial and internal jugular lines; tranexamic acid"],"a":1,"e":"TIVA preserves motor-evoked potentials. Arterial monitoring, cell salvage and tranexamic acid address the major bleeding risk.","w":["Volatile agents impair MEP monitoring.","CORRECT","Volatile and nitrous oxide impair monitoring.","A femoral central line is unnecessary and inconvenient prone.","Cell salvage is omitted despite pre-existing anaemia and major blood-loss risk."],"p":["MEPs require TIVA and avoidance of deep neuromuscular blockade.","Use cell salvage in major scoliosis surgery.","Tranexamic acid reduces blood loss.","Protect eyes and pressure points meticulously."],"m":"Scoliosis with cord monitoring: propofol-remifentanil TIVA + arterial line + cell salvage + tranexamic acid."},{"q":"A 75-year-old man with significant co-morbidities is admitted for elective foot surgery under an ultrasound-guided ankle block.<br><br><strong>To minimise waiting time for the block to become adequate, which nerve should be blocked first?</strong>","o":["Superficial peroneal nerve","Deep peroneal nerve","Sural nerve","Saphenous nerve","Tibial nerve"],"a":4,"e":"The tibial nerve is the largest and deepest nerve of the ankle block and may take up to 20 minutes to become effective, so it should be blocked first.","w":["This is a superficial nerve and acts faster.","This deep nerve is smaller than the tibial nerve.","Sural block is superficial.","Saphenous block is superficial.","CORRECT"],"p":["Ankle block requires five nerves.","Tibial and deep peroneal nerves are deep.","Tibial nerve supplies the sole and heel.","Start with the slowest-developing block."],"m":"Start an ankle block with the tibial nerve."},{"q":"You are asked to transfer a 27-year-old man to the neurosurgical centre with an acute traumatic subdural haematoma. He is asleep but rousable to voice, has slurred speech, obeys commands and continues to vomit despite antiemetics.<br><br><strong>What is the most appropriate next step before transfer?</strong>","o":["Perform an arterial blood gas","Repeat CT scan","Rapid sequence induction","Administer mannitol 20% 0.5 g/kg","Cool the patient"],"a":2,"e":"Neurological deterioration and persistent vomiting make transfer without airway protection unsafe. RSI secures the airway and permits controlled ventilation.","w":["An ABG will not make the transfer safe.","Repeat imaging delays definitive neurosurgery.","CORRECT","Mannitol is reserved for impending herniation.","Therapeutic cooling is not indicated."],"p":["Intubate if airway protection is doubtful.","Avoid hypoxia and hypotension during transfer.","Target PaCO₂ around 4.0–5.0 kPa.","Do not delay neurosurgical transfer for repeat CT without a new indication."],"m":"Deteriorating head injury with ongoing vomiting: RSI before transfer."},{"q":"A 42-year-old man presents after an out-of-hospital ventricular fibrillation arrest. He was defibrillated successfully after 20 minutes of CPR. Blood pressure is 120/76 mmHg without support and he is coughing on the endotracheal tube. ECG shows no ischaemia.<br><br><strong>What action is likely to be most beneficial?</strong>","o":["Administer antiplatelet therapy via NG tube","Urgent coronary angiogram","Urgent transthoracic echocardiogram","CT pulmonary angiogram","Targeted temperature management for 24 hours"],"a":4,"e":"Targeted temperature management and prevention of fever improve neurological outcome after out-of-hospital cardiac arrest.","w":["No ECG ischaemia makes empirical antiplatelet therapy less compelling.","Angiography may be considered but is not the most universally beneficial action here.","Echo is useful diagnostically but does not itself improve outcome.","CTPA is diagnosis-specific.","CORRECT"],"p":["Avoid fever after cardiac arrest.","Use controlled temperature management for about 24 hours.","Sedate and prevent shivering.","Delay neurological prognostication until confounders resolve."],"m":"After ROSC from VF arrest, targeted temperature management is the most beneficial listed intervention."},{"q":"A 59-year-old woman is on HDU eight hours after bowel resection. She weighs 60 kg, has type 2 diabetes and baseline creatinine 120 μmol/L. Urine output has fallen from 40 to 10 mL/hour for two hours despite normal blood pressure. Creatinine is now 180 μmol/L.<br><br><strong>Which risk factor is most significant?</strong>","o":["Chronic renal impairment preoperatively","Major intra-abdominal surgery","Oliguria","Serum creatinine rise","Diabetes"],"a":3,"e":"A 1.5-fold creatinine increase meets stage-1 AKI criteria and is the most evidence-based marker of current renal injury.","w":["Pre-existing CKD increases risk but does not define the new AKI.","Major surgery is a risk factor only.","Two hours of oliguria does not yet meet the six-hour criterion.","CORRECT","Diabetes increases risk but is less important than established AKI."],"p":["AKI may be diagnosed by creatinine or urine output.","Stage 1 includes creatinine ≥1.5 times baseline.","Even small rises increase mortality.","Act early to prevent progression."],"m":"A rise from 120 to 180 μmol/L is a 1.5-fold increase and defines stage-1 AKI."},{"q":"A 72-year-old man is reviewed two days after emergency laparotomy. SpO₂ is 94% on FiO₂ 0.60, RR 28, with bibasal crepitations. BP 100/60 mmHg, HR 110, JVP 6 cm, urine output 10 mL/hour for six hours and he is agitated.<br><br><strong>What is the next appropriate course of action?</strong>","o":["Urgent renal blood tests","CPAP support in HDU","Fluid 5–10 mL/kg and reassess","Admit to ICU for haemofiltration","IV furosemide 40 mg and diamorphine 2.5 mg"],"a":4,"e":"He has acute pulmonary oedema with raised JVP and end-organ compromise. Rapid preload reduction with furosemide and diamorphine is the fastest practical treatment listed.","w":["Investigations should not delay treatment.","CPAP may help but preload reduction is immediately available.","More fluid may worsen pulmonary oedema.","Haemofiltration is too invasive as the first step.","CORRECT"],"p":["Sit the patient upright and give oxygen.","Loop diuretics produce early venodilatation.","Opioids reduce sympathetic drive and preload.","Investigate precipitating ischaemia or arrhythmia."],"m":"Pulmonary oedema with raised JVP: reduce preload urgently with IV furosemide and diamorphine."},{"q":"The intensive care unit dietician suggests commencement of enteral nutrition on a 67-year-old patient.<br><br><strong>Which represents an absolute contraindication to starting enteral nutrition?</strong>","o":["Ischaemic bowel","Small bowel anastomosis","Short gut syndrome","Paralytic ileus","Pancreatitis"],"a":0,"e":"Enteral feeding may worsen gut ischaemia and risks necrosis or perforation. Suspected or proven ischaemic bowel is an absolute contraindication.","w":["CORRECT","A stable anastomosis does not prevent early feeding.","Short gut may require combined enteral and parenteral nutrition.","Low-rate feeding may still be attempted in ileus with vigilance.","Enteral feeding is recommended in pancreatitis."],"p":["Use enteral nutrition when the gut is accessible and perfused.","Bowel ischaemia is the key contraindication.","Pancreatitis is not a contraindication.","Early enteral feeding reduces infectious complications."],"m":"Do not start enteral feeding in ischaemic bowel."},{"q":"A 52-year-old hypertensive woman presents with sudden severe headache, photophobia and confusion. GCS declines to 7/15 with no focal neurology. CT shows extensive subarachnoid blood.<br><br><strong>According to the World Federation of Neurological Surgeons Scale, her clinical grade is:</strong>","o":["I","II","III","IV","V"],"a":3,"e":"WFNS grade IV corresponds to GCS 7–12, with or without a motor deficit.","w":["Grade I requires GCS 15.","Grade II is GCS 13–14 without deficit.","Grade III is GCS 13–14 with deficit.","CORRECT","Grade V is GCS 3–6."],"p":["WFNS uses GCS and motor deficit.","Grade IV: GCS 7–12.","Grade V: GCS 3–6.","Higher grade predicts higher mortality."],"m":"GCS 7 after SAH = WFNS grade IV."},{"q":"A 38-year-old woman presents for category 2 Caesarean section for breech presentation. She has skin dimpling and a patch of hair at the base of the spine and was told she was born with an abnormal spinal cord, but has no records.<br><br><strong>What is the best management for delivery?</strong>","o":["Urgent MRI then spinal if an unaffected level exists","Spinal without MRI","Epidural without MRI","General anaesthesia","Request vaginal delivery"],"a":3,"e":"Possible occult spinal dysraphism makes neuraxial spread and cord location unpredictable. With no time for imaging, general anaesthesia is safest.","w":["Urgent MRI is impractical while contracting.","Neuraxial puncture may damage an abnormally low cord.","Epidural spread may be unpredictable.","CORRECT","Breech delivery should not be forced solely to avoid anaesthesia."],"p":["Skin dimpling and hair may indicate spina bifida occulta.","Avoid neuraxial techniques without imaging.","Perform a full difficult-airway assessment.","Explain the risks and reasoning clearly."],"m":"Suspected spinal dysraphism without imaging: use general anaesthesia for Caesarean section."},{"q":"An 11-year-old boy has been hit by a car. He has SpO₂ 94% on 15 L oxygen, reduced left air entry, HR 158, BP 88/32 and capillary refill 4 seconds. He does not open his eyes or speak and withdraws to pain. Chest X-ray shows left consolidation but no pneumothorax or haemothorax.<br><br><strong>The next immediate step should be:</strong>","o":["Rapid sequence induction and intubation","Urgent CT head, chest and abdomen","Peritoneal lavage","Rapid transfusion of 20 mL/kg O-negative packed red cells","FAST scan"],"a":0,"e":"His GCS is 6 and oxygenation is inadequate despite high-flow oxygen. Airway protection and controlled ventilation come first.","w":["CORRECT","CT follows airway and circulation stabilisation.","Peritoneal lavage is obsolete and not the first priority.","Blood is likely required, but airway comes first.","FAST follows initial airway management."],"p":["Paediatric trauma follows ABC priorities.","GCS <8 requires intubation.","Prevent secondary brain injury from hypoxia and hypotension.","Continue haemorrhage resuscitation immediately after airway control."],"m":"Paediatric trauma with GCS 6: secure the airway first."},{"q":"A fit and well 7-month-old 6 kg boy is scheduled for elective inguinal hernia repair. Bruises of different ages are found on the arms, legs, back and buttocks.<br><br><strong>What is the most appropriate action?</strong>","o":["Urgent coagulation screen","Ask the parents to explain","Discuss with the hospital child protection team","Ask the surgeons to follow-up","Document only"],"a":2,"e":"Multiple bruises of different ages in a non-mobile infant, especially on the back and buttocks, strongly suggest non-accidental injury and require immediate safeguarding referral.","w":["Coagulation tests may be needed later but do not replace safeguarding action.","Direct confrontation with parents is inappropriate before specialist advice.","CORRECT","Responsibility should not be transferred without formal referral.","Documentation is essential but insufficient alone."],"p":["Unusual bruising in a non-mobile infant is a red flag.","Follow local safeguarding policy.","Document location, size and colour objectively.","Involve the designated child-protection team promptly."],"m":"Multiple unexplained bruises in a non-mobile infant require immediate child-protection referral."},{"q":"A 19 kg 3-year-old boy is scheduled for elective dental treatment under GA. After inhalational induction, four attempts at IV cannulation fail. He remains anaesthetised with oxygen and sevoflurane, breathing spontaneously by facemask.<br><br><strong>The most appropriate next step is:</strong>","o":["Continue attempts until successful","Deepen anaesthesia and secure the airway first","Ask another colleague to attempt IV access","Wake and postpone","Insert an intra-osseous needle"],"a":2,"e":"After repeated failed attempts, a fresh experienced colleague should try before escalating to invasive access or airway instrumentation without IV access.","w":["Repeated attempts by the same operator cause delay and trauma.","Securing the airway without IV access risks unmanageable laryngospasm.","CORRECT","Postponement is premature.","Intraosseous access is excessive in a stable elective child."],"p":["Limit repeated cannulation attempts.","Use ultrasound if available.","A fresh pair of hands often succeeds.","Avoid airway instrumentation without IV access when possible."],"m":"After repeated failed paediatric cannulation, ask a more experienced colleague."},{"q":"A 61-year-old man has long-term low back pain. MRI one year ago shows degenerative changes without nerve-root compression. Simple analgesics, NSAIDs, weak opioids and injections have failed.<br><br><strong>What is the most appropriate next step?</strong>","o":["Add gabapentin","Repeat MRI","Refer for surgery","Refer to a pain management programme","Offer TENS"],"a":3,"e":"Persistent non-specific back pain without surgical pathology is best managed through a multidisciplinary pain programme focused on function and coping.","w":["Gabapentin is not effective for simple nociceptive back pain.","Repeat imaging is unnecessary without new red flags.","There is no surgical target.","CORRECT","TENS lacks convincing evidence."],"p":["Pain programmes combine education, exercise and psychological strategies.","The goal is improved function, not necessarily zero pain.","Avoid repeated imaging without new symptoms.","Avoid escalating opioids."],"m":"Chronic non-specific back pain after failed treatments: refer to a pain management programme."},{"q":"A 26-year-old woman has a 5-year history of generalised pain, stiffness and poor sleep. Serious causes have been excluded and she has fibromyalgia.<br><br><strong>Which statement applies?</strong>","o":["Rheumatoid arthritis co-exists in 10%","Incidence decreases with age","Complete resolution is expected","Pharmacological therapy should be avoided","Serotonin is increased in most patients"],"a":3,"e":"Management should focus on multidisciplinary non-pharmacological strategies. Long-term pharmacological treatment, especially strong opioids, should be avoided.","w":["Rheumatoid arthritis co-exists in about 25%, not 10%.","Incidence increases with age.","Complete resolution is uncommon.","CORRECT","Serotonin and noradrenaline tend to be decreased."],"p":["Fibromyalgia is a chronic widespread pain syndrome.","Exercise and CBT are core treatments.","Medication may have a short-term adjunctive role.","Avoid strong opioids."],"m":"Fibromyalgia is managed mainly non-pharmacologically; avoid long-term drug escalation."},{"q":"A 64-year-old asthmatic man has severe burns to the upper left arm and abdomen. The arm wounds extend to the shoulder and have foul purulent discharge. Surgeons plan debridement.<br><br><strong>The most appropriate postoperative analgesia is:</strong>","o":["Left interscalene block","Paracetamol and ibuprofen","Left axillary block","Intraoperative opioids and postoperative PCA","Left supraclavicular block"],"a":3,"e":"Regional blocks are inappropriate through or near infected tissue and would not treat abdominal pain. Systemic opioid analgesia with PCA covers both sites.","w":["Interscalene block is near infected tissue and misses abdominal pain.","NSAIDs are less suitable in asthma and major burns.","Axillary block misses shoulder and abdominal pain.","CORRECT","Supraclavicular block is near infection and misses abdominal pain."],"p":["Burn pain includes background and breakthrough components.","Infection may contraindicate regional techniques.","PCA permits repeated titration.","Use multimodal analgesia where safe."],"m":"Infected multi-site burns: use systemic opioid analgesia with PCA."},{"q":"A 3-week-old neonate is to have a hernia repair under GA with caudal analgesia. His parents ask about alternatives to the caudal block.<br><br><strong>Which would be an appropriate alternative?</strong>","o":["IV paracetamol and codeine","IV morphine intraoperatively","Paracetamol, ibuprofen and codeine","Ibuprofen, morphine and local infiltration","Paracetamol, local infiltration and titrated morphine"],"a":4,"e":"Neonatal analgesia can safely combine paracetamol, surgeon local-anaesthetic infiltration and carefully titrated morphine with postoperative monitoring.","w":["This omits local analgesia and codeine may be unpredictable.","Morphine alone is inadequate multimodal care.","NSAIDs are generally avoided in neonates.","NSAIDs make this option inappropriate.","CORRECT"],"p":["Use multimodal analgesia in neonates.","Avoid routine NSAIDs.","Morphine doses must be reduced and titrated.","Monitor for apnoea and respiratory depression."],"m":"Neonatal hernia alternative to caudal: paracetamol + wound infiltration + titrated morphine."},{"q":"A 42-year-old man with obstructive sleep apnoea and sickle cell disease presents with an acutely painful crisis. Previous admissions required large frequent opioid doses. He regularly takes paracetamol and ibuprofen.<br><br><strong>Which is the most appropriate analgesia?</strong>","o":["Morphine PCA","Pethidine","Codeine","Fentanyl PCA","Tramadol"],"a":3,"e":"He requires a potent titratable opioid, but OSA makes morphine less attractive. Fentanyl PCA provides strong analgesia with less histamine release and shorter action.","w":["Morphine may cause more prolonged respiratory depression in OSA.","Pethidine should be avoided because norpethidine can cause seizures.","Codeine is too weak.","CORRECT","Tramadol is too weak for a severe recurrent crisis."],"p":["Give analgesia within 30 minutes.","Continue paracetamol and NSAID if safe.","Avoid pethidine in sickle crisis.","Monitor closely because OSA increases opioid risk."],"m":"Sickle crisis with OSA and high opioid needs: fentanyl PCA."},{"q":"A 78-year-old woman with a Crawford type IV aortic aneurysm is to undergo endovascular repair using a fenestrated graft.<br><br><strong>Which arterial-line site is most appropriate?</strong>","o":["Right radial artery","Left radial artery","Right dorsalis pedis","Left dorsalis pedis","Right femoral artery"],"a":1,"e":"Right upper-limb access is often needed for guidewires and femoral/pedal arteries may be used by the graft team, leaving the left radial artery as the practical monitoring site.","w":["Right radial access may be required for the procedure.","CORRECT","Pedal pressures may be unreliable and access may be compromised.","The same limitation applies.","Femoral access is required for graft delivery."],"p":["Fenestrated grafts require multiple arterial access sites.","Plan monitoring around surgical access.","Left radial usually remains free.","Discuss access with the vascular team before cannulation."],"m":"Fenestrated aortic graft: use the left radial artery for monitoring."},{"q":"A 72-year-old man requires unilateral intercostal nerve block for severe fractured-rib pain.<br><br><strong>Where should local anaesthetic be infiltrated for the highest success rate?</strong>","o":["At the angle of the rib","Any point proximal to the mid-axillary line","Medial to the angle of the rib","At the mid-axillary line","Lateral to the angle of the rib"],"a":0,"e":"The angle of the rib offers a wide intercostal space and allows block before the lateral cutaneous branch divides, while reducing pleural risk.","w":["CORRECT","This is broadly true but less precise than the optimal point.","More medial injection risks neuraxial spread.","At the mid-axillary line may miss the lateral cutaneous branch.","Lateral injection also risks incomplete block and pneumothorax."],"p":["Block proximal to the lateral cutaneous branch.","The neurovascular bundle lies beneath the rib.","Walk the needle off the inferior rib margin.","Use 3–5 mL per level after aspiration."],"m":"The optimal intercostal block site is at the angle of the rib."},{"q":"A 60-year-old patient with 5-year myasthenia gravis is scheduled for transcervical thymectomy. He has moderate generalised weakness, higher pyridostigmine requirements and FVC 3.5 L.<br><br><strong>What is the most appropriate postoperative management?</strong>","o":["Extubate and same-day discharge","ICU overnight ventilation","Extubate then monitor in HDU","Extubate with airway exchange catheter","Elective plasma exchange"],"a":2,"e":"His FVC is above the 2.9-L risk threshold and the transcervical approach is less respiratory-stressing than transsternal surgery. Extubation with HDU monitoring is appropriate.","w":["Same-day discharge is unsafe.","Routine ventilation is not required without major risk factors.","CORRECT","An exchange catheter is not routinely needed.","Plasma exchange is reserved for poorly controlled disease or crisis."],"p":["Ventilation risk rises with FVC <2.9 L.","Disease >6 years and chronic lung disease also increase risk.","Transsternal surgery carries greater respiratory risk.","Monitor closely after extubation."],"m":"Myasthenia with FVC 3.5 L after transcervical thymectomy: extubate and observe in HDU."},{"q":"An 83-year-old man is intubated in ICU after laparotomy for perforative peritonitis. On day four his oxygen requirement rises. Chest X-ray shows a positive Luftsichel sign.<br><br><strong>The most likely lung finding is:</strong>","o":["Left upper lobe collapse","Right upper lobe collapse","Right lower lobe collapse","Right middle lobe collapse","Left lower lobe collapse"],"a":0,"e":"The Luftsichel sign is a crescent of aerated left lower lobe between the aortic arch and a collapsed left upper lobe.","w":["CORRECT","Right upper-lobe collapse may show a Golden-S sign.","Right lower-lobe collapse gives a triangular opacity.","Right middle-lobe collapse obscures the right heart border.","Left lower-lobe collapse causes a retrocardiac opacity."],"p":["Luftsichel means “air crescent.”","It is associated with left upper-lobe collapse.","Golden-S sign suggests right upper-lobe collapse with a mass.","Lobar collapse causes characteristic fissure displacement."],"m":"Luftsichel sign = left upper-lobe collapse."},{"q":"You are reviewing a meta-analysis forest plot comparing two antiemetics.<br><br><strong>Which statement is most appropriate?</strong>","o":["All studies are weighted equally","The new drug should automatically enter the PONV algorithm","We can have the most confidence that the results of Butler et al. represent the observed effect","All comparison studies should be included","Sample size alone determines box size"],"a":2,"e":"The study with the narrowest confidence interval provides the most precise estimate. In the plot, Butler et al. has the narrowest interval.","w":["Studies are weighted according to precision/variance.","Clinical adoption also requires safety, cost and applicability.","CORRECT","Only studies meeting predefined inclusion criteria are included.","Box size reflects weight, which depends on variance, not sample size alone."],"p":["Box size represents study weight.","Horizontal line represents confidence interval.","Narrower confidence interval means greater precision.","The diamond represents the pooled effect."],"m":"In a forest plot, the narrowest confidence interval gives the most precise study estimate."}]},L=["A","B","C","D","E"],V="frca300_merged_v1";
let S={type:null,mockId:null,current:0,mode:"all",items:[]};
const $=id=>document.getElementById(id),key=id=>`${V}_${id}`;
function blank(){return{answers:Array(30).fill(null),marked:Array(30).fill(false),current:0}}
function load(id){try{let s=JSON.parse(localStorage.getItem(key(id))||"{}");return{answers:Array.isArray(s.answers)&&s.answers.length===30?s.answers:Array(30).fill(null),marked:Array.isArray(s.marked)&&s.marked.length===30?s.marked:Array(30).fill(false),current:Number.isInteger(s.current)?Math.max(0,Math.min(29,s.current)):0}}catch(e){return blank()}}
function save(id,s){try{localStorage.setItem(key(id),JSON.stringify(s))}catch(e){}}
const attempted=s=>s.answers.filter(x=>x!==null).length;
const correct=(s,id)=>s.answers.reduce((n,x,i)=>n+(x===MOCKS[id][i].a?1:0),0);
const wrong=(s,id)=>s.answers.map((x,i)=>x!==null&&x!==MOCKS[id][i].a?i:-1).filter(i=>i>=0);
const marked=s=>s.marked.map((x,i)=>x?i:-1).filter(i=>i>=0);
function refs(){let a=[];Object.keys(MOCKS).forEach(id=>MOCKS[id].forEach((q,i)=>a.push({mockId:id,index:i,q})));return a}
function dashboard(){let d=0,c=0,m=0;Object.keys(MOCKS).forEach(id=>{let s=load(id);d+=attempted(s);c+=correct(s,id);m+=marked(s).length});$("stats").innerHTML=`<div class=stat><b>${d}/300</b><span>Answered</span></div><div class=stat><b>${c}</b><span>Correct</span></div><div class=stat><b>${d?Math.round(c/d*100):0}%</b><span>Accuracy</span></div><div class=stat><b>${m}</b><span>Marked</span></div>`}
function mocks(){let g=$("mockGrid");g.replaceChildren();Object.keys(MOCKS).forEach(id=>{let s=load(id),d=attempted(s),c=correct(s,id),w=wrong(s,id).length,p=d?Math.round(c/d*100):0,x=document.createElement("article");x.className="mock";x.innerHTML=`<h2>Mock Paper ${id}</h2><p>${d}/30 answered · ${c} correct · ${w} incorrect</p><div class=bar><div class=fill style="width:${d/30*100}%"></div></div><p><strong>${p}% accuracy</strong> · ${marked(s).length} marked</p><div class=mock-actions><button class=primary>Open</button><button class=btn>Incorrect</button></div>`;let b=x.querySelectorAll("button");b[0].onclick=()=>openMock(id,"all");b[1].onclick=()=>openMock(id,"incorrect");g.appendChild(x)})}
function showHome(tab="mocks"){S={type:null,mockId:null,current:0,mode:"all",items:[]};$("quizView").classList.add("hidden");$("homeView").classList.remove("hidden");document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));["mocks","search","random","summary"].forEach(n=>$(n+"Panel").classList.toggle("hidden",n!==tab));dashboard();mocks();if(tab==="summary")renderSummary();scrollTo(0,0)}
function openMock(id,mode="all",specific=null){let s=load(id),items=mode==="incorrect"?wrong(s,id):mode==="marked"?marked(s):[...Array(30).keys()];S={type:"mock",mockId:id,current:specific??(mode==="all"?s.current:(items[0]??0)),mode,items};$("homeView").classList.add("hidden");$("quizView").classList.remove("hidden");$("quizTitle").textContent=`Final FRCA — Mock Paper ${id}`;$("quizSub").textContent="30 questions";$("resetMock").classList.remove("hidden");render();scrollTo(0,0)}
function randomQuiz(n){let a=refs();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S={type:"random",mockId:null,current:0,mode:"random",items:a.slice(0,n).map(x=>({mockId:x.mockId,index:x.index}))};$("homeView").classList.add("hidden");$("quizView").classList.remove("hidden");$("quizTitle").textContent=`Random Quiz — ${n} Questions`;$("quizSub").textContent="Mixed from all 10 Mock Papers";$("resetMock").classList.add("hidden");render();scrollTo(0,0)}
function curList(){if(S.type==="random")return S.items;if(S.mode==="all")return[...Array(30).keys()];return S.items}
function curRef(){if(S.type==="random")return S.items[S.current];return{mockId:S.mockId,index:S.current}}
function render(){ $("finalArea").classList.add("hidden");$("questionArea").classList.remove("hidden");let z=curList();if(!z.length){$("qnum").textContent="Review Mode";$("question").innerHTML='<div class=center><h2>No questions in this list</h2><div class=big>✅</div></div>';$("options").replaceChildren();$("answer").replaceChildren();$("prev").disabled=true;$("next").disabled=true;return}
let ref,pos;if(S.type==="random"){pos=S.current;ref=S.items[pos]}else{if(!z.includes(S.current))S.current=z[0];pos=z.indexOf(S.current);ref={mockId:S.mockId,index:S.current}}
let q=MOCKS[ref.mockId][ref.index],s=load(ref.mockId),sel=s.answers[ref.index];$("qnum").textContent=`Mock ${ref.mockId} — Question ${ref.index+1}`;$("question").innerHTML=q.q;$("mark").textContent=s.marked[ref.index]?"★ Marked":"☆ Mark Question";$("mark").classList.toggle("marked",s.marked[ref.index]);let o=$("options");o.replaceChildren();q.o.forEach((t,j)=>{let b=document.createElement("button");b.className="opt";b.innerHTML=`<span class=letter>${L[j]}</span><span>${t}</span>`;if(sel!==null){b.disabled=true;if(j===q.a)b.classList.add("correct");if(j===sel&&j!==q.a)b.classList.add("wrong")}b.onclick=()=>answer(ref,j);o.appendChild(b)});showAnswer(q,sel);$("prev").disabled=pos===0;$("next").textContent=pos===z.length-1?"Finish":"Next";header(pos,z.length)}
function header(pos,len){let d=0,c=0;if(S.type==="random"){S.items.forEach(r=>{let s=load(r.mockId);if(s.answers[r.index]!==null){d++;if(s.answers[r.index]===MOCKS[r.mockId][r.index].a)c++}});$("counter").textContent=`Question ${pos+1}/${len}`}else{let s=load(S.mockId);d=attempted(s);c=correct(s,S.mockId);$("counter").textContent=S.mode==="all"?`Question ${S.current+1}/30`:`${S.mode==="incorrect"?"Incorrect":"Marked"} ${pos+1}/${len}`} $("score").textContent=`Score ${c}/${d}`;$("mode").textContent=S.type==="random"?"Random Quiz":S.mode==="all"?"All Questions":S.mode==="incorrect"?"Incorrect Review":"Marked Review";$("progress").style.width=(len?(pos+1)/len*100:0)+"%";$("review").classList.toggle("marked",S.mode==="incorrect");$("markedReview").classList.toggle("marked",S.mode==="marked")}
function showAnswer(q,sel){let a=$("answer");a.replaceChildren();if(sel===null)return;let d=document.createElement("div");d.className="answer";d.innerHTML=`<div class=correct-title>✅ Correct answer: ${L[q.a]}. ${q.o[q.a]}</div><div class=box><h3>💡 Very brief explanation</h3><p>${q.e}</p></div>`;let w=document.createElement("div");w.className="box";w.innerHTML="<h3>❌ Why the other options are incorrect</h3>";q.w.forEach((t,j)=>{if(j!==q.a){let x=document.createElement("div");x.className="wrong-line";x.textContent=`${L[j]} — ${t}`;w.appendChild(x)}});d.appendChild(w);let p=document.createElement("div");p.className="box";p.innerHTML="<h3>🎯 High-yield FRCA board pearls</h3><ul>"+q.p.map(t=>`<li>${t}</li>`).join("")+"</ul>";d.appendChild(p);let m=document.createElement("div");m.className="box must";m.innerHTML="<h3>📌 Must Memorize</h3><p>"+q.m+"</p>";d.appendChild(m);a.appendChild(d)}
function answer(ref,j){let s=load(ref.mockId);if(s.answers[ref.index]!==null)return;s.answers[ref.index]=j;s.current=ref.index;save(ref.mockId,s);render()}
function move(n){let z=curList();if(S.type==="random"){let p=S.current+n;if(p>=0&&p<z.length){S.current=p;render();scrollTo(0,0)}else if(n>0)finish()}else{let p=z.indexOf(S.current)+n;if(p>=0&&p<z.length){S.current=z[p];let s=load(S.mockId);s.current=S.current;save(S.mockId,s);render();scrollTo(0,0)}else if(n>0)finish()}}
function finish(){$("questionArea").classList.add("hidden");$("finalArea").classList.remove("hidden");let d=0,c=0;if(S.type==="random"){S.items.forEach(r=>{let s=load(r.mockId);if(s.answers[r.index]!==null){d++;if(s.answers[r.index]===MOCKS[r.mockId][r.index].a)c++}})}else{let s=load(S.mockId);d=attempted(s);c=correct(s,S.mockId)}let p=d?Math.round(c/d*100):0;$("finalArea").innerHTML=`<h2>${S.type==="random"?"Random Quiz":`Mock Paper ${S.mockId}`} Complete</h2><div class=big>${c}/${d}</div><p>Accuracy: ${p}%</p><button class=primary id=finBad>Review Incorrect</button> <button class=btn id=finHome>All Mocks</button>`;$("finHome").onclick=()=>showHome();$("finBad").onclick=()=>{if(S.type==="random"){S.items=S.items.filter(r=>{let s=load(r.mockId);return s.answers[r.index]!==null&&s.answers[r.index]!==MOCKS[r.mockId][r.index].a});S.current=0;render()}else{let s=load(S.mockId);S.mode="incorrect";S.items=wrong(s,S.mockId);S.current=S.items[0]??0;render()}}}
function toggleMark(){let r=curRef(),s=load(r.mockId);s.marked[r.index]=!s.marked[r.index];save(r.mockId,s);if(S.type==="mock"&&S.mode==="marked"){S.items=marked(s);if(!S.items.includes(S.current))S.current=S.items[0]??0}render()}
function reviewMode(mode){if(S.type!=="mock")return;let s=load(S.mockId);if(S.mode===mode){S.mode="all";S.items=[...Array(30).keys()]}else{S.mode=mode;S.items=mode==="incorrect"?wrong(s,S.mockId):marked(s);S.current=S.items[0]??0}render()}
function resetMock(){if(!confirm(`Reset Mock ${S.mockId}?`))return;localStorage.removeItem(key(S.mockId));S.current=0;S.mode="all";S.items=[...Array(30).keys()];render()}
function resetAll(){if(!confirm("Reset all 10 mocks?"))return;Object.keys(MOCKS).forEach(id=>localStorage.removeItem(key(id)));showHome()}
function search(){let term=$("searchInput").value.trim().toLowerCase(),box=$("searchResults");box.replaceChildren();if(term.length<2)return;refs().filter(x=>[x.q.q,...x.q.o,x.q.e,...x.q.p,x.q.m].join(" ").replace(/<[^>]+>/g," ").toLowerCase().includes(term)).slice(0,100).forEach(h=>{let b=document.createElement("button");b.className="result";let text=h.q.q.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();b.innerHTML=`<strong>Mock ${h.mockId} — Question ${h.index+1}</strong><br><span class=muted>${text.slice(0,170)}${text.length>170?"…":""}</span>`;b.onclick=()=>openMock(h.mockId,"all",h.index);box.appendChild(b)})}
function renderSummary(){let rows="",td=0,tc=0;Object.keys(MOCKS).forEach(id=>{let s=load(id),d=attempted(s),c=correct(s,id);td+=d;tc+=c;rows+=`<div class=sum><strong>Mock ${id}</strong><div class=muted>Answered ${d}/30 · Score ${c}/30 · Accuracy ${d?Math.round(c/d*100):0}%</div></div>`});$("summary").innerHTML=`<div class=center><div class=big>${tc}/${td}</div><p>Overall accuracy: ${td?Math.round(tc/td*100):0}%</p></div><div class=summary>${rows}</div>`}
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"☀️":"🌙";localStorage.setItem(V+"_theme",t)}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>showHome(b.dataset.tab));$("home").onclick=$("back").onclick=()=>showHome();$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("mark").onclick=toggleMark;$("review").onclick=()=>reviewMode("incorrect");$("markedReview").onclick=()=>reviewMode("marked");$("resetMock").onclick=resetMock;$("resetAll").onclick=resetAll;$("searchInput").oninput=search;$("startRandom").onclick=()=>randomQuiz(Number($("randomCount").value));setTheme(localStorage.getItem(V+"_theme")||"light");showHome();
</script></body></html>
