 minute; respiratory rate 22 breaths per minute; blood pressure 122/82 mmHg; SpO₂ 99% on air.<br><br><strong>The most appropriate management is:</strong>","o":["Midazolam 20 μg/kg intravenous bolus to treat emergence delirium","Propofol 0.5 mg/kg intravenous bolus to treat emergence delirium","Fluid bolus of 20 ml/kg 0.9% NaCl to treat hypovolaemia","Morphine 50 μg/kg intravenous bolus for analgesia","Morphine 20 μg/kg/hour intravenous infusion for analgesia"],"a":3,"e":"She is awake, localises pain to the wound and is haemodynamically stable. Give a small titrated IV morphine bolus for breakthrough postoperative pain.","w":["Her distress has a clear painful cause; sedating her would mask pain.","Propofol does not provide analgesia and may depress respiration.","There is no evidence of hypovolaemia.","CORRECT","A continuous infusion risks accumulation and respiratory depression; titrated boluses are safer initially."],"p":["Treat pain before labelling distress as emergence delirium.","Use small IV morphine boluses with reassessment.","Monitor sedation and respiration after opioids.","Multimodal analgesia does not eliminate breakthrough pain."],"m":"Postoperative child with clear pain: titrate IV morphine, not sedatives."},{"q":"A 6-month-old 7 kg boy is scheduled for an elective orchidopexy for undescended testis. He was intubated successfully following an uneventful intravenous induction. A caudal block was performed with 7 ml of bupivacaine 0.25%. The ECG showed occasional ventricular premature beats immediately after the caudal block was performed. Shortly after that, the ECG showed a regular broad complex tachycardia at 160 beats per minute. You notice the end tidal CO₂ trace becomes flat despite good bilateral chest movement. There are no palpable pulses.<br><br><strong>Your immediate first action is:</strong>","o":["Announce cardiac arrest, call for help, and start chest compressions","Give 1.5 mL/kg of 20% lipid emulsion as an intravenous bolus over 1 minute, followed by an infusion of 15 mL/kg/hour","Request for the cardiac defibrillator and deliver a DC shock of 4 J/kg","Request the local anaesthetic toxicity box","Give 0.1 mL/kg of 1:10,000 epinephrine intravenously"],"a":0,"e":"This is pulseless cardiac arrest, probably from local anaesthetic systemic toxicity. The immediate first action remains standard resuscitation: announce arrest, call for help and start chest compressions.","w":["CORRECT","Lipid emulsion should be given rapidly for suspected LAST, but only after immediate CPR is started.","Defibrillation follows rhythm assessment and CPR; do not delay compressions.","The toxicity box is useful but requesting it is not the first lifesaving action.","Adrenaline is given within the arrest algorithm, but chest compressions start first."],"p":["Recognise LAST: arrhythmia after local anaesthetic injection.","Start high-quality CPR immediately.","Give lipid emulsion early once help arrives.","Use reduced adrenaline doses cautiously in LAST."],"m":"Pulseless patient: CPR first—even when LAST is suspected."},{"q":"A 6-year-old girl is admitted with acute appendicitis. After uncomplicated surgery she is noted to be in discomfort and crying.<br><br><strong>In the assessment this child’s pain, which of the following is most correct:</strong>","o":["The FLACC scale is for 1 month and above","Self-reporting is reliable over the age of 10","The visual analogue scale (VAS) can be used in patients aged 12 years and above","Physiological measures such as heart rate can be used alone","The Wong-Baker FACES pain scale consist of 5 hand drawn faces"],"a":2,"e":"The book identifies the visual analogue scale as suitable from around 12 years, when children can reliably understand the abstract continuous scale.","w":["FLACC is generally used in younger/non-verbal children, but the age statement given is not the best answer.","Self-report can often be used well before age 10.","CORRECT","Heart rate and other physiological variables are non-specific and should not be used alone.","The Wong-Baker scale contains six faces, not five."],"p":["Use age- and development-appropriate pain scales.","FLACC is behavioural.","FACES scales suit many children from about 3–4 years.","Physiological signs alone are unreliable."],"m":"Paediatric pain assessment must match the child’s developmental level."},{"q":"A 45 kg, 83-year-old woman with dementia and chronic kidney disease is admitted with a right fractured neck of femur following a fall. She is in severe pain, is confused and agitated. She has been given regular paracetamol, and is booked for a dynamic hip screw.<br><br><strong>Which of the following is the best method to provide her with adequate analgesia intra- and postoperatively?</strong>","o":["Fascia iliaca block","Femoral nerve block","Spinal anaesthesia","Codeine phosphate","Intravenous morphine"],"a":0,"e":"A fascia iliaca block provides effective opioid-sparing analgesia for hip fracture and can cover the femoral and lateral femoral cutaneous nerves. It is especially useful in frail patients with dementia and renal impairment.","w":["CORRECT","A femoral block may help but is less likely to cover the wider hip sensory distribution.","Spinal anaesthesia is an anaesthetic technique, not sustained perioperative analgesia by itself.","Codeine is unreliable and problematic in renal impairment.","IV morphine may worsen confusion and accumulate in chronic kidney disease."],"p":["Use regional analgesia early in hip fracture.","Fascia iliaca block is relatively simple and opioid-sparing.","Reduce opioid exposure in dementia and renal failure.","Continue regular paracetamol if appropriate."],"m":"Hip fracture in a frail patient: fascia iliaca block is the preferred opioid-sparing analgesia."},{"q":"A 61-year-old woman presents with worsening left sided chest pain over the last 3 months. She describes an intense burning sensation over the T5 distribution, which began after an episode of shingles 4 months ago. The pain gets worse through the day, and especially during the night when it disturbs her sleep. It may be triggered by cold wind blowing over the painful part, or her clothes rubbing against it. She has been taking co-codamol with only modest effect.<br><br><strong>Which of the following is the most appropriate next step in her management?</strong>","o":["Lignocaine patch","Oral morphine sulphate","Topical capsaicin","Gabapentin","Thoracic sympathectomy"],"a":3,"e":"This is post-herpetic neuralgia with burning pain and allodynia. Gabapentin is a first-line systemic treatment for neuropathic pain.","w":["A lignocaine patch can help localised pain, but the book’s preferred next step is gabapentin.","Strong opioids are not first-line for neuropathic pain.","Capsaicin may help but can cause burning and is not the preferred next option here.","CORRECT","Sympathectomy is invasive and not indicated as routine treatment."],"p":["Post-herpetic neuralgia is neuropathic pain persisting after shingles.","Allodynia is pain from normally non-painful stimuli.","Gabapentinoids and tricyclics are first-line options.","Topical agents suit localised pain."],"m":"Burning dermatomal pain after shingles = post-herpetic neuralgia; use a neuropathic agent."},{"q":"A 45-year-old man has undergone multiple spinal surgeries in the past and has been on 80 mg daily of slow release morphine for the past year. He is asking for an increase in his medication.<br><br><strong>Which of the following most appropriately describes this patient’s opioid therapy?</strong>","o":["There is no upper limit on the efficacy of opioids","Respiratory depression is a significant risk at this dose","Hyperalgesia may develop with increasing dosage","Constipation is usually resolved after 1 year","Levels of serum adrenocorticotrophic hormone (ACTH) may be increased"],"a":2,"e":"Long-term escalating opioid doses can paradoxically increase pain sensitivity—opioid-induced hyperalgesia. This should be considered before simply increasing the dose.","w":["Analgesic benefit has practical limits and adverse effects rise with dose.","Tolerance reduces respiratory depression in stable chronic use, though risk remains with changes or co-sedatives.","CORRECT","Tolerance rarely develops to constipation.","Chronic opioids tend to suppress the hypothalamic–pituitary–adrenal axis rather than increase ACTH."],"p":["Consider tolerance, dependence and opioid-induced hyperalgesia.","Constipation usually persists.","Chronic opioids can cause endocrine suppression.","Do not automatically escalate dose for worsening pain."],"m":"Worsening pain on escalating opioids may be opioid-induced hyperalgesia."},{"q":"A 31-year-old woman with a history of acute intermittent porphyria presents with severe abdominal pain. She is tachycardic, hypertensive and vomiting. A diagnosis of small bowel obstruction is made and she is to go to theatre for a laparotomy.<br><br><strong>Which of the following is the best option for her postoperative analgesia?</strong>","o":["Epidural with levobupivacaine and fentanyl","Titrated intravenous ketamine","Intravenous morphine","Oxycodone","Wound infiltration of 0.25% levobupivacaine"],"a":2,"e":"Morphine is considered safe in acute intermittent porphyria and provides reliable titratable analgesia after major abdominal surgery.","w":["An epidural may be effective, but the combined drug choice and invasive technique are not the book’s best answer.","Ketamine is generally avoided because of porphyria concerns.","CORRECT","Oxycodone has less established safety in porphyria than morphine.","Wound infiltration alone is inadequate for laparotomy pain."],"p":["Avoid porphyrinogenic drugs during an acute attack.","Morphine is considered safe.","Treat triggers such as fasting, dehydration and infection.","Check an up-to-date porphyria drug-safety list."],"m":"Acute porphyria: morphine is a safe, reliable opioid choice."},{"q":"A 32-year-old man is undergoing emergency surgery under general anaesthesia for a penetrating eye injury. During the procedure, the surgeon palpates the globe and tells you that the intraocular pressure (IOP) is too high.<br><br><strong>Which of the following measures is least likely to reduce the IOP?</strong>","o":["Adequate muscle relaxation","Trendelenburg positioning","Increasing minute ventilation","Intravenous acetazolamide","Intravenous mannitol bolus"],"a":1,"e":"Trendelenburg increases venous pressure in the head and therefore tends to increase, not reduce, intraocular pressure.","w":["Muscle relaxation prevents coughing/straining and reduces IOP.","CORRECT","Hyperventilation lowers PaCO₂ and can reduce IOP.","Acetazolamide reduces aqueous humour production.","Mannitol lowers IOP by osmotic dehydration of the vitreous."],"p":["Avoid coughing, bucking and venous congestion.","Head-up positioning lowers IOP.","Hypercapnia raises IOP.","Mannitol and acetazolamide can reduce IOP."],"m":"Trendelenburg raises venous and intraocular pressure."},{"q":"A 71-year-old man is undergoing a bilateral ilio-femoral bypass graft with the aid of a cell salvage device. The surgeons have completed the right ilio-femoral bypass and are preparing to begin operating on the left side when you notice that the blood returned to the patient from the cell salvage device is 1,900 mL.<br><br><strong>After sending a clotting sample to the lab, what is the most appropriate next step in the management of this patient’s blood loss?</strong>","o":["Await the lab results and treat the coagulation accordingly","Request cryoprecipitate and platelets from the blood bank","Administer a 1 g bolus of tranexamic acid intravenously","Use hypotensive anaesthesia to decrease further blood loss","Check the patients activated clotting time (ACT)"],"a":1,"e":"Large-volume cell salvage replaces red cells but not platelets or clotting factors. With nearly 2 litres returned and ongoing surgery, anticipate dilutional coagulopathy and request platelets and cryoprecipitate while awaiting results.","w":["Waiting risks delay while bleeding continues.","CORRECT","Tranexamic acid may be useful, but it does not replace depleted platelets or fibrinogen.","Hypotensive anaesthesia is unsafe in major vascular surgery and does not correct coagulopathy.","ACT mainly assesses heparin effect and is not a complete assessment of dilutional coagulopathy."],"p":["Cell-salvaged blood contains red cells but minimal platelets/clotting factors.","Massive blood loss causes dilutional coagulopathy.","Replace fibrinogen and platelets when clinically indicated.","Do not wait for severe bleeding before arranging blood components."],"m":"Large-volume cell salvage does not replace platelets or fibrinogen."},{"q":"A 67-year-old man is admitted to the emergency department with a sudden onset of severe chest pain and breathlessness. His ECG shows ST elevation in the following leads: I, aVL and V2–V6.<br><br><strong>Which of the following is the most likely affected blood vessel?</strong>","o":["Left anterior descending artery","Right coronary artery","Left circumflex artery","Left coronary artery","Posterior descending artery"],"a":3,"e":"ST elevation across lateral leads I/aVL and the broad anterior precordial territory V2–V6 indicates a large anterolateral infarction involving the left coronary arterial circulation.","w":["LAD occlusion usually produces predominantly anterior/septal changes, but this distribution is broader.","RCA occlusion classically causes inferior ST elevation.","LCx usually causes lateral or posterior changes, not the full anterior distribution.","CORRECT","PDA occlusion produces inferior/posterior changes."],"p":["I and aVL are high lateral leads.","V2–V4 are anterior; V5–V6 are lateral.","Broad anterior plus lateral elevation suggests a proximal left coronary lesion.","RCA/PDA lesions classically affect inferior leads."],"m":"I, aVL and V2–V6 ST elevation = extensive left coronary territory infarction."},{"q":"A 7-year-old boy presents following a head injury by falling from a height of 3 metres. On assessing his neurological status he opens his eyes to a painful stimulus, cries to pain and withdraws from a painful stimulus.<br><br><strong>Which score on the paediatric Glasgow coma scale best represents the findings?</strong>","o":["Eyes 2 Verbal 3 Motor 4","Eyes 1 Verbal 2 Motor 4","Eyes 2 Verbal 2 Motor 3","Eyes 3 Verbal 3 Motor 4","Eyes 2 Verbal 4 Motor 4"],"a":0,"e":"Eyes opening to pain scores 2; crying to pain scores verbal 3 in the paediatric scale; withdrawal from pain scores motor 4.","w":["CORRECT","Eye opening to pain is not 1, and crying to pain is not verbal 2.","Withdrawal is motor 4, not 3.","Eye opening to pain is 2, not 3.","Crying to pain scores 3 rather than 4."],"p":["Eye response: pain = 2.","Motor response: withdrawal = 4.","Use age-appropriate verbal descriptors.","Record components as well as total score."],"m":"Pain opens eyes 2; cries to pain 3; withdraws 4 = E2 V3 M4."},{"q":"You are called to urgently assess a 54-year-old man in outpatient clinic who has acutely deteriorated following administration of oral antibiotics. On assessment his heart rate is 145 beats per minute, blood pressure is 74/36 mmHg and saturations are 93% on 6 L/minute of oxygen via Hudson mask. He is wheezy and has a generalised rash all over his body.<br><br><strong>Which of the following would be the most appropriate pharmacological intervention for the patient?</strong>","o":["Intravenous adrenaline 3 mg bolus","Intravenous adrenaline 0.5 mL of 1:1000","Intramuscular adrenaline 1 mL of 1:1000","Intramuscular adrenaline 0.5 mL of 1:1000","Intramuscular adrenaline 0.5 mL of 1:10000"],"a":3,"e":"This is anaphylaxis with shock and bronchospasm. The first-line adult treatment is 500 micrograms adrenaline intramuscularly, equal to 0.5 mL of 1:1000 solution.","w":["A 3 mg IV bolus is dangerously excessive.","IV 1:1000 adrenaline is unsafe outside specialist titrated use and this dose is inappropriate.","1 mL of 1:1000 gives 1 mg, double the recommended adult IM dose.","CORRECT","0.5 mL of 1:10,000 contains only 50 micrograms and is inadequate IM."],"p":["Adult anaphylaxis: adrenaline 500 micrograms IM.","Use 1:1000 concentration for IM injection.","Repeat after about 5 minutes if needed.","Give oxygen, fluids and call for help."],"m":"Adult anaphylaxis = 0.5 mL of 1:1000 adrenaline IM."}],"3":[{"q":"You are asked to anaesthetise a 40-year-old man for an elective brain tumour resection. He has a Glasgow coma score (GCS) of 15/15 and his CT shows minimal midline shift.<br><br><strong>Which volatile-based anaesthetic is least likely to detrimentally affect his intracranial pressure?</strong>","o":["Desflurane","Isoflurane","Nitrous oxide and sevoflurane","Sevoflurane","Halothane"],"a":3,"e":"Sevoflurane has the least adverse effect on cerebral autoregulation and ICP when used at appropriate concentrations. It is the preferred volatile agent in neuroanaesthesia.","w":["Desflurane causes cerebral vasodilatation and can increase ICP.","Isoflurane impairs autoregulation more than sevoflurane.","Nitrous oxide may increase CBF and expand intracranial air.","CORRECT","Halothane causes the greatest cerebral vasodilatation."],"p":["All volatiles can increase CBF and ICP.","Sevoflurane has minimal effect at ≤1–1.5 MAC.","Hypocapnia can oppose volatile cerebral vasodilatation but risks ischaemia.","Avoid nitrous oxide when intracranial air is possible."],"m":"Sevoflurane is the volatile agent least likely to worsen ICP."},{"q":"A 76-year-old man has been admitted following coronary artery bypass grafting. He has severe left ventricular dysfunction postoperatively and failed to wean from cardiopulmonary bypass necessitating intra-aortic balloon pump insertion.<br><br><strong>Concerning the expected haemodynamic effects of a correctly sited and timed intra-aortic balloon pump, which of the following is the most appropriate answer?</strong>","o":["Increased aortic systolic pressure, increased left ventricular end-diastolic pressure","Reduced aortic systolic pressure, increased preload","Increased coronary blood flow, reduced aortic diastolic pressure","Increased left ventricular volume, increased coronary blood flow","Reduced preload, reduced left ventricular wall tension"],"a":4,"e":"IABP inflates in diastole and deflates before systole. This improves coronary perfusion and reduces LV afterload, end-diastolic pressure, preload and wall tension.","w":["IABP reduces rather than increases systolic pressure and LVEDP.","Preload falls as LV emptying improves.","Diastolic pressure rises, not falls.","LV end-systolic and end-diastolic volumes fall.","CORRECT"],"p":["Inflate after aortic valve closure.","Deflate just before systole.","Diastolic augmentation increases coronary flow.","Systolic unloading reduces myocardial oxygen demand."],"m":"IABP reduces LV preload and wall tension while increasing coronary perfusion."},{"q":"You are anaesthetising a patient for a right pneumonectomy. You have successfully inserted a left-sided double lumen tube (DLT) and the patient is taken into the operating room and placed in the right lateral position. Initial ventilator settings are intermittent positive pressure ventilation (IPPV) with a tidal volume of 600 mL and FiO₂ 1.0. Shortly after clamping the catheter mount and deflating the right lung the patient rapidly desaturates to 88%. The peak pressure alarm on the ventilator sounds.<br><br><strong>What is the first appropriate course of action?</strong>","o":["Deflate the bronchial cuff","Apply 5 cm H₂O CPAP","Check the position of the tube with a fibrescope","Administer 5 L/minute oxygen to the deflated lung","Advance the DLT 2 cm"],"a":0,"e":"Sudden desaturation with raised airway pressure after positioning strongly suggests DLT migration. Deflating the bronchial cuff may immediately restore ventilation while preparing fibreoptic confirmation.","w":["CORRECT","CPAP helps hypoxaemia only after tube malposition is excluded.","Fibreoptic confirmation is definitive, but cuff deflation is the fastest first rescue step.","Oxygen insufflation does not correct obstruction from malposition.","Blind advancement risks bronchial trauma and worsening obstruction."],"p":["Recheck DLT position after every patient move.","High pressure plus sudden hypoxaemia suggests malposition.","Deflate bronchial cuff first, then use bronchoscopy.","Treat persistent OLV hypoxaemia systematically."],"m":"Sudden hypoxaemia after lateral positioning: deflate the bronchial cuff first."},{"q":"A 70-year-old woman is receiving laser therapy to vocal cord polyps. Her grade 1 intubation with a laser-resistant cuffed tube filled with methylene blue was uneventful and she is being ventilated with 2% sevoflurane and 50% oxygen. Suddenly the surgeon notices flames and methylene blue around the endotracheal tube so stops lasering and floods the site with saline.<br><br><strong>What is the most appropriate next step in managing her airway?</strong>","o":["Reduce the FiO₂ and perform bronchoalveolar lavage","Stop the flow of all airway gases and remove the endotracheal tube","Reduce the FiO₂ and pack wet swabs around the endotracheal cuff","Reduce the FiO₂ and perform a tracheostomy","Reduce the FiO₂ and inspect the endotracheal tube lumen via fibrescope"],"a":1,"e":"This is an airway fire. Immediately stop all gases and remove the burning tracheal tube, then re-establish oxygenation and inspect the airway for thermal injury.","w":["Lavage follows removal of the burning source.","CORRECT","Packing around the cuff leaves the burning tube in place.","Tracheostomy is not the immediate first step.","Fibreoptic inspection is performed after the fire is extinguished and tube removed."],"p":["Stop laser and all airway gases.","Remove the tracheal tube immediately.","Flood the airway with saline.","Reintubate, ventilate with air initially, and perform bronchoscopy."],"m":"Airway fire: stop gases and remove the tube immediately."},{"q":"A 27-year-old man with type 1 diabetes is listed for day case shoulder arthroscopy under general anaesthesia. He is listed first on an afternoon list and will take an early breakfast on the morning of surgery. He takes Novomix 30 twice a day after his morning and evening meals. His HbA1c measured last month was 53 mmol/mol (7%).<br><br><strong>What is the most appropriate advice for his insulin adjustment on the day of surgery?</strong>","o":["Take usual morning dose, and usual insulin with evening meal","Halve usual morning dose, take usual insulin with evening meal","Omit usual morning dose, take normal insulin with evening meal","Halve usual morning dose, halve evening dose","Omit usual morning dose, halve evening dose"],"a":1,"e":"For an afternoon procedure after an early breakfast, give half the usual morning mixed insulin dose and resume the normal evening dose with food.","w":["The full morning mixed dose risks hypoglycaemia while fasting.","CORRECT","Complete omission risks hyperglycaemia and ketosis.","The evening dose should usually return to normal with the evening meal.","There is no reason to reduce the evening dose if eating normally."],"p":["Minimise disruption to usual diabetic routine.","Never omit basal insulin in type 1 diabetes.","Mixed insulin is reduced when fasting follows breakfast.","Monitor capillary glucose regularly."],"m":"Afternoon surgery with twice-daily mixed insulin: half morning dose, normal evening dose."},{"q":"A 25-year-old woman is having a hysteroscopic myomectomy for infertility under general anaesthesia. The procedure has been prolonged and the irrigation bags have been changed several times. On screen you can see some blood and bubbles in the uterine cavity. She is positioned in the lithotomy position and is slightly head down. You suddenly notice a stepwise decrement in end-tidal waveform capnography, the patient desaturates and there is new T wave inversion on her ECG.<br><br><strong>Which of the following is the most appropriate immediate management?</strong>","o":["Call for help, ask the surgeon to stop. Place the patient flat. Give a fluid challenge and high-flow oxygen.","Call for help, ask the surgeon to flood the uterus with irrigation. Place the patient flat. Give a fluid challenge and high-flow oxygen.","Call for help, ask the surgeon to externally compress the uterus. Place the patient lateral. Give a fluid challenge and high-flow oxygen.","Call for help, ask the surgeon to empty the uterus. Place the patient head up. Give a fluid challenge and high-flow oxygen.","Call for help. Steepen the head down to insert a central venous line into the right internal jugular vein, pass it into the right atrium and attempt to aspirate air."],"a":3,"e":"The findings suggest venous air embolism. Stop further air entrainment by emptying the uterus and placing the patient head-up, then give 100% oxygen and cardiovascular support.","w":["Stopping alone may not remove the uterine source of entrainment.","Flooding the uterus may worsen fluid absorption and does not empty the cavity.","Lateral positioning is less useful than stopping the source and head-up positioning in this setting.","CORRECT","Central venous aspiration is not the first action and should not delay source control."],"p":["A sudden ETCO₂ fall is a key clue to air embolism.","Stop surgery and prevent further entrainment.","Give 100% oxygen and support circulation.","Discontinue nitrous oxide if in use."],"m":"Hysteroscopy + sudden ETCO₂ fall = venous air embolism."},{"q":"A 68-year-old man undergoing vocal cord surgery is receiving high frequency jet ventilation via a subglottic catheter with the following standard settings: FiO₂ 0.9, driving pressure 2 atmospheres, frequency 150 min⁻¹, inspiratory time 50%. Blood gas analysis shows a respiratory acidosis and clinically there is no evidence of air trapping.<br><br><strong>Which action is most likely to improve the respiratory acidosis?</strong>","o":["Increasing the driving pressure","Increasing the ventilator frequency","Increasing the inspiratory time","Increasing the FiO₂","Increasing the expiratory time"],"a":0,"e":"With no evidence of air trapping, increasing driving pressure raises delivered tidal volume and minute ventilation, improving CO₂ clearance.","w":["CORRECT","Higher frequency can reduce tidal volume and worsen CO₂ clearance.","Longer inspiratory time risks air trapping.","FiO₂ affects oxygenation, not ventilation.","More expiratory time is useful when air trapping is present, which it is not here."],"p":["CO₂ clearance depends mainly on driving pressure and delivered volume.","Check chest movement and airway patency.","Avoid excessive pressure and barotrauma.","If air trapping occurs, increase expiratory time."],"m":"HFJV respiratory acidosis without air trapping: increase driving pressure."},{"q":"A patient 10 days post coronary artery bypass grafting requires an MRI brain scan for neurological deterioration.<br><br><strong>Which of the following is most likely to be a safety hazard during the scan?</strong>","o":["History of a total hip replacement","Presence of sternal wires","Use of an endotracheal tube with metallic spring in the pilot balloon","Epicardial pacing wires","Invasive arterial blood pressure transducer"],"a":3,"e":"Temporary epicardial pacing wires may heat or induce currents in MRI and are a significant safety concern. Their presence requires specialist risk assessment.","w":["Most modern hip prostheses are MR conditional and fixed in bone.","Sternal wires are generally safe after CABG.","A metallic spring in a pilot balloon is usually outside the high-field region and can be checked.","CORRECT","An arterial transducer can remain outside the magnetic field with MR-compatible tubing."],"p":["MRI safety depends on ferromagnetism, heating and induced current.","Temporary pacing wires require careful review.","Use MR-compatible monitoring.","Keep standard equipment outside the 5-gauss line."],"m":"Post-CABG MRI: epicardial pacing wires are the major hazard."},{"q":"A 27-year-old woman is to have femoral nerve block with the aid of nerve stimulator.<br><br><strong>What is the most important feature of an electrical peripheral nerve stimulator?</strong>","o":["Short pulse duration","Stimulation frequency of 2 Hz","Constant current generator","Negative stimulation polarity","Actual current digital display"],"a":2,"e":"A constant-current generator maintains the selected current despite changing tissue resistance, making stimulation predictable and safer.","w":["Short pulse duration is useful but not the most important feature.","A frequency around 1–2 Hz is standard but secondary.","CORRECT","Negative polarity improves stimulation efficiency but is not the key safety feature.","A digital display is useful only if the delivered current remains constant."],"p":["Constant current compensates for tissue resistance.","Use short pulse duration for motor nerve localisation.","Stop if injection is painful or resistance is high.","A response at very low current may indicate intraneural placement."],"m":"The essential nerve stimulator feature is constant-current output."},{"q":"You have been called to site an epidural for a 32-year-old term primigravida patient. She is now 3 cm dilated with slow progress and very distressed with each contraction. While you are placing the Tuohy needle in the epidural space, you see an obvious flow of clear fluid through the needle.<br><br><strong>What would be the most appropriate next course of action?</strong>","o":["Pull the needle out and arrange alternative analgesia","Inject 10 mL of normal saline into the subarachnoid space to prevent post-dural puncture headache (PDPH) and then re-site the epidural catheter in another interspace","Remove the needle and re-site the epidural catheter in another interspace. Tell the midwife to use 10 mL of epidural mixture for each top-up","Thread the epidural catheter through the punctured dural hole and use it as intrathecal catheter. Make sure only an anaesthetist gives every top-up dose","Pull the needle out and call the consultant on call to perform a blood patch to prevent PDPH"],"a":3,"e":"After recognised dural puncture, threading and clearly labelling an intrathecal catheter provides reliable analgesia and avoids another difficult puncture. Only trained anaesthetists should dose it.","w":["Alternative analgesia is less reliable and wastes established access.","Intrathecal saline does not reliably prevent PDPH.","Standard epidural top-up volumes through a possibly intrathecal catheter would be dangerous.","CORRECT","Prophylactic blood patch is not routinely performed immediately."],"p":["Clearly label intrathecal catheters.","Use small spinal doses only.","Communicate with the whole labour ward team.","Leaving the catheter for about 24 hours may reduce PDPH."],"m":"Recognised dural puncture: consider a labelled intrathecal catheter with anaesthetist-only dosing."},{"q":"You have been called to an acute medical ward to help manage a man who has become distressed and angry with the medical management of a relative, and is now behaving violently toward one of the ward staff. When you arrive the situation is heated, security and porter staff are already in attendance. The sister tells you and the on call psychiatrist that the man is unreasonable and needs to be sedated for safety.<br><br><strong>How do you proceed?</strong>","o":["Offer the man a dose of oral lorazepam","Attempt to assess his capacity, and discuss with your consultant. Defer immediate management to the security staff and police","Give intramuscular lorazepam and haloperidol","Give a dose of intramuscular ketamine and transfer to a monitored environment","Organise the security staff to restrain the man, and give intramuscular lorazepam"],"a":1,"e":"He is a visitor rather than a patient. Immediate safety and restraint should be handled by trained security or police while clinicians assess capacity and offer medical help only when appropriate.","w":["Medication cannot be imposed simply because a visitor is angry.","CORRECT","Rapid tranquillisation without a clinical assessment or legal basis is inappropriate.","Ketamine restraint is disproportionate and unsafe.","Anaesthetists should not direct restraint and sedation of a non-patient without clear legal and clinical justification."],"p":["Prioritise staff and public safety.","Use trained security and police for violent visitors.","Assess capacity only when safe.","Sedation requires clinical indication, consent or lawful authority."],"m":"A violent visitor is primarily managed by security/police, not automatic medical sedation."},{"q":"A 24-year-old 60 kg woman has been injured in a house fire. She has sustained 40% full thickness lower limb and abdominal burns. Her burns were sustained at 11 pm. She is intubated in the emergency department for suspected inhalational injury and resuscitated with 2 litres of crystalloid in total. At 3 am she is ready for transfer to the regional burns unit that is 4 hours away.<br><br><strong>What is the most appropriate fluid regime during transfer?</strong>","o":["Colloid solution, at 500 mL/hour","Compound sodium lactate, at 500 mL/hour","0.9% sodium chloride, at 500 mL/hour","Colloid solution, at 700 mL/hour","Compound sodium lactate, at 700 mL/hour"],"a":4,"e":"Parkland requirement is 4 × 60 × 40 = 9.6 L. Half is due in the first 8 hours from injury: 4.8 L. After 2 L in 4 hours, 2.8 L remains over the next 4 hours = 700 mL/hour of compound sodium lactate.","w":["Early burn resuscitation uses crystalloid, not colloid.","500 mL/hour under-replaces the calculated first-8-hour requirement.","0.9% saline risks hyperchloraemia and is not preferred.","Colloid is not the standard initial Parkland fluid.","CORRECT"],"p":["Parkland starts from time of burn, not hospital arrival.","Use 4 mL/kg/%TBSA.","Give half in the first 8 hours.","Titrate to urine output and perfusion."],"m":"Parkland timing begins at the moment of injury."},{"q":"A previously well 28-year-old man presents to the emergency department with a 48-hour history of feeling generally unwell and complains of polyuria and abdominal pain.<br><br><strong>Arterial blood gas:</strong> pH 7.18; PaCO₂ 3.4 kPa; PaO₂ 14.2 kPa; base excess −8.8 mmol/L; HCO₃⁻ 19.7 mmol/L; lactate 1.8 mmol/L; Na⁺ 136 mmol/L; Cl⁻ 102 mmol/L; K⁺ 5.9 mmol/L.<br><strong>Biochemistry:</strong> urea 10.7 mmol/L; creatinine 124 μmol/L; K⁺ 5.8 mmol/L; Na⁺ 137 mmol/L.<br><br><strong>Which of the following is the most likely diagnosis?</strong>","o":["Renal tubular acidosis","Severe sepsis","Pancreatitis","Addison’s disease","Diabetic ketoacidosis"],"a":4,"e":"Polyuria, abdominal pain, dehydration, hyperkalaemia and a high-anion-gap metabolic acidosis are classic for diabetic ketoacidosis.","w":["RTA usually causes a normal-anion-gap hyperchloraemic acidosis.","Lactate is not elevated enough to support severe septic lactic acidosis.","Pancreatitis can trigger DKA but does not explain the entire biochemical pattern.","Addison’s causes hyponatraemia and hyperkalaemia, but polyuria and this acidosis pattern favour DKA.","CORRECT"],"p":["DKA is diagnosed by hyperglycaemia, ketonaemia and metabolic acidosis.","Serum potassium may be high despite total-body depletion.","Start fluids before insulin.","Monitor ketones and bicarbonate, not glucose alone."],"m":"DKA may present with high serum K⁺ but severe total-body potassium depletion."},{"q":"A 64-year-old man with a background of hypertension and ischaemic heart disease is being managed for septic shock. The patient has pyelonephritis and gram negative sepsis that is being treated with sensitive antibiotics. The management includes a positive fluid balance for the last 24 hours of 5.5 litres and a noradrenaline infusion currently administered at 0.8 μg/kg/min maintaining a mean arterial blood pressure (MAP) of 55 mmHg. The ventilation parameters are deteriorating and he is now receiving an FiO₂ of 0.6. His latest haemodynamic monitoring studies are: CI 1.94 L/min/m²; ITBVI 650 mL/m²; SVRI 3854; EVLWI 14 mL/kg.<br><br><strong>What is the most appropriate next course of action?</strong>","o":["Fluid bolus of 500 mL crystalloid and repeat studies","Increase the noradrenaline to increase MAP to 70 mmHg","Add dobutamine at 2.5 μg/kg/min","Order an urgent transthoracic echo and send cardiac troponin measurement","Commence urgent haemofiltration aiming to reduce pulmonary interstitial fluid"],"a":0,"e":"Despite positive balance and high EVLWI, the low ITBVI indicates inadequate intravascular preload. A cautious 500 mL fluid challenge with repeat haemodynamic assessment is the book’s recommended next step.","w":["CORRECT","SVRI is already high; more noradrenaline may worsen cardiac output.","Dobutamine may be needed later if low output persists after preload optimisation.","Echo may help, but immediate haemodynamic data support a fluid challenge.","Haemofiltration before restoring effective circulating volume may worsen shock."],"p":["ITBVI estimates preload; EVLWI estimates lung water.","A patient can be oedematous yet intravascularly depleted.","Use small fluid challenges with reassessment.","Add inotrope if output stays low after preload optimisation."],"m":"High lung water does not exclude intravascular hypovolaemia."},{"q":"A 17-year-old man is admitted to the critical care unit having ingested 11 g of paracetamol 18 hours ago. An N-acetylcysteine infusion has been started and bloods are awaited. His blood pressure is 80/43 mmHg following one litre of Hartmann’s solution, with a heart rate of 118 beats per minute. He is agitated and full neurological examination is difficult. On 100% oxygen his SpO₂ is 92%, with a respiratory rate of 42 breaths per minute. Arterial blood gas: pH 6.9; PaCO₂ 2.8 kPa; PaO₂ 18 kPa; base excess −13.2 mmol/L; HCO₃⁻ 12 mmol/L; lactate 10.8 mmol/L.<br><br><strong>The next most appropriate intervention in his management would be:</strong>","o":["Central venous catheter and start noradrenaline","Intubation and ventilation","Urgent transfer to a liver specialist intensive care unit","CT head","Placement of a urinary catheter"],"a":1,"e":"He is severely acidotic, hypoxaemic despite 100% oxygen, tachypnoeic and agitated. Immediate airway control and ventilation are required before transfer or further investigation.","w":["Vasopressors may follow, but airway and ventilation are immediately threatened.","CORRECT","Transfer is essential but only after stabilising airway and breathing.","CT should not delay resuscitation.","Urine output monitoring is important but not the priority."],"p":["Use ABC priorities in poisoning.","Severe acidosis increases respiratory workload.","Continue N-acetylcysteine.","Discuss early with a specialist liver unit after stabilisation."],"m":"Paracetamol toxicity with severe respiratory failure: intubate before transfer."},{"q":"A 28-year-old woman presents to the emergency department with pleuritic chest pain, shortness of breath and dizziness shortly after disembarking a flight from South East Asia. Her respiratory rate is 45 breaths per minute, her blood pressure is 70/40 mmHg and heart rate is 160 beats per minute. Admission to the high dependency unit is requested for cardiovascular support.<br><br><strong>Which piece of information would most influence your choice to administer thrombolysis?</strong>","o":["Currently on anticoagulation","Information from a CT pulmonary angiography","Information from a bedside transthoracic echo","A history of being 20 weeks pregnant","A history of peptic ulcer disease"],"a":2,"e":"She is too unstable for transfer to CT. Bedside echocardiographic evidence of acute right-heart strain can rapidly support the diagnosis of massive pulmonary embolism and the decision to thrombolyse.","w":["Anticoagulation does not establish the diagnosis.","CTPA may be unsafe or impossible in profound shock.","CORRECT","Pregnancy is a relative, not absolute, contraindication when PE is life-threatening.","Peptic ulcer disease affects bleeding risk but does not establish the immediate indication."],"p":["Massive PE means PE with haemodynamic instability.","Use bedside echo when too unstable for CT.","Pregnancy is not an absolute contraindication to life-saving thrombolysis.","Balance bleeding risk against near-certain death without treatment."],"m":"Unstable suspected massive PE: bedside echo may guide immediate thrombolysis."},{"q":"A 46-year-old man is sedated and intubated for respiratory failure secondary to community acquired pneumonia. He is known to have recurrent admissions with pneumonia. Your junior colleague sustains a needlestick injury whilst inserting an arterial line, is anxious and would like you to test this patient for HIV.<br><br><strong>With regards to HIV testing in this patient, the best course of action is:</strong>","o":["Request consent from the next of kin","Test the patient for HIV","Do not test this patient for HIV because you suspect he is low risk","Do not test this patient for HIV as it is unethical","Wait until the patient has capacity and gain consent from the patient for HIV testing"],"a":1,"e":"Following a significant occupational exposure, testing the incapacitated source patient may be justified in the injured clinician’s best interests when it directly guides urgent post-exposure management.","w":["Next of kin cannot generally consent on behalf of an adult.","CORRECT","Risk cannot be dismissed without assessment.","Testing is not automatically unethical when clinically justified after exposure.","Waiting may remove the opportunity to tailor time-critical PEP."],"p":["Assess the exposure urgently.","Begin PEP promptly when indicated.","Source testing should directly benefit exposed-person management.","Maintain confidentiality and document the decision."],"m":"After a significant needlestick, source testing may be justified to guide urgent PEP."},{"q":"A 25-year-old woman is undergoing a category 1 lower segment Caesarean section (LSCS) for fetal bradycardia. You perform a rapid sequence induction with thiopentone 500 mg and suxamethonium 100 mg but are unable to intubate after three attempts. The patient is desaturating and you are unable to ventilate with a face mask and Guedel airway or with a laryngeal mask airway, despite cricoid pressure being reduced and then released. You successfully perform a needle cricothyroid puncture and an ENT surgeon has been informed and is on their way. The fetal heart rate remains at 60 bpm.<br><br><strong>What is the next appropriate step?</strong>","o":["Continue oxygenation and proceed with emergency LSCS","Delay LSCS until ENT have performed surgical tracheostomy","Once ENT arrive, perform surgical tracheostomy and LSCS at the same time","Abandon LSCS and continue oxygenation until patient wakes up","Continue oxygenation until patient wakes up and then perform a spinal anaesthetic"],"a":1,"e":"Needle cricothyroid oxygenation is temporary and does not provide a secure airway. Maternal safety comes first: delay surgery briefly until ENT establishes a definitive surgical airway.","w":["Proceeding with only temporary oxygenation risks catastrophic loss of the airway.","CORRECT","Simultaneous procedures complicate airway rescue; secure the airway first.","This is a category 1 emergency and cannot simply be abandoned once the airway is secured.","Waiting to wake and then performing spinal anaesthesia delays urgent delivery excessively."],"p":["Maternal airway always takes priority over delivery.","Needle cricothyroidotomy is a bridge, not a definitive airway.","Obtain surgical airway urgently.","Proceed with LSCS once maternal oxygenation and airway are secured."],"m":"In obstetric CICO, secure the mother’s definitive airway before proceeding."},{"q":"A 30-year-old woman who is 32/40 pregnant is undergoing an open appendicectomy under general anaesthesia. She had a rapid sequence induction with thiopentone 500 mg and suxamethonium 100 mg and was maintained on sevoflurane in oxygen and air. At the end of the procedure, in the recovery room, the patient complains of abdominal discomfort. The midwife from labour ward performs a cardiotocograph (CTG), which suggests the patient is going into preterm labour.<br><br><strong>Which of the following is the least likely cause of her preterm labour?</strong>","o":["Third trimester pregnancy","Acute appendicitis","Surgical manipulation of the uterus","Sevoflurane","Maternal pyrexia"],"a":3,"e":"Sevoflurane relaxes uterine smooth muscle and is therefore least likely to provoke preterm labour. Infection, pyrexia and uterine manipulation increase the risk.","w":["The third trimester is intrinsically closer to spontaneous labour.","Inflammation from appendicitis can precipitate labour.","Mechanical uterine stimulation may trigger contractions.","CORRECT","Maternal infection and fever increase preterm labour risk."],"p":["Non-obstetric abdominal surgery increases preterm labour risk.","Treat infection and pyrexia.","Avoid unnecessary uterine manipulation.","Volatile agents relax the uterus."],"m":"Sevoflurane causes uterine relaxation, not preterm contractions."},{"q":"A 4-month-old 4.5-kg boy is on your elective day case surgical list for bilateral inguinal hernia repair. He was born at 27 weeks gestation and his current corrected gestational age is 44 weeks. The patient was ventilated for 10 days and was oxygen dependent for 6 weeks. He was discharged home 3 weeks previously, but re-presented last week with an apparently obstructed hernia that was reduced by the on-call surgeon. He is on iron and folic acid for anaemia of prematurity.<br><br><strong>The most appropriate anaesthetic management would be:</strong>","o":["Proceed with day case surgery under general anaesthesia supplemented with regional anaesthesia","Proceed with day case surgery under regional anaesthesia supplemented with minimal intravenous sedation","Postpone surgery until 60 weeks gestational age","Postpone surgery until 52 weeks gestational age","Proceed with surgery under general anaesthesia supplemented with regional anaesthesia and admit postoperatively for apnoea monitoring"],"a":4,"e":"His recently obstructed hernia needs repair, but extreme prematurity, anaemia and corrected age 44 weeks confer a high postoperative apnoea risk. Proceed with GA plus regional analgesia and admit for monitoring.","w":["Day-case discharge is unsafe at this corrected age.","Sedation can also precipitate apnoea and bilateral surgery may be difficult under regional alone.","Delay risks recurrent obstruction.","Waiting to 52 weeks is not justified given recent obstruction.","CORRECT"],"p":["Former preterm infants are at risk of postoperative apnoea.","Risk is higher with anaemia and chronic lung disease.","Regional analgesia reduces opioid exposure.","Monitor postoperatively, often overnight."],"m":"Former 27-week infant at 44 weeks corrected age requires postoperative apnoea monitoring."},{"q":"A 16 kg 4-year-old girl with diabetic ketoacidosis (DKA) is given 40 mL/kg of 0.9% saline for resuscitation and 85 mL/hour of 0.45% saline with 5% glucose as replacement and maintenance fluid. An insulin infusion was commenced at 0.1 unit/kg/hour after an initial bolus dose of 0.1 unit/kg. Two hours later she has become drowsy with a blood glucose of 11 mmol/L. She appears lethargic and somnolent, and responds to voice. Her heart rate is 96 beats per minute, blood pressure is 128/68 mmHg and respiratory rate is 38 breaths per minute.<br><br><strong>The most likely cause of her reduced level of consciousness is:</strong>","o":["Cerebral oedema","Meningitis","Hypokalaemia","Dehydration","Exhaustion"],"a":0,"e":"Rapid fluid and glucose/osmolality change in paediatric DKA followed by drowsiness and relative hypertension strongly suggests cerebral oedema.","w":["CORRECT","The timing after treatment and haemodynamic pattern are more typical of cerebral oedema.","Hypokalaemia causes weakness and arrhythmias rather than this neurological deterioration.","She has already received substantial fluid and is not hypotensive.","Tachypnoea may be tiring, but reduced consciousness during DKA treatment is cerebral oedema until proved otherwise."],"p":["Cerebral oedema is the feared complication of paediatric DKA.","Warning signs: headache, reduced GCS, bradycardia and hypertension.","Treat immediately—do not wait for CT.","Avoid insulin bolus and excessive early fluid."],"m":"Any neurological deterioration during paediatric DKA treatment = cerebral oedema until proven otherwise."},{"q":"A 65-year-old man was scheduled for a below knee amputation for peripheral vascular disease. He is currently on 10 mg morphine sulphate twice daily for analgesia.<br><br><strong>What would be the most appropriate pre-medication to reduce the risk of development of chronic pain?</strong>","o":["Morphine sulphate 15 mg","Gabapentin 900 mg","Amitriptyline 25 mg","Ketamine 20 mg","Epidural analgesia 24 hours preoperatively"],"a":1,"e":"Preoperative gabapentin reduces central sensitisation and has evidence for reducing acute postoperative pain and possibly chronic postsurgical pain.","w":["Increasing morphine does not prevent neuropathic chronic pain.","CORRECT","Amitriptyline has more adverse effects and less perioperative evidence.","Ketamine is not the preferred first-line premedication here.","Preoperative epidural has not consistently prevented phantom limb pain."],"p":["Severe preoperative pain increases chronic pain risk.","Gabapentinoids reduce central sensitisation.","Use multimodal perioperative analgesia.","Avoid assuming opioids alone prevent phantom pain."],"m":"Gabapentin is the preferred premedication to reduce chronic postsurgical pain risk."},{"q":"A 34-year-old woman presents with a 3-month history of poor sleep, fatigue, and worsening widespread muscular pain. On examination, she is extremely tender on finger palpation of several muscle groups and a diagnosis of fibromyalgia is made.<br><br><strong>Regarding management of her symptoms, which of the following is the most appropriate first step?</strong>","o":["Trigger point injection","Morphine","Amitriptyline","Ibuprofen","Gabapentin"],"a":2,"e":"Low-dose amitriptyline is a standard first-line drug for fibromyalgia because it may improve sleep and reduce widespread pain.","w":["Trigger-point injections are not first-line for a diffuse pain syndrome.","Opioids are generally ineffective and risk dependence.","CORRECT","NSAIDs have limited benefit because fibromyalgia is not inflammatory.","Gabapentin may help but is not the book’s preferred first step."],"p":["Education and graded exercise are core treatments.","Amitriptyline can improve sleep and pain.","Avoid long-term opioids.","Address fatigue, mood and sleep together."],"m":"Fibromyalgia: low-dose amitriptyline is a classic first-line option."},{"q":"A 3-year-old boy presents for circumcision. He is previously fit and well, and weighs approximately 10 kg. You decide to give him intravenous paracetamol intraoperatively.<br><br><strong>Which of the following is the correct dose?</strong>","o":["150 mg","200 mg","75 mg","100 mg","500 mg"],"a":2,"e":"For a child under 10 kg, the book uses an IV paracetamol dose of 7.5 mg/kg. At 10 kg this is 75 mg.","w":["150 mg equals 15 mg/kg and is too high for the under-10-kg IV regimen.","200 mg is excessive.","CORRECT","100 mg is not the specified weight-based dose.","500 mg is a major overdose for this child."],"p":["IV paracetamol dosing differs by age and weight.","Under 10 kg: 7.5 mg/kg per dose.","Check maximum daily dose and dosing interval.","Use the child’s actual measured weight."],"m":"10 kg child: IV paracetamol 7.5 mg/kg = 75 mg."},{"q":"A 49-year-old diabetic man with peripheral vascular disease presents for right below knee amputation. He has been in severe pain in his right leg for several months and no oral analgesia has provided any relief. An epidural is to be commenced preoperatively and continued into the postoperative period.<br><br><strong>Which of the following factors increase his risk of developing chronic post surgical pain?</strong>","o":["Severe preoperative pain","Increasing age","Male gender","Use of an epidural","Diabetes mellitus"],"a":0,"e":"Severe and prolonged preoperative pain is a strong predictor of chronic postsurgical pain because central sensitisation may already be established.","w":["CORRECT","Younger rather than older age is generally associated with greater risk.","Female rather than male sex is more often associated with increased risk.","Good regional analgesia may reduce acute pain and is not a risk factor.","Diabetes may cause neuropathy but is not the strongest recognised factor listed."],"p":["Pre-existing pain is a major risk factor.","Severe acute postoperative pain also predicts chronic pain.","Younger age and female sex increase risk in many studies.","Good perioperative analgesia may reduce sensitisation."],"m":"The strongest listed predictor of chronic postsurgical pain is severe preoperative pain."},{"q":"A 30-year-old man has sustained a partial brachial plexus injury to his left arm. He describes constant, sharp pain with spontaneous burning and shock-like symptoms. Light touch elicits painful episodes and there are constant tingling sensations.<br><br><strong>Which of these statements about pain classifications would apply?</strong>","o":["Neuropathic pain requires a disease or lesion of the somatosensory system to be present","Dysaesthesias are not always unpleasant","Paraesthesia is usually painful","Complex regional pain syndrome results from serious trauma","Hyperalgesia is pain from a non-painful stimuli"],"a":0,"e":"Neuropathic pain is caused by a lesion or disease of the somatosensory nervous system. His brachial plexus injury therefore fits the definition.","w":["CORRECT","Dysaesthesia is by definition an unpleasant abnormal sensation.","Paraesthesia is an abnormal sensation that is not necessarily painful.","CRPS may follow minor trauma and severity is disproportionate.","Pain from a normally non-painful stimulus is allodynia, not hyperalgesia."],"p":["Allodynia: pain from non-painful stimulus.","Hyperalgesia: exaggerated pain from a painful stimulus.","Paraesthesia need not be unpleasant.","Dysaesthesia is unpleasant."],"m":"Neuropathic pain requires a somatosensory lesion or disease."},{"q":"A 33-year-old man is brought to the emergency department with an 18% body surface area (BSA) burn.<br><br><strong>Regarding fluid resuscitation, what is the most appropriate statement?</strong>","o":["The Parkland formula should not be used as he is an adult with <20% BSA burn","4 mL/kg/% burn predicts the fluid required in the first 24 hours. Half the fluid should be given in the first 8 hours and the remaining half over the next 16 hours from presentation to hospital","Fluid requirement should be calculated as per the Baxter formula: 4 mL/kg/% burn. Half the fluid should be given in the first 8 hours and the remaining half over the next 16 hours from the time of burn","Fluid requirement should be calculated as per the modified Brooke formula: 2 mL/kg/% burn","Fluid requirement should be calculated as per the Parkland formula. Half should be given as colloid and the other half as crystalloid to reduce the complications of massive fluid resuscitation"],"a":2,"e":"The Baxter/Parkland formula is 4 mL/kg/%TBSA for the first 24 hours. Give half in the first 8 hours and half over the next 16 hours, timed from the burn.","w":["Adults near 20% TBSA may require formal IV resuscitation; this absolute statement is incorrect.","Timing is from injury, not hospital presentation.","CORRECT","Modified Brooke exists but is not the standard answer requested here.","Parkland initially uses crystalloid, not half colloid."],"p":["Calculate from time of burn.","Use crystalloid initially.","Half the volume is due by 8 hours.","Titrate formula to urine output and physiology."],"m":"Parkland/Baxter: 4 mL/kg/%TBSA, timed from injury."},{"q":"During the initial surgical dissection of an aortic abdominal aneurysm, the surgeon warns you that he needs to apply the aortic cross-clamp above the coeliac arteries, following which the patient undergoes significant haemodynamic changes.<br><br><strong>What are the changes in left ventricle preload and afterload that are caused by the aortic cross-clamp?</strong>","o":["Increased preload, increased afterload","Decreased preload, increased preload","No change in preload or afterload","No change in preload, increased afterload","Increased preload, decreased afterload"],"a":0,"e":"Supracoeliac cross-clamping abruptly increases systemic vascular resistance and afterload. Blood is displaced centrally, increasing venous return and LV preload.","w":["CORRECT","The option is internally inconsistent and does not describe the expected response.","Both preload and afterload change significantly.","Preload generally rises due to central blood redistribution.","Afterload rises rather than falls."],"p":["Higher clamp = greater haemodynamic effect.","Afterload rises sharply.","Central blood redistribution raises preload.","Myocardial ischaemia risk increases."],"m":"Supracoeliac clamping increases both LV preload and afterload."},{"q":"A 45-year-old chronic alcoholic in the emergency department was found lying unconscious on the floor of his flat amidst claims that he was not contactable for almost 48 hours. On arrival his Glasgow coma scale (GCS) is 8 (eyes 1; verbal 3; motor 4). He has a heart rate of 104 beats per minute and a blood pressure of 80/60 mmHg. His blood gas shows severe metabolic acidosis and hyperkalaemia. His urine output in the last hour has been 5 mL and is brown in colour.<br><br><strong>The most appropriate investigation would be:</strong>","o":["Creatine kinase","Urinary haem","Myoglobinuria","Blood urea","Alkaline phosphatase"],"a":0,"e":"Prolonged immobilisation, brown urine, hyperkalaemia, acidosis and AKI suggest rhabdomyolysis. Creatine kinase is the key investigation and correlates with muscle injury severity.","w":["CORRECT","Urine dipstick haem may be positive but is not specific.","Direct urine myoglobin testing is unreliable and may become negative rapidly.","Urea assesses renal dysfunction but not the cause.","Alkaline phosphatase is unrelated."],"p":["Rhabdomyolysis causes hyperkalaemia and AKI.","CK is the key diagnostic test.","Urine may be dipstick-positive for blood without red cells.","Treat early with IV crystalloid and monitor electrolytes."],"m":"Prolonged collapse + brown urine + hyperkalaemia = check creatine kinase."},{"q":"A malnourished 93-year-old man with dementia complains of lethargy, breathlessness, myalgia and bone pain, and has petechiae, bleeding gums and gingivitis.<br><br><strong>Which of the following nutritional deficiencies would most likely be attributed to this clinical condition?</strong>","o":["Ascorbic acid","Iron","Thiamine","Vitamin A","Vitamin D"],"a":0,"e":"Bleeding gums, petechiae, poor connective-tissue integrity, myalgia and bone pain are classic features of vitamin C deficiency (scurvy).","w":["CORRECT","Iron deficiency causes anaemia but not the characteristic gum and skin findings.","Thiamine deficiency causes beriberi or Wernicke encephalopathy.","Vitamin A deficiency causes night blindness and xerosis.","Vitamin D deficiency causes osteomalacia but not petechiae and bleeding gums."],"p":["Vitamin C is required for collagen hydroxylation.","Scurvy causes gingival bleeding and perifollicular haemorrhage.","Bone and muscle pain can occur.","Elderly malnourished patients are at risk."],"m":"Bleeding gums + petechiae in malnutrition = vitamin C deficiency."}],"4":[{"q":"A 32-year-old man is admitted to the intensive care unit. 2 weeks ago he suffered a bout of gastroenteritis, following which he noticed bilateral leg pain and weakness which then progressed proximally and he soon had difficulty coughing and swallowing. Since admission he has been persistently tachycardic and sweaty with episodes of hypertension and hypotension.<br><br><strong>Which of the following clinical features is most likely to confirm his diagnosis?</strong>","o":["Progressive areflexic weakness in more than one limb","Progressive rise in CSF protein levels >0.4 g/L","Symmetrical weakness","Autonomic dysfunction","Bulbar palsy"],"a":0,"e":"The history is classical for Guillain–Barré syndrome. The defining clinical feature is progressive weakness with areflexia in more than one limb.","w":["CORRECT","Raised CSF protein supports the diagnosis but is not the key clinical confirmation.","Symmetry supports GBS but is not diagnostic by itself.","Autonomic dysfunction is common but not required for diagnosis.","Bulbar involvement may occur but is not the defining feature."],"p":["GBS usually follows a respiratory or gastrointestinal infection.","Core diagnosis: progressive limb weakness plus areflexia.","CSF protein rises after several days.","Watch for respiratory and autonomic failure."],"m":"Progressive weakness plus areflexia in more than one limb is the key diagnostic feature of GBS."},{"q":"A 44-year-old woman with a past history of hypothyroidism has suffered a traumatic brain injury and is on the neurointensive care unit. She had an isolated seizure following a blunt force to her cranium and remains intubated and ventilated. She is clinically euvolaemic but her investigations reveal the following:<br><br>• Serum sodium 122 mmol/L<br>• Serum osmolality 270 mOsm/kg<br>• Urine osmolality 300 mOsm/kg<br><br><strong>Which of the following is the most likely cause of her biochemical derangement?</strong>","o":["Hypotonic fluid administration","Syndrome of inappropriate antidiuretic hormone secretion (SIADH)","Cerebral salt-wasting syndrome (CSWS)","Phenytoin administration","Myxoedema"],"a":1,"e":"Euvolaemic hypotonic hyponatraemia with urine that remains inappropriately concentrated after brain injury is most consistent with SIADH.","w":["Hypotonic fluids can cause hyponatraemia but do not best fit this euvolaemic pattern.","CORRECT","CSWS usually produces hypovolaemia and high urine output.","Phenytoin can contribute to hyponatraemia but is less likely here.","Myxoedema is possible in severe untreated hypothyroidism but is not the best fit."],"p":["SIADH: low serum sodium and osmolality with inappropriately concentrated urine.","SIADH is usually euvolaemic.","CSWS is distinguished by hypovolaemia and renal salt loss.","Treat SIADH mainly with fluid restriction."],"m":"Brain injury + euvolaemic hypotonic hyponatraemia = SIADH."},{"q":"You are asked to see a 60-year-old woman with a suspected myocardial infarction. She is known to have a permanent pacemaker and implantable cardioverter-defibrillator (ICD). Shortly after arriving she suffers a cardiac arrest. The monitor shows ventricular fibrillation.<br><br><strong>Which of the following best describes the optimum position of the defibrillation pads?</strong>","o":["Anterior-posterior position","Directly over the pacemaker","At least 8 cm from the generator position","Anterior-lateral position","No defibrillation pads should be applied"],"a":2,"e":"Defibrillation must not be delayed. Pads should be placed at least 8 cm from the pacemaker/ICD generator to reduce the risk of device damage.","w":["Either standard position may be used provided the pads are kept away from the generator.","Never place a pad directly over the device.","CORRECT","Anterior-lateral is acceptable only if the pad remains sufficiently far from the generator.","An ICD does not remove the need for external defibrillation."],"p":["Shock VF immediately.","Keep pads at least 8 cm from the generator.","Do not place pads directly over an implanted device.","Check device function after resuscitation."],"m":"Defibrillate as normal, but keep pads ≥8 cm from the pacemaker/ICD."},{"q":"A 7-year-old child is experiencing breathing difficulties. After suffering from coryza and a 3-day low-grade fever, his parents noticed a rapid deterioration in his breathing overnight. He is now stridulous with a high-grade fever and is producing copious secretions. He is lying flat, moving his neck freely and there is no response to nebulised adrenaline and steroids.<br><br><strong>What is the most likely diagnosis?</strong>","o":["Epiglottitis","Viral croup","Bronchiolitis","Retropharyngeal abscess","Bacterial tracheitis"],"a":4,"e":"A toxic child with rapid deterioration after a viral prodrome, high fever, stridor and copious secretions who can lie flat is typical of bacterial tracheitis.","w":["Epiglottitis usually causes drooling, dysphagia and a child sitting forward.","Croup is usually younger, has a barking cough and often responds to adrenaline/steroids.","Bronchiolitis is a lower-airway disease in children under 2 years and does not cause stridor.","Retropharyngeal abscess often causes painful or restricted neck movement.","CORRECT"],"p":["Bacterial tracheitis often follows a viral prodrome.","Think thick purulent tracheal secretions and rapid deterioration.","Do not agitate a child with critical upper-airway obstruction.","Early ENT and experienced anaesthetic help are essential."],"m":"Stridor + high fever + copious secretions + lying flat = bacterial tracheitis."},{"q":"You are involved in a critical incident in the neuroradiology suite. A patient undergoing an angiogram received a total of 7 mg/kg of plain lignocaine to anaesthetise the groin for femoral arterial access. The patient then lost cardiac output which returned following administration of intravenous lipid emulsion, according to national guidelines. They have since been transferred to the intensive care unit.<br><br><strong>Which of the following describes your most appropriate action immediately after the event?</strong>","o":["Report the case to the NHS Commissioning Board Special Health Authority","Ensure that you have fully documented the event in the patient records","Contact your medical indemnity provider","Organise an ‘after action review’ with all personnel involved","Instigate the local reporting mechanism for critical incidents"],"a":1,"e":"Full contemporaneous documentation in the patient record is the immediate priority because it provides the factual basis for all later reporting, review and risk management.","w":["National reporting may follow the local process.","CORRECT","Indemnity advice may be appropriate later but is not the first action.","An after-action review is useful but depends on accurate documentation.","Local incident reporting is essential, but first ensure the clinical record is complete."],"p":["Document facts, timings, doses and treatment contemporaneously.","Then complete local incident reporting.","Root-cause analysis relies on accurate records.","Reviews should be blame-free and system focused."],"m":"After a critical incident, first complete full contemporaneous documentation."},{"q":"An 80-year-old man for an open oesophagectomy has a cardiopulmonary exercise test (CPET) as follows:<br><br>• Anaerobic threshold (AT) 10 mL/kg/min<br>• Peak oxygen consumption (VO₂ max) is 75% of that predicted<br><br><strong>When describing the results the most correct description includes:</strong>","o":["His AT gives him a higher rate of complications","His AT gives him a higher risk of death","His VO₂ max gives him a low risk of death","His VO₂ max is associated with the highest risk of complications","He should be nursed in intensive care postoperatively"],"a":1,"e":"An anaerobic threshold below about 11 mL/kg/min is associated with increased postoperative mortality. His VO₂ max of 75% predicted is not in the highest-risk range.","w":["AT is more strongly linked to mortality in the book’s discussion.","CORRECT","A VO₂ max of 75% predicted does not independently guarantee low mortality.","The highest-risk VO₂ max is below about 60% predicted.","Critical care may be appropriate, but this is not the most precise interpretation of the result."],"p":["AT is relatively independent of patient effort.","AT <11 mL/kg/min suggests increased postoperative mortality.","VO₂ max <60% predicted predicts poor outcome.","Interpret CPET as a whole, not one value alone."],"m":"AT <11 mL/kg/min = increased postoperative mortality risk."},{"q":"A 76-year-old frail lady is undergoing an awake fibreoptic nasal intubation. She received intravenous glycopyrrolate as an antisialagogue and midazolam for anxiolysis. Her nasal mucosa was prepared with co-phenylcaine, and the anaesthetist is using a “spray as you go” and nebuliser anaesthetic technique with lignocaine. Remifentanil is used for sedation. She suddenly complains of lightheadedness, tinnitus, confusion and peri-oral paraesthesia.<br><br><strong>Which is the most likely drug responsible for her symptoms?</strong>","o":["Glycopyrrolate","Midazolam","Lignocaine","Phenylephrine","Remifentanil"],"a":2,"e":"Peri-oral paraesthesia, tinnitus and confusion are early CNS features of lignocaine systemic toxicity after cumulative topical dosing.","w":["Glycopyrrolate has minimal central effects because it poorly crosses the blood–brain barrier.","Midazolam usually causes sedation and amnesia.","CORRECT","Phenylephrine more commonly causes hypertension and reflex bradycardia.","Remifentanil causes sedation and respiratory depression rather than these excitatory symptoms."],"p":["Add all lignocaine from every preparation and route.","Elderly patients are more susceptible to toxicity.","Early LAST symptoms: tinnitus, circumoral numbness and confusion.","Stop local anaesthetic administration immediately."],"m":"Tinnitus + circumoral paraesthesia during airway topicalisation = lignocaine toxicity."},{"q":"A 45-year-old man is brought to the emergency department following a 30 minute out-of-hospital cardiac arrest. He has a return of spontaneous circulation, is intubated, has a blood pressure of 110/60 mmHg, a heart rate of 80 beats per minute in sinus rhythm, GCS 3/15, blood glucose 5 mmol/L and core temperature of 34.6°C.<br><br><strong>What is the most appropriate step to consider post-cardiac arrest management?</strong>","o":["Transfer the patient to intensive care for further management","Start surface cooling with ice packs","Insert an arterial and central line","Call his family and discuss likelihood of poor prognosis","Start sedation and muscle relaxation"],"a":4,"e":"Post-arrest temperature management requires prevention of shivering and cerebral metabolic stress. Sedation and neuromuscular blockade are the most appropriate immediate measures listed.","w":["ICU transfer is necessary but does not itself control shivering or cerebral metabolic demand.","He is already mildly hypothermic; uncontrolled surface cooling is not the key step.","Invasive monitoring is useful but not the immediate priority.","Early neurological prognostication is unreliable.","CORRECT"],"p":["Use controlled targeted temperature management.","Prevent fever after cardiac arrest.","Sedation reduces cerebral metabolic demand.","Neuromuscular blockade prevents shivering when needed."],"m":"Post-arrest temperature control requires sedation and prevention of shivering."},{"q":"A 76-year-old man has undergone an arthroscopic acromioclavicular joint decompression. He had an interscalene block and a general anaesthetic. His past medical history includes obesity, moderate chronic obstructive pulmonary disease (COPD) and obstructive sleep apnoea (not on CPAP). In the recovery room he is awake, but struggling to breathe. He has four twitches and no fade to peripheral nerve stimulation, and saturations are 96% on oxygen via facemask. There is minimal wheeze on auscultation.<br><br><strong>The best treatment is likely to involve:</strong>","o":["Another dose of neostigmine reversal","Perform an arterial blood gas analysis","BiPAP until the block wears off","CPAP until opioid free","Nebulisers and steroids"],"a":2,"e":"The interscalene block has likely caused phrenic nerve palsy and hemidiaphragmatic paralysis. In an obese COPD/OSA patient, BiPAP supports both oxygenation and ventilation until the block resolves.","w":["Neuromuscular monitoring shows adequate reversal.","An ABG may help assess severity but is not treatment.","CORRECT","CPAP does not provide the same ventilatory assistance as BiPAP.","Minimal wheeze makes bronchospasm unlikely."],"p":["Interscalene block commonly blocks the ipsilateral phrenic nerve.","Risk is higher in obesity and respiratory disease.","BiPAP supports ventilation until block resolution.","Avoid high-volume interscalene block in marginal respiratory reserve."],"m":"Respiratory distress after interscalene block = consider phrenic palsy and use BiPAP."},{"q":"A 70-year-old man is to have a number of tendons repaired in his hand. After discussion with the patient, a regional anaesthetic technique has been agreed; your preferred approach is an infraclavicular block under ultrasound guidance.<br><br><strong>Which part of the brachial plexus is most likely to be blocked by this approach?</strong>","o":["Roots","Trunks","Divisions","Cords","Branches"],"a":3,"e":"The infraclavicular approach targets the lateral, medial and posterior cords around the axillary artery.","w":["Roots are targeted by interscalene approaches.","Trunks are targeted by supraclavicular approaches.","Divisions lie behind the clavicle and are not reliably targeted.","CORRECT","Terminal branches are targeted in the axilla."],"p":["Interscalene = roots/trunks.","Supraclavicular = trunks/divisions.","Infraclavicular = cords.","Axillary = terminal branches."],"m":"Infraclavicular block targets the cords."},{"q":"A 20 kg 5-year-old is admitted to the emergency department with a fractured femur following a bicycle fall. His leg was splinted prior to arrival and he received two crystalloid boluses of 400 mL. He has a respiratory rate of 40 breaths per minute, a capillary refill time of 4 seconds and heart rate of 160 beats per minute.<br><br><strong>What is the next step in the resuscitation phase while waiting for surgery?</strong>","o":["A further bolus of 200 mL of colloid","200 mL bolus of O negative blood","Call the transfusion lab and order crossmatched blood, fresh frozen plasma and platelets","Change the temporary femoral splint to a plaster of paris cast","Insert an arterial line"],"a":1,"e":"He has already received 40 mL/kg crystalloid and remains shocked. The next step is packed red cells at 10 mL/kg, which equals 200 mL.","w":["Further clear fluid after 40 mL/kg risks dilution without restoring oxygen-carrying capacity.","CORRECT","Crossmatched blood and components take time; immediate uncrossmatched blood is required.","Changing the splint may disturb the fracture and worsen bleeding.","An arterial line does not treat shock."],"p":["Paediatric blood bolus: 10 mL/kg.","After 40 mL/kg crystalloid without response, give blood.","Use O-negative blood when crossmatched blood is unavailable.","Treat femoral fractures as a significant blood-loss source."],"m":"20 kg child still shocked after 40 mL/kg crystalloid: give 200 mL O-negative blood."},{"q":"You are caring for a 35-year-old patient on the neurointensive care unit who has a serious traumatic brain injury following an assault.<br><br><strong>According to the Academy of Medical Royal Colleges 2008 Code of Practice for the Diagnosis and Confirmation of Death, brainstem death should only be diagnosed when:</strong>","o":["The blood glucose is 4.0–8.0 mmol/L","Prior to an apnoea test the PaCO₂ must be 6.0–8.0 kPa and the arterial pH 7.20–7.40","Two complete sets of tests have been performed a minimum of 4 hours apart","The serum sodium is >124 mmol/L","After 5 minutes of observed apnoea the PaO₂ is <8 kPa"],"a":1,"e":"Before the apnoea test, PaCO₂ should be 6.0–8.0 kPa and arterial pH 7.20–7.40. This ensures an adequate respiratory stimulus.","w":["The acceptable glucose range is wider.","CORRECT","Two sets are required but there is no fixed minimum interval.","The acceptable sodium range is much wider than this single threshold.","Oxygenation must remain adequate; a low PaO₂ invalidates the test."],"p":["Exclude reversible causes of coma.","Core temperature must be adequate.","Two complete sets of tests are required.","Apnoea testing requires adequate PaCO₂, pH, oxygenation and MAP."],"m":"Before apnoea testing: PaCO₂ 6–8 kPa and pH 7.20–7.40."},{"q":"A 47-year-old woman collapsed due to a grade 3 sub-arachnoid haemorrhage. An extra-ventricular drain was inserted and she is ventilated on the intensive care unit. On examination the blood pressure is 90/60 mmHg, heart rate is 110 beats per minute and the peripheral capillary refill time is 6 seconds. She has passed 1000 mL of urine since catheterisation 4 hours ago.<br><br><strong>What is the most useful course of action?</strong>","o":["Insert a femoral central line and commence a noradrenaline infusion","Request urinary and plasma osmolarity measurements","Administer 20 mL/kg intravenous crystalloid","Request urinary sodium concentration measurement","Administer intravenous desmopressin (DDAVP) 0.4 mg"],"a":1,"e":"Polyuria after SAH suggests diabetes insipidus. Paired plasma and urine osmolality best confirms the diagnosis and guides treatment.","w":["Vasopressors may support BP but do not identify the cause.","CORRECT","Fluid may be required, but the question asks for the most useful diagnostic action.","Urine sodium alone does not distinguish DI reliably.","DDAVP should follow confirmation or very strong clinical evidence; the stated dose is also inappropriate."],"p":["DI after SAH causes high-volume dilute urine.","Expect high plasma and low urine osmolality.","Check sodium as well as osmolality.","Treat central DI with desmopressin and fluid replacement."],"m":"Polyuria after SAH: confirm DI with paired plasma and urine osmolality."},{"q":"A 67-year-old woman presents with an acute onset illness and progressive physiological deterioration. She has a pyrexia of 39.7°C, a heart rate of 135 beats per minute (in atrial fibrillation), a systemic blood pressure of 85/48 mmHg, a respiratory rate of 28 breaths per minute, oxygen saturations of 89% on a non-rebreathe reservoir face mask with oxygen at 15 L/min, is drowsy and has a capillary blood glucose of 12.2 mmol/L.<br><br><strong>The best choice of fluid type to bolus as a first step in cardiovascular resuscitation would be:</strong>","o":["0.9% sodium chloride","A balanced crystalloid","A gelatin solution","4.5% human albumin in 0.9% sodium chloride","A starch solution"],"a":1,"e":"This is septic shock. A balanced crystalloid is the preferred initial resuscitation fluid because it avoids the large chloride load of 0.9% saline.","w":["Large volumes of saline can produce hyperchloraemic acidosis.","CORRECT","Gelatins offer no proven benefit and carry reaction risk.","Albumin has no clear survival advantage for initial sepsis resuscitation.","Starches are associated with renal harm and are avoided."],"p":["Use crystalloid first in septic shock.","Balanced solutions reduce chloride exposure.","Give boluses with frequent reassessment.","Avoid starch solutions in sepsis."],"m":"Initial septic shock fluid: balanced crystalloid."},{"q":"A 54-year-old man with known alcoholic liver disease presents to the emergency department with confusion. On examination he has stigmata of decompensated liver disease and is oedematous with marked ascites. His respiratory rate is 30 breaths per minute, the oxygen saturations are 94% on air, his blood pressure is 90/60 mmHg and his heart rate is 120 beats per minute. After catheterisation he produces 10 mL of urine in the first hour.<br><br><strong>What would be the most useful investigation to establish the cause of his confusion?</strong>","o":["CT head","Rectal examination","Arterial blood gas","Renal function tests","Amylase"],"a":1
